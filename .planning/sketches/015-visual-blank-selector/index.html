<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketch 015 — Picking a blank by sight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link id="theme-link" rel="stylesheet" href="../themes/app-slate.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--color-page); color: var(--color-text); font-family: var(--font-sans); min-height: 100vh; }
  button, input, select { font-family: inherit; }

  /* ---------- sketch chrome (not part of the design) ---------- */
  #chrome { position: sticky; top: 0; z-index: 9998; }
  #variant-nav { display: flex; gap: 6px; align-items: center; padding: 8px 16px; background: #0d0f14; border-bottom: 1px solid #262a33; font: 13px/1.2 system-ui, sans-serif; color: #cfd5de; flex-wrap: wrap; position: relative; }
  #variant-nav .sketch-id { font-weight: 700; margin-right: 8px; color: #fff; }
  .variant-tab { background: #1b1f27; color: #cfd5de; border: 1px solid #2c313b; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  .variant-tab:hover { border-color: #4b5361; color: #fff; }
  .variant-tab.active { background: #234f66; border-color: #3490bc; color: #fff; }
  .variant-tab.winner { border-color: #c9a227; }
  .notes-btn { margin-left: auto; }
  #sketch-bar { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 7px 16px; background: #14171d; border-bottom: 1px solid #262a33; font: 12px/1.3 system-ui, sans-serif; color: #aeb5c0; }
  .grp { display: flex; align-items: center; gap: 6px; }
  .seg { display: inline-flex; border: 1px solid #2f343e; border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
  .seg button { background: transparent; color: #aeb5c0; border: 0; padding: 4px 8px; font: 12px system-ui, sans-serif; cursor: pointer; }
  .seg button + button { border-left: 1px solid #2f343e; }
  .seg button:hover { color: #fff; background: #222731; }
  .seg button.on { background: #234f66; color: #fff; }
  #notes-panel { display: none; position: absolute; right: 12px; top: calc(100% + 6px); width: min(470px, calc(100vw - 24px)); max-height: 72vh; overflow-y: auto; background: #12151b; color: #dfe3ea; border: 1px solid #2c313b; border-radius: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.5); padding: 14px 16px; font: 13.5px/1.5 system-ui, sans-serif; }
  #notes-panel.open { display: block; }
  #notes-panel h2 { font-size: 14px; margin: 0 0 6px; color: #fff; }
  #notes-panel h3 { font-size: 12px; margin: 12px 0 4px; letter-spacing: .05em; color: #fff; text-transform: uppercase; }
  #notes-panel p, #notes-panel ul { margin: 0 0 8px; color: #aeb5c0; }
  #notes-panel ul { padding-left: 18px; }
  #notes-panel b { color: #dfe3ea; }
  #sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font: 12px system-ui, sans-serif; background: rgba(0,0,0,0.82); color: #fff; padding: 6px 8px; border-radius: 8px; opacity: .75; display: flex; flex-direction: column; gap: 6px; }
  #sketch-tools:hover, #sketch-tools.open { opacity: 1; }
  #sketch-tools:not(.open) .row { display: none; }
  #tools-toggle { align-self: flex-end; }
  #sketch-tools .row { display: flex; gap: 4px; align-items: center; }
  #sketch-tools .row > span:first-child { width: 70px; color: #aeb5c0; }
  #sketch-tools button, #tools-toggle { font: 11px system-ui, sans-serif; background: #22262e; color: #fff; border: 1px solid #3a404b; border-radius: 4px; padding: 3px 6px; cursor: pointer; }
  #sketch-tools button.on { background: #234f66; border-color: #3490bc; }
  #stage { padding: 16px 16px 80px; }
  .intro { max-width: 1280px; margin: 0 auto 12px; font: 14px/1.5 system-ui, sans-serif; color: var(--color-text-muted); }
  .intro b { color: var(--color-text); font-weight: 600; }
  .compare { display: flex; gap: 18px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  .compare figure { margin: 0; }
  .compare figcaption { font: 600 13px system-ui, sans-serif; color: var(--color-text); margin: 0 0 6px; }
  .scaler { position: relative; }
  .scaler > .device { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  body.on-phone #stage { padding: 0; }
  body.on-phone .intro { display: none; }
  body.on-phone #variant-nav { padding: 6px 12px; }
  body.on-phone #sketch-bar { padding: 6px 12px; }
  body.on-phone #sketch-bar.closed { display: none; }
  body.on-phone #variant-nav { gap: 5px; flex-wrap: nowrap; }
  body.on-phone .variant-tab { padding: 6px 8px; }
  body.on-phone .device.side { border-radius: 0; border: 0; box-shadow: none; }
  body.on-phone #sketch-tools { display: none; }

  /* ---------- the design: the app's own tokens ---------- */
  :root {
    --foam: color-mix(in srgb, var(--color-text-muted) 24%, transparent);
    --blank-line: color-mix(in srgb, var(--color-text-muted) 60%, transparent);
    --station: color-mix(in srgb, var(--color-text-muted) 36%, transparent);
    --line-faint: color-mix(in srgb, var(--color-line) 40%, transparent);
  }
  .device { margin: 0 auto; background: var(--color-bg); color: var(--color-text); border: 1px solid #000; box-shadow: 0 18px 50px rgba(0,0,0,.45); overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .device.computer { width: 1280px; height: 800px; border-radius: 10px; }
  .device.phone { width: 390px; height: 664px; border-radius: 30px; }
  .device.side { width: 844px; height: 340px; border-radius: 26px; }
  body.on-phone .device.phone { border-radius: 0; border: 0; box-shadow: none; }

  /* top bars */
  .topbar { height: 64px; flex: none; display: flex; align-items: center; padding: 0 28px; gap: 18px; border-bottom: 1px solid var(--color-border); background: var(--color-bg); }
  .device.phone .topbar, .device.side .topbar { height: 48px; padding: 0 14px; gap: 10px; }
  .wordmark { font-size: 21px; letter-spacing: -0.02em; white-space: nowrap; }
  .wordmark b { font-weight: 800; }
  .wordmark small { font-size: 9px; margin-left: 1px; color: var(--color-text-muted); }
  .topnav { margin-left: auto; display: flex; gap: 20px; align-items: center; font-size: 11.5px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-text-muted); }
  .topnav span.on { color: var(--color-text); border-bottom: 2px solid var(--color-text); padding-bottom: 2px; }
  .topnav .sep { width: 1px; height: 18px; background: var(--color-border); }
  .save { background: var(--color-primary); color: var(--color-on-primary); border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 600; font-size: 14px; }
  .device.phone .save, .device.side .save { margin-left: auto; padding: 9px 16px; }
  .ham { font-size: 22px; color: var(--color-text-muted); padding-left: 10px; border-left: 1px solid var(--color-border); }

  /* the shell */
  .shell { flex: 1; min-height: 0; display: flex; }
  .device.phone .shell { flex-direction: column; }
  .sidebar { width: 340px; flex: none; padding: 26px 30px 24px; overflow-y: auto; background: var(--color-surface); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 10px; }
  .device.side .sidebar { padding: 14px 18px 24px; }
  .device.phone .sidebar { width: auto; flex: 1; border-right: 0; padding: 16px 16px 30px; border-top: 1px solid var(--color-border); }
  .sidebar > * { flex-shrink: 0; }
  .sidebar h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; }
  .sidebar .sub { margin: -4px 0 0; font-size: 13px; line-height: 1.4; color: var(--color-text-muted); }
  .sidebar .boardline { font-size: 12px; color: var(--color-text-muted); }
  .sect { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--color-line); font-size: 12px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; }
  .sect::after { content: "▾"; font-size: 11px; color: var(--color-text-muted); }
  .sect.closed::after { content: "▸"; }
  .lblrow { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .valbox { border: 1px solid var(--color-line); border-radius: 6px; padding: 3px 10px; font-size: 13px; }
  .fake-range { height: 4px; border-radius: 2px; background: var(--color-line); position: relative; margin: 8px 0 4px; }
  .fake-range i { position: absolute; top: -5px; width: 14px; height: 14px; border-radius: 50%; background: var(--color-accent-ink); }
  .note { font-size: 12px; line-height: 1.45; color: var(--color-text-muted); }
  .note.fine { font-size: 11px; }
  .link { background: none; border: 0; padding: 0; color: var(--color-accent-ink); font-size: 11px; font-weight: 700; cursor: pointer; text-align: left; }
  .link.muted { color: var(--color-text-muted); }
  .links { display: flex; gap: 14px; flex-wrap: wrap; }
  .stepnav { display: flex; gap: 10px; margin-top: 12px; }
  .stepnav span { flex: 1; text-align: center; border: 1px solid var(--color-line); border-radius: 8px; padding: 10px 0; font-size: 12px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; }

  /* the blank button (A and B) */
  .blankbtn { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--color-line); border-left: 2px solid var(--color-accent-ink); border-radius: 6px; background: var(--color-well); color: var(--color-text); padding: 8px 10px 8px 8px; cursor: pointer; }
  .blankbtn:hover { filter: brightness(1.08); }
  .blankbtn.none { border-left-width: 1px; background: transparent; }
  .blankbtn .thumb { width: 92px; flex: none; }
  .blankbtn .thumb svg { width: 100%; height: auto; display: block; }
  .blankbtn .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .blankbtn .nm { font-size: 14px; font-weight: 600; display: flex; gap: 6px; align-items: baseline; }
  .blankbtn .nm .vol { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--color-text-muted); }
  .blankbtn .meta { font-size: 12px; color: var(--color-text-muted); }
  .blankbtn .go { font-size: 11px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-accent-ink); margin-top: 3px; }
  .device.phone .blankbtn, .device.side .blankbtn { min-height: 56px; }

  /* drawing column */
  .main { flex: 1; min-width: 0; padding: 12px; background: var(--color-canvas); display: flex; flex-direction: column; }
  .device.phone .main { flex: none; height: 372px; padding: 2px; }
  .device.side .main { padding: 4px 4px 4px 4px; }
  .tabs { display: flex; gap: 4px; align-items: flex-end; flex: none; }
  .tab { border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; padding: 6px 16px; font-size: 11.5px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-text-muted); background: transparent; cursor: pointer; white-space: nowrap; }
  .tab.on { border-color: var(--color-line); background: var(--color-surface); color: var(--color-text); }
  .device.phone .tab, .device.side .tab { padding: 3px 7px; font-size: 10.5px; letter-spacing: .1em; }
  .tabs .name { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--color-text-muted); padding: 0 8px 6px; white-space: nowrap; }
  .device.phone .tabs .name, .device.side .tabs .name { font-size: 11px; padding-bottom: 3px; }
  .panel { flex: 1; min-height: 0; border: 1px solid var(--color-line); border-radius: 0 10px 10px 10px; margin-top: -1px; background: var(--color-surface); padding: 10px; display: flex; flex-direction: column; position: relative; }
  .device.phone .panel, .device.side .panel { padding: 2px; }
  .drawing { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  .drawing > svg { max-width: 100%; max-height: 100%; display: block; }
  .inset { position: absolute; top: 10px; left: 50%; transform: translateX(-30%); width: 260px; padding: 6px 8px; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-surface); }
  .inset svg { width: 100%; height: auto; display: block; }
  .vcap { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: var(--color-text-muted); }
  .placeholder { margin: auto; text-align: center; font-size: 12px; color: var(--color-text-muted); max-width: 260px; line-height: 1.5; }

  /* ---------- the catalogue page (A's tab and B's popup) ---------- */
  .cat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .cat-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; border-bottom: 1px solid var(--color-border); }
  .cat-head h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; }
  .cat-head .for { font-size: 12px; color: var(--color-text-muted); }
  .cat-head .x { margin-left: auto; width: 36px; height: 36px; border: 1px solid var(--color-line); border-radius: 8px; background: transparent; color: var(--color-text); font-size: 18px; cursor: pointer; flex: none; }
  .device.phone .cat-head .x, .device.side .cat-head .x { width: 44px; height: 44px; }
  .device.phone .cat-head { padding: 6px 8px 6px 14px; flex-wrap: wrap; row-gap: 0; }
  .device.side .cat-head { padding: 4px 8px 4px 14px; }
  .device.phone .cat-head .for, .device.side .cat-head .for { width: 100%; order: 3; padding: 2px 0 4px; }
  .device.side .cat-head .for { width: auto; order: 0; margin: 0; padding: 0; }
  .fbar { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 10px 14px 8px; border-bottom: 1px solid var(--color-border); }
  .in-tab .fbar { padding: 4px 4px 8px; }
  .device.phone .fbar, .device.side .fbar { padding: 6px 8px; gap: 6px; }
  .fline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .device.phone .fline.chips, .device.side .fline.chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -8px; padding: 0 8px; }
  .fline.chips::-webkit-scrollbar { display: none; }
  .search { position: relative; flex: 1 1 220px; min-width: 160px; }
  .search input { width: 100%; height: 32px; border: 1px solid var(--color-line); border-radius: 6px; background: transparent; color: var(--color-text); padding: 0 10px 0 30px; font-size: 13px; }
  .search input::placeholder { color: var(--color-text-muted); }
  .search svg { position: absolute; left: 9px; top: 9px; width: 14px; height: 14px; stroke: var(--color-text-muted); fill: none; stroke-width: 2; }
  .device.phone .search input, .device.side .search input { height: 40px; font-size: 16px; }
  .device.phone .search svg, .device.side .search svg { top: 13px; }
  .count { font-size: 12px; color: var(--color-text-muted); white-space: nowrap; }
  .dialog .fline .count, .device.phone .fline .count, .device.side .fline .count { display: none; }
  /* a phone held sideways: one row of filters, the search first, everything sliding sideways */
  .device.side .fbar > .fline:first-child { display: none; }
  .device.side .fline.chips .search { flex: 0 0 210px; min-width: 0; }
  .device.side .cat-head h2 { font-size: 13px; }
  .chip { flex: none; height: 30px; border: 1px solid var(--color-line); border-radius: 999px; background: transparent; color: var(--color-text-muted); padding: 0 11px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .chip span { font-weight: 400; opacity: .8; }
  .chip.on { background: var(--color-primary); color: var(--color-on-primary); border-color: transparent; }
  .chip.set { color: var(--color-text); border-color: var(--color-text-muted); }
  .chip.open { outline: 2px solid var(--color-accent-ink); outline-offset: 1px; }
  .device.phone .chip, .device.side .chip { height: 36px; }
  .chip.sel { padding-right: 6px; }
  .chip select { border: 0; background: transparent; color: var(--color-text); font: 600 12px var(--font-sans); cursor: pointer; }
  .chip select option { background: var(--color-surface); color: var(--color-text); }
  .vseg { display: inline-flex; flex: none; border: 1px solid var(--color-line); border-radius: 999px; overflow: hidden; height: 30px; }
  .vseg button { display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; color: var(--color-text-muted); padding: 0 11px; font: 600 12px var(--font-sans); cursor: pointer; }
  .vseg button + button { border-left: 1px solid var(--color-line); }
  .vseg button.on { background: var(--color-primary); color: var(--color-on-primary); }
  .vseg svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .device.phone .vseg, .device.side .vseg { height: 40px; border-radius: 8px; }
  .device.phone .vseg button, .device.side .vseg button { font-size: 0; gap: 0; padding: 0 12px; }
  .device.phone .vseg svg, .device.side .vseg svg { width: 18px; height: 18px; }
  .fsep { width: 1px; height: 20px; background: var(--color-border); flex: none; }
  .drawer { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-well); font-size: 12px; }
  .drawer .rng { flex: 1 1 220px; display: flex; flex-direction: column; gap: 2px; }
  .drawer .rng b { font-size: 12px; font-weight: 600; }
  .drawer input[type=range] { width: 100%; accent-color: var(--color-accent-ink); margin: 2px 0; }
  .drawer .ends { display: flex; justify-content: space-between; color: var(--color-text-muted); font-size: 11px; }
  .cat-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 14px 24px; overscroll-behavior: contain; }
  .in-tab .cat-scroll { padding: 4px 4px 16px; }
  .device.phone .cat-scroll, .device.side .cat-scroll { padding: 2px 8px 24px; }
  .grp-label { padding: 12px 2px 6px; font-size: 10px; font-weight: 800; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-text-muted); }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .grid.rows { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .device.phone .grid { grid-template-columns: 1fr; gap: 8px; }
  .device.side .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .device.side .grid.rows { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .empty { padding: 30px 10px; text-align: center; font-size: 13px; color: var(--color-text-muted); }

  .card { position: relative; border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-bg); padding: 9px 10px 8px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; text-align: left; }
  .card:hover { border-color: var(--color-line); }
  .card.picked { border-color: var(--color-accent-ink); box-shadow: inset 2px 0 0 var(--color-accent-ink); background: var(--color-well); }
  .card .hd { display: flex; align-items: baseline; gap: 8px; padding-right: 30px; }
  .card .nm { font-size: 15px; font-weight: 700; }
  .card.greyed .nm { color: var(--color-text-muted); font-weight: 600; }
  .card .vol { margin-left: auto; font-size: 12px; color: var(--color-text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .card .mk { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); margin-top: -3px; }
  .card .art svg { width: 100%; height: auto; display: block; }
  .card .art { aspect-ratio: 3.1; display: flex; align-items: center; }
  .card .art.one { aspect-ratio: auto; }
  .card .line { font-size: 12px; color: var(--color-text); line-height: 1.35; }
  .card .line i { font-style: normal; color: var(--color-text-muted); }
  .card .why { font-size: 12px; line-height: 1.35; color: var(--color-warning-ink); }
  .card .here { font-size: 10px; font-weight: 800; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-accent-ink); }
  .star { position: absolute; top: 3px; right: 3px; width: 34px; height: 34px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .device.phone .star, .device.side .star { width: 44px; height: 44px; top: -2px; right: -2px; }
  .star svg { width: 19px; height: 19px; fill: none; stroke: var(--color-text-muted); stroke-width: 1.6; stroke-linejoin: round; }
  .star.on svg { fill: var(--color-text); stroke: var(--color-text); }
  .star:hover { background: var(--color-well); }
  table.st { border-collapse: collapse; width: 100%; font-size: 10.5px; font-variant-numeric: tabular-nums; }
  table.st th, table.st td { padding: 1px 2px; text-align: center; white-space: nowrap; }
  table.st th { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); border-bottom: 1px solid var(--line-faint); }
  table.st td:first-child, table.st th:first-child { text-align: left; color: var(--color-text-muted); font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding-left: 0; }
  .card.greyed table.st td { color: var(--color-text-muted); }

  /* upright rows (the earlier spec: a small upright drawing of outline and rocker side by side) */
  .card.up { flex-direction: row; gap: 10px; align-items: stretch; padding: 8px 10px 8px 8px; }
  .card.up .art { aspect-ratio: auto; flex: none; display: block; }
  .card.up .art svg { height: 150px; width: auto; }
  .device.computer .card.up .art svg { height: 170px; }
  .card.up .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .card.up .hd { padding-right: 34px; }
  .card.up .kv { font-size: 12px; line-height: 1.35; }

/* ---------- C: today's sidebar list, each row with a tiny drawing ---------- */
function cRow(v, device, r) {
  const b = r.b, up = uprightHere(device), picked = pickOf(v) === b.id, greyed = r.g !== "f";

function cList(v, device) {

  const all = filtered(listed(), { noRanges: true });

    <label class="srch">${SEARCH_ICON}<input type="search" data-act="q" placeholder="Search blanks — e.g. Marko, 6'2, EPS" value="${esc(state.f.q)}"></label>

    ${state.f.q ? "" : `<button class="link" data-act="cexpand">${ui.expanded ? "Show Fewer" : `Show all ${order.length} blanks`}</button>`}`;
}

/* ---------- the sketch shell ---------- */
function applyTheme() {
  const root = document.documentElement.style;
  if (!PALETTES[state.theme]) { for (const k of Object.keys(PALETTES.slate)) root.removeProperty(k); root.removeProperty("color-scheme"); return; }
  for (const [k, v] of Object.entries({ ...COMMON_VARS, ...PALETTES[state.theme] })) root.setProperty(k, v);
  root.setProperty("color-scheme", state.theme === "slate" ? "dark" : "light");
}
/** On a real phone the mock fills the screen and follows how the phone is held: upright or sideways. */
const onPhone = () => Math.min(window.innerWidth, window.innerHeight) < 500;
const phoneDevice = () => (window.innerWidth > window.innerHeight ? "side" : "phone");
function seg(id, key, opts) { return `<span class="seg" data-seg="${key}">${opts.map(([val, l]) => `<button class="${state[key] === val ? "on" : ""}" data-set="${key}" data-val="${val}">${l}</button>`).join("")}</span>`; }
function renderChrome() {
  const nav = document.getElementById("variant-nav");

  nav.innerHTML = ph
    ? `${VARIANTS.filter((v) => v.id !== "all").map((v) => `<button class="variant-tab${state.variant === v.id ? " active" : ""}" data-set="variant" data-val="${v.id}">${v.short}</button>`).join("")}<button class="variant-tab notes-btn" id="bar-btn">Options</button><button class="variant-tab" id="notes-btn">Notes</button><div id="notes-panel">${NOTES}</div>`
    : `<span class="sketch-id">015 · Picking a blank by sight</span>${VARIANTS.map((v) => `<button class="variant-tab${state.variant === v.id ? " active" : ""}${v.winner ? " winner" : ""}" data-set="variant" data-val="${v.id}">${v.label}</button>`).join("")}<button class="variant-tab notes-btn" id="notes-btn">Notes</button><div id="notes-panel">${NOTES}</div>`;
  document.getElementById("sketch-bar").classList.toggle("closed", ph && !barOpen);
  document.getElementById("sketch-bar").innerHTML = `
    ${onPhone() ? `<span class="grp">Turn the phone to try it sideways</span>` : `<span class="grp">Device ${seg("d", "device", DEVICES)}</span>`}
    <span class="grp">Your board ${seg("bd", "board", DATA.boards.map((b) => [b.id, b.id === "default" ? "Untitled 6'0\"" : b.name]))}</span>

    ${onPhone() ? `<span class="grp">Theme ${seg("th2", "theme", [["slate", "Slate"], ["daylight", "Daylight"], ...(window.__publish ? [["auto", "Follow phone"]] : [])])}</span><span class="grp">Units ${seg("un2", "units", [["imperial", "Imperial"], ["metric", "Metric"]])}</span><span class="grp">Stars <span class="seg"><button data-act="clearstars">Clear stars</button><button data-act="resetstars">Star three</button></span></span>` : ""}`;
  document.getElementById("t-theme").innerHTML = seg("th", "theme", [["slate", "Slate"], ["daylight", "Daylight"], ...(window.__publish ? [["auto", "Follow phone"]] : [])]);
  document.getElementById("t-units").innerHTML = seg("un", "units", [["imperial", "Imperial"], ["metric", "Metric"]]);
  document.getElementById("t-stars").innerHTML = `<span class="seg"><button data-act="clearstars">Clear stars</button><button data-act="resetstars">Star three</button></span>`;
}
const DEV_SIZE = { computer: [1280, 800], phone: [390, 664], side: [844, 340] };
function fitDevice(html, device, maxW) {
  const [w, h] = DEV_SIZE[device];
  const k = Math.min(1, maxW / w);
  if (k >= 0.999) return html;
  return `<div class="scaler" style="width:${(w * k).toFixed(0)}px;height:${(h * k).toFixed(0)}px;margin:0 auto">${html.replace('class="device', `style="transform:scale(${k.toFixed(4)})" class="device`)}</div>`;
}
function render() {
  const scrolls = {};

  document.querySelectorAll(".sidebar").forEach((el) => (scrolls["side-" + el.closest(".device").dataset.v + state.device] = el.scrollTop));
  const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.act : null;
  const caret = active === "q" ? document.activeElement.selectionStart : null;
  const activeV = active === "q" ? document.activeElement.closest(".device")?.dataset.v : null;
  applyTheme();
  renderChrome();
  if (onPhone() && state.variant === "all") state.variant = "b";
  document.body.classList.toggle("on-phone", onPhone());
  const stage = document.getElementById("stage");

    stage.innerHTML = `<div class="intro">${INTRO[state.variant]}</div>${fitDevice(page(state.variant, state.device), state.device, avail)}`;
  }

  document.querySelectorAll(".sidebar").forEach((el) => { const k = "side-" + el.closest(".device").dataset.v + state.device; if (scrolls[k] != null) el.scrollTop = scrolls[k]; });

  }

/* one set of listeners, wired once (a listener added on every rebuild made one tap act twice in sketch 011) */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-set],[data-act],#notes-btn,#bar-btn,#tools-toggle");
  if (!t) { document.getElementById("notes-panel")?.classList.remove("open"); return; }
  if (t.id === "bar-btn") { barOpen = !barOpen; document.getElementById("sketch-bar").classList.toggle("closed", !barOpen); render(); return; }
  if (t.id === "notes-btn") { document.getElementById("notes-panel").classList.toggle("open"); return; }
  if (t.id === "tools-toggle") { document.getElementById("sketch-tools").classList.toggle("open"); return; }
  if (t.dataset.set) {
    let val = t.dataset.val; if (val === "true") val = true; if (val === "false") val = false;
    state[t.dataset.set] = val;
    if (t.dataset.set === "variant") { state.ui.a.tab = "blanks"; state.ui.b.open = true; state.ui.c.listOpen = true; scrollToBlank = true; }
    if (t.dataset.set === "device") scrollToBlank = true;
    if (t.dataset.set === "board") { for (const v of ["a", "b", "c"]) delete state.ui[v].picked; state.f.len = null; state.f.nose = null; ART.clear(); }
    render(); return;
  }
  const act = t.dataset.act, v = t.dataset.v || t.closest(".device")?.dataset.v;
  if (act === "star") { e.stopPropagation(); const id = t.dataset.id; state.stars = isStar(id) ? state.stars.filter((s) => s !== id) : [...state.stars, id]; render(); return; }
  if (act === "pick") {
    if (e.target.closest(".star")) return;
    state.ui[v].picked = t.dataset.id;
    if (v === "b") state.ui.b.open = false; // picking a blank closes the popup and loads it
    if (v === "a") state.ui.a.tab = "viewer"; // …and on A, takes you back to VIEWER to see it
    if (v === "c") state.ui.c.listOpen = false;
    render(); return;
  }
  if (act === "browse") { if (v === "b") state.ui.b.open = true; else state.ui.a.tab = "blanks"; state.f.open = null; render(); return; }
  if (act === "close") { state.ui.b.open = false; render(); return; }
  if (act === "scrim") { if (e.target === t) { state.ui.b.open = false; render(); } return; }
  if (act === "tab") { state.ui[v].tab = t.dataset.tab; render(); return; }
  if (act === "remove") { state.ui[v].picked = null; render(); return; }
  if (act === "cchange") { state.ui.c.listOpen = !state.ui.c.listOpen; render(); return; }
  if (act === "cexpand") { state.ui.c.expanded = !state.ui.c.expanded; render(); return; }
  if (act === "maker") {
    const m = t.dataset.m, hid = state.f.hidden;
    if (hid.includes(m)) state.f.hidden = hid.filter((x) => x !== m);
    else if (hid.length < DATA.makers.length - 1) state.f.hidden = [...hid, m]; // keep at least one maker ticked, as Settings does
    render(); return;
  }
  if (act === "fopen") { state.f.open = state.f.open === t.dataset.k ? null : t.dataset.k; render(); return; }
  if (act === "rngreset") { state.f[t.dataset.k] = null; state.f.open = null; render(); return; }
  if (act === "staronly") { state.f.starOnly = !state.f.starOnly; render(); return; }

document.addEventListener("input", (e) => {
