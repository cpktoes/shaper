  color-scheme: light;

  --ink: #f2f4f7; --muted: #a1a8b4; --line: #6a707c; --faint: #333842;

#bar button { font: inherit; color: #cfd5de; background: #1b1f28; border: 1px solid #333a47; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
#bar button.on { background: #3490bc; border-color: #3490bc; color: #fff; }
#bar input[type=range] { width: 110px; accent-color: #3490bc; }
#blendVal { min-width: 34px; color: #fff; font-variant-numeric: tabular-nums; }
#note { font: 12.5px/1.45 system-ui, sans-serif; color: var(--muted); padding: 0 2px 8px; }

.sub { margin-top: 2px; font-size: 14px; color: var(--muted); }
.ruled { margin-top: 20px; padding-bottom: 8px; border-bottom: 1px solid var(--faint); font-size: 12px; font-weight: 800;

.adv { margin-top: 4px; padding: 0 0 8px 12px; border-bottom: 1px solid var(--faint); font-size: 10px; font-weight: 800; text-transform: uppercase;

.group { display: flex; flex-direction: column; gap: 14px; padding-top: 12px; }

.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; }
.check.small { font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; }

  out.d += ` L${P(chain[n])}`; out.pts.push(chain[n]);

  // how deep the blend goes at each corner of the cut section, and which way is out
  out.corners = [];
  for (let i = 1; i < n; i++) {
    const V = chain[i];
    if (sec.hardEdge && Math.abs(V[0]) < 1e-6 && Math.abs(V[1]) < 1e-6) continue;
    let best = Infinity, nearPt = null;
    for (let j = 0; j < out.pts.length - 1; j++) {
      const A = out.pts[j], B = out.pts[j + 1], dx = B[0] - A[0], dy = B[1] - A[1], L2 = dx * dx + dy * dy;
      const t = L2 ? Math.min(1, Math.max(0, ((V[0] - A[0]) * dx + (V[1] - A[1]) * dy) / L2)) : 0;
      const F = lerp(A, B, t), dd = dist(V, F);
      if (dd < best) { best = dd; nearPt = F; }
    }
    out.corners.push({ V, M: nearPt, depth: best });
  }
  // the finished apex: where the round touches the outline, or the middle of wherever the halfway
  // curve still runs along it; on a hard edge, how high the straight wall reaches instead
  const onRail = out.pts.filter((p) => p[0] > -1e-5).map((p) => p[1]);
  out.apexY = round ? round.yc : onRail.length ? (Math.min(...onRail) + Math.max(...onRail)) / 2 : null;
  out.wallTop = sec.hardEdge && onRail.length ? Math.max(...onRail) : null;
  return out;
}

// One section's output in inches, the shape the drawing works in (the app's own px/py do the same).
function view(o) {
  const pt = (p) => [IN(p.x), IN(p.y)];
  return {
    domed: o.domed, hardEdge: o.result.hardEdge, boardThickness: IN(o.boardThickness), apexCenter: IN(o.result.apexCenter),
    xAxisMin: IN(o.bounds.xAxisMin), yAxisMax: IN(o.bounds.yAxisMax),
    segments: o.segments.map((g) => ({ key: g.key, label: g.label, p1: pt(g.p1), p2: pt(g.p2) })),
    dots: railPlotDots(o.segments, o.result, o.domed).map((d) => ({ key: d.key, x: IN(d.x), y: IN(d.y) })),
  };
}

// Greenlight's rail band charts, from the founder's PDFs (2026-10-31), in inches:
//  - Modern Medium Rail, Flat Deck, Round Tuck: midpoint thickness 2 1/2"–3 1/4" → Rail Mark 1 = T/2 + 1/8";
//    Deck Mark 1 2 1/2", Deck Mark 2 the primary band's midpoint, Deck Mark 3 4 1/2", Corner Cut 1/4",
//    one tuck 1/2" up × 1/2" in — every one of those the same on all four rows.
//  - Modern Medium Rail, Domed Deck, Elliptical Tuck: true rail thickness 1 3/4"–2 1/2" → Rail Mark 1 = t/2 + 1/4";
//    Deck Dome Mark 6", Deck Mark 1 2", Deck Mark 3 4 1/2", Corner Cut 1/4", Rail Tuck 1 1/4" up to Bottom Tuck 1
//    3/4" in, then Rail Tuck 2 from 1/2" up (read here as meeting the first tuck band at its midpoint).
//  - Both: 12" from nose and tail by the "75% formula" — Rail Mark 1 = thickness there × .75, Deck Marks 1 and 3
//    and the Dome Mark × .75. The tucks and corner cut aren't given there; kept as at the midpoint.
//  - Boxy Railbands (fish/egg) and Knifey Railbands (hi-performance): no thickness given, read as 2 1/2" boards.
//    Boxy midpoint: rail mark 1 5/8", deck marks 2" and 4", tuck 3/8" × 3/8". Knifey midpoint: rail mark 1",
//    deck marks 2" and 4", tuck 3/8" up × 3/8"–7/8" in (5/8" here); its nose tuck 3/16" up × 3/8"–1/2" in.
//    Neither draws a corner cut. Their rail marks become an offset from T/2 so they follow thickness the way the
//    Medium charts do; at 12" the same offset is carried through the 75% formula.
const GLC_FAMILY = {
  1: { name: "Boxy chart", off: 3 / 8, dm1: 2, dm3: 4, cc: 0, tuck: [3 / 8, 3 / 8], noseTuck: [3 / 8, 3 / 8] },
  3: { name: "Modern Medium chart", off: 1 / 8, dm1: 2.5, dm3: 4.5, cc: 1 / 4, tuck: [1 / 2, 1 / 2], noseTuck: [1 / 2, 1 / 2] },
  5: { name: "Knifey chart", off: -1 / 4, dm1: 2, dm3: 4, cc: 0, tuck: [3 / 8, 5 / 8], noseTuck: [3 / 16, 7 / 16] },
};
// Family 1, 3 and 5 are the three charts; 2 and 4 sit halfway. "Rail mark + tuck only" keeps the Medium chart's deck
// marks and corner cut on every family, so only the rail mark and the tuck step.
function glcParams(f, domed) {
  const A = (n) => { const a = { ...GLC_FAMILY[n] }; if (domed) { a.off += 1 / 8; if (n === 3) a.dm1 = 2; } return a; };
  const lo = f <= 3 ? 1 : 3, hi = f <= 3 ? 3 : 5, t = (f - lo) / 2;
  const a = A(lo), b = A(hi), M = A(3);
  const L = (x, y) => x + (y - x) * t, L2 = (x, y) => [L(x[0], y[0]), L(x[1], y[1])];
  const p = { off: L(a.off, b.off), dm1: L(a.dm1, b.dm1), dm3: L(a.dm3, b.dm3), cc: L(a.cc, b.cc), tuck: L2(a.tuck, b.tuck), noseTuck: L2(a.noseTuck, b.noseTuck), offMed: M.off };
  if (state.glcSteps === "rail") { p.dm1 = M.dm1; p.dm3 = M.dm3; p.cc = M.cc; }
  p.elliptical = domed && f === 3;
  p.name = f === 2 ? "halfway Boxy ↔ Medium" : f === 4 ? "halfway Medium ↔ Knifey" : GLC_FAMILY[f].name;
  return p;
}
function glcSection(k) {
  const o = bands[k], sp = state.spec[k];
  const T = IN(sp.boardThickness), domed = sp.deckPercent < 100, t = domed ? IN(o.railThicknessClamped) : T;
  const atMid = k === "center", p = glcParams(sp.family, domed);
  const hardEdge = k === "tail" && state.spec.tailHardEdge;
  const k75 = atMid ? 1 : 0.75;
  const rm = atMid ? t / 2 + p.off : 0.75 * t + 0.75 * (p.off - p.offMed);
  const dm1 = p.dm1 * k75, dm3 = p.dm3 * k75, dome = 6 * k75, cc = p.cc;
  const deckY = (x) => (domed ? t + (T - t) * Math.min(1, Math.max(0, -x / dome)) : T);
  const segs = [], dots = [];
  const half = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const add = (key, label, p1, p2) => { segs.push({ key, label, p1, p2 }); dots.push({ key, x: p1[0], y: p1[1] }, { key, x: p2[0], y: p2[1] }); };
  if (domed) add("domedBand", "Deck Dome", [0, t], [-dome, T]);
  const P1 = [0, rm], D1 = [-dm1, deckY(-dm1)];
  add("band1", "Primary Rail Band", P1, D1);
  add("band2", "Secondary Rail Band", half(P1, D1), [-dm3, deckY(-dm3)]);
  if (cc > 1e-6) add("cornerCut", "Corner Cut", [0, rm - cc], [-cc, rm + (D1[1] - rm) * (cc / dm1)]);
  let tuckTop = 0, tuckIn = 0, tuckTxt;
  if (hardEdge) tuckTxt = "hard edge, no tuck";
  else if (p.elliptical) {
    const A1 = [0, 1 / 4], B1 = [-3 / 4, 0];
    add("tuck1", "Rail Tuck 1", A1, B1);
    add("tuck2", "Rail Tuck 2", [0, 1 / 2], half(A1, B1));
    tuckTop = 1 / 2; tuckIn = 3 / 4;
    tuckTxt = `elliptical tuck ${fmtMark(inchesToMm(1 / 4))} × ${fmtMark(inchesToMm(3 / 4))}, then ${fmtMark(inchesToMm(1 / 2))} up`;
  } else {
    const tk = k === "nose" ? p.noseTuck : p.tuck;
    add("tuck1", "Tuck", [0, tk[0]], [-tk[1], 0]);
    tuckTop = tk[0]; tuckIn = tk[1];
    tuckTxt = `tuck ${fmtMark(inchesToMm(tk[0]))} up × ${fmtMark(inchesToMm(tk[1]))} in`;
  }
  const left = -(Math.max(dm3, domed ? dome : 0) + 2);
  segs.push({ key: "boardConn", label: "Blank", p1: [left, T], p2: [domed ? -dome : 0, T] });
  segs.push({ key: "bottomConn", label: "Blank", p1: [left, 0], p2: [-tuckIn, 0] });
  segs.push({ key: "railConn", label: "Vertical band", p1: [0, rm], p2: [0, tuckTop] });
  if (hardEdge) segs.push({ key: "hardEdge", label: "Hard Edge", p1: [0, rm], p2: [0, 0] });
  const middle = (rm + tuckTop) / 2;
  dots.push({ key: "apexCenter", x: 0, y: middle });
  const f = (x) => fmtMark(inchesToMm(x));
  const marks = `rail mark ${f(rm)}${atMid ? "" : " (75% formula)"} · deck marks ${f(dm1)}, ${f(dm3)}${cc > 1e-6 ? ` · corner cut ${f(cc)}` : ""} · ${tuckTxt}`;
  return { domed, hardEdge, boardThickness: T, apexCenter: middle, xAxisMin: left, yAxisMax: T + 0.25, segments: segs, dots,
    glc: { name: `${p.name}${domed ? " · domed deck" : " · flat deck"}`, marks } };
}

// ---- Two settings (2026-11-01): Fullness and Apex set every band ----
// Fitted to the founder's Greenlight Rails sheet on the "Greenlight Rails" page, where it redraws every flat-deck
// type within about 1/16" on average (Pinched 1/8", whose long tuck a 45° tuck can't reach). The rule: a 5/8" flat on
// the rail centred on the apex; the rail mark at its top; one tuck from its bottom, as far in as it is up; Deck Mark 1
// wherever it keeps the asked-for foam; Deck Mark 2 twice as far in, the second band from the middle of the primary;
// every figure × the rail's own thickness ÷ 2 1/2". Fullness is the share of the blank still there in the outer
// 3" (× thickness ÷ 2 1/2") once the bands are cut, laid on the Family numbers: 1 keeps 86%, each step 5% less.
const TWO_FLAT = 0.625, TWO_FULL = 86, TWO_STEP = 5;
const twoKept = (f) => TWO_FULL - (f - 1) * TWO_STEP;
const RATIO_HINTS = '<span style="left:0">30/70</span><span style="left:50%;transform:translateX(-50%)">50/50</span><span style="left:75%;transform:translateX(-50%)">60/40</span>';
const TWO_APEX_HINTS = '<span style="left:0">20% down rail</span><span style="left:57.14%;transform:translateX(-50%)">40%</span><span style="right:0">55%</span>';
const TWO_NOTE = '<b>Two settings:</b> each section\'s Fullness (the Family slider: 1 keeps 86% of the blank in the outer 3", each step 5% less) and Apex (the Ratio slider) set every band: a 5/8" flat on the rail centred on the apex, a 45° tuck from its bottom, Deck Mark 1 wherever it keeps that foam, Deck Mark 2 twice as far in, all × the rail\'s thickness ÷ 2 1/2". ';
// Each type in the sheet at its own foam and apex (a 2 1/2" board), as the Greenlight Rails page measures them.
const TWO_PRESETS = {
  "Egg": { fam: 1.28, apex: 35 }, "True 50/50": { fam: 1.45, apex: 50 }, "Mod Full": { fam: 1.72, apex: 42.5 },
  "Angular DR": { fam: 2.14, apex: 27.5 }, "Full Soft": { fam: 2.26, apex: 47.5 }, "Mod Med": { fam: 2.73, apex: 45 },
  "Down Rail": { fam: 3.19, apex: 25 }, "Mod Med (flat, round)": { fam: 3.35, apex: 32.5 }, "Pinched": { fam: 3.62, apex: 35 },
  "Mod Thin": { fam: 3.73, apex: 32.5 }, "Boxy (sheet)": { fam: 4.67, apex: 30 },
};
function twoSection(k) {
  const o = bands[k], sp = state.spec[k], tw = state.two[k];
  const T = IN(sp.boardThickness), domed = sp.deckPercent < 100, t = domed ? IN(o.railThicknessClamped) : T;
  // a domed deck keeps the app's own dome (Deck Profile); the bands end on it
  const db = domed ? view(o).segments.find((s) => s.key === "domedBand") : null;
  const dome = db && -db.p2[0] > 1e-6 ? -db.p2[0] : 0;
  const deckY = (x) => (dome ? t + (T - t) * Math.min(1, Math.max(0, -x / dome)) : T);
  const hardEdge = k === "tail" && state.spec.tailHardEdge;
  const s = t / 2.5, A = tw.apex / 100, V = twoKept(tw.fam);
  const rm = Math.min(t - 1 / 32, A * t + (TWO_FLAT * s) / 2), u = Math.max(0, A * t - (TWO_FLAT * s) / 2);
  const lines = (d1) => {
    const P1 = [0, rm], E1 = [-d1, deckY(-d1)];
    return { P1, E1, M: [(P1[0] + E1[0]) / 2, (P1[1] + E1[1]) / 2], E2: [-2 * d1, deckY(-2 * d1)] };
  };
  // foam kept in the outer 3" (scaled), with the tuck in place: a hard edge drops the tuck afterwards, so
  // ticking it never moves the deck bands
  const keptAt = (d1) => {
    const L = lines(d1), w = 3 * s, n = 120;
    const at = (p, q, x) => p[1] + ((x - p[0]) * (q[1] - p[1])) / (q[0] - p[0]);
    let a = 0, blk = 0;
    for (let i = 0; i < n; i++) {
      const x = (-(i + 0.5) * w) / n;
      const top = Math.min(deckY(x), at(L.P1, L.E1, x), at(L.M, L.E2, x));
      const bot = u > 1e-6 ? Math.max(0, at([0, u], [-u, 0], x)) : 0;
      a += Math.max(0, top - bot); blk += deckY(x);
    }
    return (a / blk) * 100;
  };
  let lo = 0.1 * s, hi = 10 * s;
  for (let i = 0; i < 44; i++) { const m = (lo + hi) / 2; if (keptAt(m) > V) lo = m; else hi = m; }
  const d1 = (lo + hi) / 2, L = lines(d1);

  const segs = [], dots = [];
  const add = (key, label, p1, p2) => { segs.push({ key, label, p1, p2 }); dots.push({ key, x: p1[0], y: p1[1] }, { key, x: p2[0], y: p2[1] }); };
  if (dome) add("domedBand", "Deck Dome", [0, t], [-dome, T]);
  add("band1", "Primary Rail Band", L.P1, L.E1);
  add("band2", "Secondary Rail Band", L.M, L.E2);
  const tuckTop = hardEdge ? 0 : u;
  if (!hardEdge && u > 1e-6) add("tuck1", "Tuck", [0, u], [-u, 0]);
  const left = -(Math.max(2 * d1, dome) + 2);
  segs.push({ key: "boardConn", label: "Blank", p1: [left, T], p2: [dome ? -dome : 0, T] });
  segs.push({ key: "bottomConn", label: "Blank", p1: [left, 0], p2: [-tuckTop, 0] });
  segs.push({ key: "railConn", label: "Vertical band", p1: [0, rm], p2: [0, tuckTop] });
  if (hardEdge) segs.push({ key: "hardEdge", label: "Hard Edge", p1: [0, rm], p2: [0, 0] });
  const middle = (rm + tuckTop) / 2;
  dots.push({ key: "apexCenter", x: 0, y: middle });
  const f = (x) => fmtMark(inchesToMm(x));
  const marks = `keeps ${Math.round(V)}% · apex ${f(A * t)} up · rail mark ${f(rm)} · deck marks ${f(d1)}, ${f(2 * d1)} · ${hardEdge ? "hard edge, no tuck" : `tuck ${f(u)} up × ${f(u)} in`}`;
  return { domed: !!dome, hardEdge, boardThickness: T, railThickness: t, apexCenter: middle, xAxisMin: left, yAxisMax: T + 0.25, segments: segs, dots,
    two: { name: `Fullness ${tw.fam.toFixed(1)} · Apex ${tw.apex}%${dome ? " · domed deck" : ""}`, marks } };
}

// One section drawn from Greenlight's chart at this rail's thickness (and the tail's Hard Edge).
function glSection(k) {
  const T = IN(state.spec[k].boardThickness), row = GL_ROWS[state.glRow], m = glMultiplier(T);
  const hardEdge = k === "tail" && state.spec.tailHardEdge;
  const rail = row.rail * m, deck = row.deck.map((d) => d * m);
  const segs = [], dots = [];
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const add = (key, label, p1, p2) => { segs.push({ key, label, p1, p2 }); dots.push({ key, x: p1[0], y: p1[1] }, { key, x: p2[0], y: p2[1] }); };
  // deck: the primary band from the rail mark to Deck Mark 1, then each next band from the middle of the last
  const names = ["Primary Rail Band", "Secondary Rail Band", "Tertiary Rail Band"];
  let prev = null;
  deck.forEach((dm, i) => { const p1 = i === 0 ? [0, rail] : mid(prev.p1, prev.p2); prev = { p1, p2: [-dm, T] }; add(`band${i + 1}`, names[i], prev.p1, prev.p2); });
  // bottom: the tuck as one flat band, the mirrored 50/50 bands, or nothing under a hard edge
  let tuckTop = 0, tuck = null, bottomIn = 0;
  if (hardEdge) {
    tuckTop = 0;
  } else if (row.tuck === "mirror") {
    tuckTop = T - rail; prev = null;
    deck.forEach((dm, i) => { const p1 = i === 0 ? [0, tuckTop] : mid(prev.p1, prev.p2); prev = { p1, p2: [-dm, 0] }; add(`tuck${i + 1}`, `Bottom ${names[i]}`, prev.p1, prev.p2); });
    bottomIn = Math.max(...deck);
  } else {
    tuck = row.tuck.map((v) => v * m); tuckTop = tuck[0]; bottomIn = tuck[1];
    add("tuck1", "Tuck", [0, tuck[0]], [-tuck[1], 0]);
  }
  const left = -(Math.max(...deck, bottomIn) + 2);
  segs.push({ key: "boardConn", label: "Blank", p1: [left, T], p2: [0, T] });
  segs.push({ key: "bottomConn", label: "Blank", p1: [left, 0], p2: [hardEdge ? 0 : -bottomIn, 0] });
  segs.push({ key: "railConn", label: "Vertical band", p1: [0, rail], p2: [0, tuckTop] });
  if (hardEdge) segs.push({ key: "hardEdge", label: "Hard Edge", p1: [0, rail], p2: [0, 0] });
  const middle = (rail + tuckTop) / 2;
  dots.push({ key: "apexCenter", x: 0, y: middle });
  return { domed: false, hardEdge, boardThickness: T, apexCenter: middle, xAxisMin: left, yAxisMax: T + 0.25, segments: segs, dots,
    gl: { m, row, rail, deck, tuck, mirror: row.tuck === "mirror", tuckTop } };
}

// ---- units ----
function fmtDepth(inches) {
  if (state.units === "metric") {
    const m = Math.round(inches * 25.4);
    return m >= 1 ? `${m}` : null;
  }
  const n = Math.round(inches * 32);
  if (n < 1) return null;
  let num = n, den = 32;
  while (num % 2 === 0 && den > 1) { num /= 2; den /= 2; }
  const whole = Math.floor(num / den), rem = num % den;
  return (whole ? `${whole}${rem ? " " : ""}` : "") + (rem ? `${rem}/${den}` : "") + '"';
}

// How far the finished apex sits from the Apex Center: 1/64" steps, or whole mm.
function fmtShift(inches) {
  const dir = inches < 0 ? "low" : "high";
  if (state.units === "metric") {
    const m = Math.round(Math.abs(inches) * 25.4);
    return m === 0 ? "on the Apex Center" : `${m} mm ${dir}`;
  }
  const n = Math.round(Math.abs(inches) * 64);
  if (n === 0) return "on the Apex Center";
  let num = n, den = 64;
  while (num % 2 === 0 && den > 1) { num /= 2; den /= 2; }
  return `${num}/${den}" ${dir}`;
}

function grid(xMinAxis, yMaxAxis) {
  const xs = [], ys = [];
  if (state.units === "imperial") {
    for (let i = 0; i >= Math.floor(xMinAxis); i--) xs.push({ v: i, l: `${Math.abs(i)}` });
    for (let j = 0; j <= Math.floor(yMaxAxis); j++) ys.push({ v: j, l: `${j}` });
    return { xs, ys };
  }
  const xmm = Math.floor((xMinAxis * 25.4) / 10) * 10, ymm = Math.floor((yMaxAxis * 25.4) / 10) * 10;
  for (let i = 0, k = 0; i >= xmm; i -= 10, k++) xs.push({ v: i / 25.4, l: k % 2 ? "" : `${Math.abs(i)}${k === 2 ? " mm" : ""}` });
  for (let j = 0, k = 0; j <= ymm; j += 10, k++) ys.push({ v: j / 25.4, l: k % 2 ? "" : `${j}` });
  return { xs, ys };
}

// ---- drawing ----
function plotSvg(name, sec, xAxisMin, over) {
  const minX = xAxisMin - 0.15, minY = -0.15, maxY = sec.yAxisMax + 0.15;
  const W = (0.15 - minX) * SCALE + LEFT_PAD + (sec.gl || sec.glc || sec.two ? 230 : 150);
  const H = (maxY - minY) * SCALE + AXIS_LABEL_PAD;
  const px = (x) => (x - minX) * SCALE + LEFT_PAD;
  const py = (y) => (maxY - y) * SCALE;
  const P = (p) => `${px(p[0]).toFixed(2)},${py(p[1]).toFixed(2)}`;
  const v = state.showFinished ? state.v : "T";
  const parts = [];

  const g = grid(xAxisMin, sec.yAxisMax);
  const gx0 = g.xs[g.xs.length - 1].v;
  for (const t of g.xs) parts.push(`<line x1="${px(t.v)}" y1="${py(0)}" x2="${px(t.v)}" y2="${py(g.ys[g.ys.length - 1].v)}" stroke="color-mix(in srgb, var(--muted) 12%, transparent)"/>`);
  for (const t of g.ys) parts.push(`<line x1="${px(gx0)}" y1="${py(t.v)}" x2="${px(0)}" y2="${py(t.v)}" stroke="color-mix(in srgb, var(--muted) 12%, transparent)"/>`);
  for (const t of g.xs) {
    parts.push(`<line x1="${px(t.v)}" y1="${py(0)}" x2="${px(t.v)}" y2="${py(0) + 4}" stroke="var(--muted)"/>`);
    if (t.l) parts.push(`<text x="${px(t.v)}" y="${py(0) + 15}" font-size="10" fill="var(--muted)" text-anchor="middle">${t.l}</text>`);
  }
  for (const t of g.ys) {
    parts.push(`<line x1="${px(gx0)}" y1="${py(t.v)}" x2="${px(gx0) - 4}" y2="${py(t.v)}" stroke="var(--muted)"/>`);
    if (t.l) parts.push(`<text x="${px(gx0) - 8}" y="${py(t.v) + 3.5}" font-size="10" fill="var(--muted)" text-anchor="end">${t.l}</text>`);
  }
  parts.push(`<line x1="${px(0)}" y1="${py(-0.1)}" x2="${px(0)}" y2="${py(sec.yAxisMax)}" stroke="color-mix(in srgb, var(--muted) 30%, transparent)" stroke-dasharray="2 3"/>`);

  const fin = finishedCurve(sec, P);
  const chain = fin.chain, d = fin.d;

  // your workbook's bands, dashed, under Greenlight's
  if (over) {
    for (const s of over.segments) {
      if (!(CUT_KEYS.includes(s.key) || (s.key === "domedBand" && over.domed) || s.key === "railConn")) continue;
      parts.push(`<line x1="${px(s.p1[0])}" y1="${py(s.p1[1])}" x2="${px(s.p2[0])}" y2="${py(s.p2[1])}" stroke="var(--muted)" stroke-width="1.25" stroke-dasharray="4 3" opacity=".85"/>`);
    }
    parts.push(`<circle cx="${px(0)}" cy="${py(over.apexCenter)}" r="3.5" fill="none" stroke="${APEX}" stroke-width="1.5"/>`);
  }

  if (v === "B") parts.push(`<path d="${d} Z" fill="var(--fill)" stroke="none"/>`);
  if (v === "C") {
    // the foam between the cuts and the finished rail
    const back = [...fin.pts].reverse();
    parts.push(`<path d="M${chain.map(P).join(" L")} L${back.map(P).join(" L")} Z" fill="color-mix(in srgb, var(--blend) 45%, transparent)" stroke="none"/>`);
  }

  const thin = v === "B";
  for (const s of sec.segments) {
    parts.push(`<line x1="${px(s.p1[0])}" y1="${py(s.p1[1])}" x2="${px(s.p2[0])}" y2="${py(s.p2[1])}" stroke="${COLORS[s.key]}" stroke-width="${thin ? 1.25 : 2}" ${thin ? 'opacity=".75"' : ""}/>`);
  }
  if (v !== "T") {
    parts.push(`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="${v === "B" ? 2.25 : 3}" stroke-linejoin="round" stroke-linecap="round" ${v !== "B" ? 'opacity=".9"' : ""}/>`);
  }
  for (const dt of sec.dots) {
    const col = dt.key === "apexCenter" ? APEX : COLORS[dt.key];
    parts.push(`<circle cx="${px(dt.x)}" cy="${py(dt.y)}" r="${thin ? 2.25 : 2.75}" fill="${col}"/>`);
  }

  // where the finished apex lands against the Apex Center
  const placed = [];
  if (v !== "T" && fin.apexY !== null) {
    const ay = py(fin.wallTop !== null ? fin.wallTop : fin.apexY);
    placed.push([px(0), ay]);
    parts.push(`<line x1="${px(0) + 4}" y1="${ay}" x2="${px(0) + 14}" y2="${ay}" stroke="var(--ink)" stroke-width="1.5"/>`);
    let txt, sub = null;
    if (fin.wallTop !== null) txt = `hard edge: straight wall up to ${fmtMark(inchesToMm(fin.wallTop))}`;
    else if (sec.gl || sec.glc || sec.two) {
      txt = `apex ${fmtMark(inchesToMm(fin.apexY))} up (${Math.round((fin.apexY / (sec.railThickness ?? sec.boardThickness)) * 100)}% of thickness)`;
      const sh = fmtShift(fin.apexY - sec.apexCenter);
      sub = sh.startsWith("on") ? "on the vertical band's middle" : `${sh.replace(/ (low|high)$/, (m0, w) => (w === "low" ? " below" : " above"))} the vertical band's middle`;
    } else txt = `apex ${fmtShift(fin.apexY - sec.apexCenter)}`;
    if (fin.wallTop !== null) placed[0][1] = py(fin.wallTop);
    parts.push(`<text x="${px(0) + 18}" y="${ay + 3.5}" font-size="10.5" font-weight="700" fill="var(--ink)" paint-order="stroke" stroke="var(--panel)" stroke-width="3">${txt}</text>`);
    if (sub) parts.push(`<text x="${px(0) + 18}" y="${ay + 16}" font-size="9.5" fill="var(--muted)" paint-order="stroke" stroke="var(--panel)" stroke-width="3">${sub}</text>`);
  }

  if (v === "C") {
    for (const c of [...fin.corners].sort((a, b) => b.depth - a.depth)) {
      const label = fmtDepth(c.depth);
      if (!label) continue;
      if (placed.some((q) => Math.hypot(q[0] - px(c.V[0]), q[1] - py(c.V[1])) < 26)) continue;
      placed.push([px(c.V[0]), py(c.V[1])]);
      let ox = c.V[0] - c.M[0], oy = c.V[1] - c.M[1];
      const L = Math.hypot(ox, oy) || 1; ox /= L; oy /= L;
      const lx = px(c.V[0]) + ox * 14, ly = py(c.V[1]) - oy * 14;
      const anchor = ox > 0.35 ? "start" : ox < -0.35 ? "end" : "middle";
      parts.push(`<line x1="${px(c.V[0])}" y1="${py(c.V[1])}" x2="${px(c.V[0]) + ox * 9}" y2="${py(c.V[1]) - oy * 9}" stroke="var(--blend)" stroke-width="1"/>`);
      parts.push(`<text x="${lx}" y="${ly + 3.5}" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="${anchor}" paint-order="stroke" stroke="var(--panel)" stroke-width="3">${label}</text>`);
    }
  }

  // flex by drawing height, so every plot lands at the same scale (the app's one SCALE for all three)
  let head = name;
  if (sec.gl) {
    const g2 = sec.gl, f = (x) => fmtMark(inchesToMm(x));
    const tuckTxt = sec.hardEdge ? "hard edge, no tuck" : g2.mirror ? `bottom bands mirror the deck (from ${f(g2.tuckTop)} up)` : `tuck ${f(g2.tuck[0])} up × ${f(g2.tuck[1])} in`;
    head += ` — Greenlight ${g2.row.label} × ${g2.m.toFixed(3).replace(/0+$/, "").replace(/\.$/, "")}<span class="marks">${tuckTxt} · rail mark ${f(g2.rail)} · deck marks ${g2.deck.map(f).join(", ")}</span>`;
  }
  if (sec.glc) head += ` — Greenlight charts · ${sec.glc.name}<span class="marks">${sec.glc.marks}</span>`;
  if (sec.two) head += ` — Two settings · ${sec.two.name}<span class="marks">${sec.two.marks}</span>`;
  return `<div class="plot" style="flex:${H.toFixed(1)} 1 0"><h3>${head}</h3><svg viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" preserveAspectRatio="xMinYMid meet" font-family="Inter, system-ui, sans-serif">${parts.join("")}</svg></div>`;
}

function legend(sec) {
  const items = [`<span><i class="dot" style="background:${APEX}"></i>${sec.gl || sec.glc || sec.two ? "Middle of the vertical band" : "Apex Center"}</span>`];
  for (const s of sec.segments) {
    if (s.key === "bottomConn" || s.key === "railConn") continue;
    items.push(`<span><i style="background:${COLORS[s.key]}"></i>${s.label}</span>`);
  }
  if (sec.domed) items.push(`<span><i style="background:#6b8e4e"></i>Tapered Rail Thickness</span>`);
  const v = state.showFinished ? state.v : "T";
  if (v === "A" || v === "C") items.push(`<span><i class="fin" style="background:var(--ink)"></i><b>Finished Rail</b></span>`);
  if (v === "B") items.push(`<span><i class="foam" style="background:var(--fill);border:2px solid var(--ink)"></i><b>Finished Rail</b></span>`);
  if (v === "C") items.push(`<span><i class="foam" style="background:color-mix(in srgb, var(--blend) 45%, transparent)"></i><b>Blended off</b></span>`);
  if ((sec.gl || sec.glc || sec.two) && state.overlay) items.push(`<span><i style="background:repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px)"></i>Your workbook's bands · <i class="dot" style="background:none;border:1.5px solid ${APEX}"></i>its Apex Center</span>`);
  return items.join("");
}

function drawPlots() {
  const views = {}, overs = {};
  const gl = state.src === "gl", glc = state.src === "glc", two = state.src === "two";
  for (const k of KEYS) {
    views[k] = gl ? glSection(k) : glc ? glcSection(k) : two ? twoSection(k) : view(bands[k]);
    overs[k] = (gl || glc || two) && state.overlay ? view(bands[k]) : null;
  }
  const open = KEYS.filter((k) => state.open[k]);
  const xAxisMin = Math.min(...open.map((k) => Math.min(views[k].xAxisMin, overs[k] ? overs[k].xAxisMin : 0)), 0);
  document.getElementById("plots").innerHTML = open.map((k) => plotSvg(PLOT_TITLE[k], views[k], xAxisMin, overs[k])).join("");
  document.getElementById("legend").innerHTML = open.length ? legend(views[open[0]]) : "";
  const v = state.showFinished ? state.v : "T";
  document.getElementById("note").innerHTML = (gl ? `<b>Sample chart — ${GL_ROWS[state.glRow].label}:</b> every figure × thickness ÷ 2 1/2", band by band as the chart defines them. ` : "") +
    (glc ? `<b>Greenlight charts:</b> Family 1 = the Boxy chart, 3 = the Modern Medium chart (flat or domed deck by Deck Profile), 5 = the Knifey chart, 2 and 4 halfway${state.glcSteps === "rail" ? " — only the rail mark and tuck step; deck marks and corner cut stay Medium's" : ""}. Centre at the midpoint; nose and tail at 12" by the 75% formula. ` : "") +
    (two ? TWO_NOTE : "") + NOTES[v] + (v !== "T" ? " " + MODEL_NOTES[state.model] : "") +
    (v !== "T" && state.model === "half" && state.blend < 1 ? ` <i>Blend at ${Math.round(state.blend * 100)}%: each band keeps a flat strip in its middle.</i>` : "");
}

// ---- the RAILS sidebar, live ----
const ui = {};

function slider(min, max, step, value, onInput) {
  const el = document.createElement("input");
  el.type = "range"; el.className = "rng";
  setSlider(el, min, max, step, value);
  el.addEventListener("input", () => onInput(Number(el.value)));
  return el;
}
function setSlider(el, min, max, step, value) {
  el.min = min; el.max = max; el.step = step; el.value = value;
  const p = max > min ? ((Number(el.value) - min) / (max - min)) * 100 : 0;
  el.style.setProperty("--p", `${p}%`);
}
function check(text, checked, onChange, cls = "check") {
  const l = document.createElement("label"); l.className = cls;
  const i = document.createElement("input"); i.type = "checkbox"; i.checked = checked;
  i.addEventListener("change", () => onChange(i.checked));
  l.append(i, document.createTextNode(text));
  l.input = i;
  return l;
}
const div = (cls, html) => { const d = document.createElement("div"); if (cls) d.className = cls; if (html !== undefined) d.innerHTML = html; return d; };

function change(key, patch) {
  Object.assign(state.spec[key], patch);
  recompute();
}
function twoChange(key, patch) {
  Object.assign(state.two[key], patch);
  document.getElementById("twoPreset").value = "";
  recompute();
}
function recompute() {
  bands = computeRailBands(state.spec);
  syncSidebar();
  drawPlots();
}

function buildSection(key) {
  const u = (ui[key] = {});
  const wrap = div("");
  const head = div("ruled");
  head.append(document.createTextNode(TITLE[key]));
  u.view = check("View", state.open[key], (c) => { state.open[key] = c; syncSidebar(); drawPlots(); }, "check small");
  head.append(u.view);
  wrap.append(head);

  const g = (u.group = div("group"));
  const tb = key === "center" ? CENTER_THICKNESS_BOUNDS : NT_THICKNESS_BOUNDS;

  // Thickness
  const th = div("");
  u.thLbl = div("lbl");
  u.th = slider(tb.min, tb.max, tb.step, IN(state.spec[key].boardThickness), (v) => change(key, { boardThickness: inchesToMm(v) }));
  th.append(u.thLbl, u.th);
  g.append(th);

  // Deck Profile
  const dp = div("");
  u.dpLbl = div("lbl");
  u.dp = slider(66, 100, 1, 166 - state.spec[key].deckPercent, (v) => change(key, { deckPercent: Math.min(100, Math.max(66, 166 - v)) }));
  dp.append(u.dpLbl, u.dp, div("hints", "<span>Flat</span><span>Heavily Domed</span>"));
  g.append(dp);

  // Family | Ratio
  const cols = div("cols");
  const fam = div("");
  u.famLbl = div("headline lbl");
  u.fam = slider(1, 5, 1, state.spec[key].family, (v) => (state.src === "two" ? twoChange(key, { fam: v }) : change(key, { family: v })));
  fam.append(u.famLbl, u.fam, div("hints", "<span>Boxy</span><span>Medium</span><span>Knifey</span>"));
  const rat = div("");
  const rh = div("headline");
  u.ratLbl = div("lbl");
  u.sym = check("Sym", state.spec[key].symmetrical, (c) => change(key, { symmetrical: c }));
  rh.append(u.ratLbl, u.sym);
  u.rat = slider(30, 70, 1, state.spec[key].ratioTopPercent, (v) => (state.src === "two" ? twoChange(key, { apex: v }) : change(key, { ratioTopPercent: v })));
  const ratHints = div("ratio-hints", '<span style="left:0">30/70</span><span style="left:50%;transform:translateX(-50%)">50/50</span><span style="left:75%;transform:translateX(-50%)">60/40</span>');
  rat.append(rh, u.rat, ratHints);
  if (key === "tail") {
    u.hard = check("Hard Edge", state.spec.tailHardEdge, (c) => { state.spec.tailHardEdge = c; recompute(); });
    u.hard.style.marginTop = "8px";
    rat.append(u.hard);
  }
  cols.append(fam, rat);
  g.append(cols);

  // Advanced
  const advWrap = div("");
  u.advHead = div("adv");
  u.advHead.addEventListener("click", () => { state.adv[key] = !state.adv[key]; syncSidebar(); });
  u.adv = div("group");
  u.adv.style.paddingLeft = "12px";
  const cc = div("");
  const cch = div("headline");
  u.ccLbl = div("lbl");
  u.ccRemove = check("Remove", state.spec[key].removeCornerCut, (c) => change(key, { removeCornerCut: c }));
  cch.append(u.ccLbl, u.ccRemove);
  u.cc = slider(CORNER_CUT_BOUNDS.min, CORNER_CUT_BOUNDS.max, CORNER_CUT_BOUNDS.step, 0, (v) => change(key, { cornerCutOffsetOverride: inchesToMm(v) }));
  cc.append(cch, u.cc, div("hints", "<span>0 = falls on Rail Mark 1</span>"));
  u.bt = div("");
  const bth = div("headline");
  u.btLbl = div("lbl");
  u.single = check("Use Single Tuck", state.spec[key].singleTuck, (c) => change(key, { singleTuck: c }));
  bth.append(u.btLbl, u.single);
  u.bt3 = slider(0, 1.5, TUCK_BOUNDS.step, 0, (v) => change(key, { bottomTuck3Override: inchesToMm(v) }));
  u.bt.append(bth, u.bt3);
  const reset = document.createElement("button");
  reset.className = "resetadv"; reset.textContent = "↺ Reset Advanced Settings";
  reset.addEventListener("click", () => change(key, { cornerCutOffsetOverride: null, bottomTuck3Override: null, removeCornerCut: false, singleTuck: false }));
  u.adv.append(cc, u.bt, reset);
  advWrap.append(u.advHead, u.adv);
  g.append(advWrap);
  // what Greenlight's chart doesn't use, greyed while it draws the bands
  u.dimList = [dp, fam, rh, u.rat, ratHints, advWrap];
  u.dimGlc = [rh, u.rat, ratHints, advWrap];
  u.dimTwo = [advWrap];
  u.ratHints = ratHints;

  wrap.append(g);
  return wrap;
}

function syncSidebar() {
  for (const key of KEYS) {
    const u = ui[key], s = state.spec[key], o = bands[key];
    const tb = key === "center" ? CENTER_THICKNESS_BOUNDS : NT_THICKNESS_BOUNDS;
    u.view.input.checked = state.open[key];
    u.group.style.display = state.open[key] ? "" : "none";
    const thName = key === "center" ? "Board Thickness" : state.units === "imperial" ? 'Thickness @12"' : "Thickness @ 30.5 cm";
    u.thLbl.textContent = `${thName} — ${fmtMark(s.boardThickness)}`;
    setSlider(u.th, tb.min, tb.max, tb.step, IN(s.boardThickness));
    u.dpLbl.textContent = `Deck Profile — ${fmtMark(o.railThicknessClamped)} (Tapered Thickness)`;
    setSlider(u.dp, 66, 100, deckProfileStep(IN(s.boardThickness)), 166 - s.deckPercent);
    if (state.src === "two") {
      const tw = state.two[key];
      u.famLbl.textContent = `Fullness — ${tw.fam.toFixed(1)} (${Math.round(twoKept(tw.fam))}%)`;
      setSlider(u.fam, 0.6, 5.4, 0.1, tw.fam);
      u.ratLbl.textContent = `Apex — ${tw.apex}%`;
      setSlider(u.rat, 20, 55, 0.5, tw.apex);
      u.ratHints.innerHTML = TWO_APEX_HINTS;
      u.sym.style.display = "none";
    } else {
      u.famLbl.textContent = `Family — ${railFamilyLabel(s.family)}`;
      setSlider(u.fam, 1, 5, 1, s.family);
      u.ratLbl.textContent = `Ratio — ${s.ratioTopPercent}/${100 - s.ratioTopPercent}`;
      setSlider(u.rat, 30, 70, 1, s.ratioTopPercent);
      u.ratHints.innerHTML = RATIO_HINTS;
      u.sym.style.display = "";
    }
    u.sym.input.checked = s.symmetrical;
    if (u.hard) u.hard.input.checked = state.spec.tailHardEdge;
    const dim = state.src === "gl" ? u.dimList : state.src === "glc" ? u.dimGlc : state.src === "two" ? u.dimTwo : [];
    for (const el of u.dimList) { const on = dim.includes(el); el.style.opacity = on ? ".3" : ""; el.style.pointerEvents = on ? "none" : ""; }

    u.advHead.innerHTML = `<span>Advanced</span><span>${state.adv[key] ? "▾" : "▸"}</span>`;
    u.adv.style.display = state.adv[key] ? "" : "none";
    const ccOff = o.result.cornerCutOffset ?? 0;
    u.ccLbl.textContent = `Corner Cut Offset — ${fmtMark(ccOff)}`;
    u.ccRemove.input.checked = s.removeCornerCut;
    setSlider(u.cc, CORNER_CUT_BOUNDS.min, CORNER_CUT_BOUNDS.max, CORNER_CUT_BOUNDS.step, IN(ccOff));
    u.cc.disabled = s.removeCornerCut;
    u.cc.parentElement.classList.toggle("dim", s.removeCornerCut);
    const hard = key === "tail" && state.spec.tailHardEdge;
    u.bt.style.display = hard ? "none" : "";
    u.btLbl.textContent = `Bottom Tuck 3 — ${fmtMark(o.result.bottomTuck3)}`;
    u.single.input.checked = s.singleTuck;
    const btMin = IN(o.result.bottomTuck1) + MIN_BOTTOM_TUCK_SEPARATION_IN;
    const btMax = Math.max(TUCK_BOUNDS.max, IN(o.result.bottomTuck3Derived));
    setSlider(u.bt3, btMin, btMax, TUCK_BOUNDS.step, IN(o.result.bottomTuck3));
  }
}

const sections = document.getElementById("sections");
for (const k of KEYS) sections.append(buildSection(k));

// ---- toolbar ----
function wire(groupId, attr, apply) {
  const grp = document.getElementById(groupId);
  grp.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    grp.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    apply(b.dataset[attr]); syncSidebar(); drawPlots();
  });
}
wire("gVariant", "v", (v) => (state.v = v));
wire("gTheme", "t", (t) => { state.theme = t; document.body.className = t; });
wire("gUnits", "u", (u) => (state.units = u));
wire("gModel", "m", (m) => {
  state.model = m;
  // the even round is drawn fully rolled, so the Blend slider only moves the halfway blend
  document.getElementById("blend").disabled = m === "round";
  document.getElementById("gBlend").style.opacity = m === "round" ? ".4" : "";
});
document.getElementById("blend").addEventListener("input", (e) => {
  state.blend = e.target.value / 100;
  document.getElementById("blendVal").textContent = `${e.target.value}%`;
  drawPlots();
});
const GL_NOTES = {
  gl: "Sample chart: only each rail's thickness (and the tail's Hard Edge) apply. Every chart figure is multiplied by thickness ÷ 2 1/2\". Deck Profile, Family, Ratio and Advanced belong to your workbook and are greyed.",
  two: "Two settings: Thickness, Deck Profile, Fullness (the Family slider), Apex (the Ratio slider) and the tail's Hard Edge drive the bands on each section. Sym and Advanced are greyed: the rule sets the tuck itself and draws no corner cut.",
  glc: "Greenlight charts: Thickness, Deck Profile (flat or domed deck), Family (Boxy ↔ Knifey) and the tail's Hard Edge drive the bands. Ratio and Advanced belong to your workbook and are greyed — the charts set the rail mark, corner cut and tuck themselves.",
};
wire("gSrc", "s", (src) => {
  state.src = src;
  document.getElementById("gGl").style.display = src === "gl" ? "" : "none";
  document.getElementById("gGlc").style.display = src === "glc" ? "" : "none";
  document.getElementById("gTwo").style.display = src === "two" ? "" : "none";
  document.getElementById("gOv").style.display = src !== "workbook" ? "" : "none";
  const note = document.getElementById("glNote");
  note.style.display = src !== "workbook" ? "" : "none";
  note.textContent = GL_NOTES[src] || "";
});
wire("gGlc", "f", (f) => (state.glcSteps = f));
const glRow = document.getElementById("glRow");
for (const [key, row] of Object.entries(GL_ROWS)) glRow.add(new Option(`Greenlight: ${row.label}`, key, key === state.glRow, key === state.glRow));
glRow.addEventListener("change", () => { state.glRow = glRow.value; drawPlots(); });
const twoPreset = document.getElementById("twoPreset");
twoPreset.add(new Option("Load a type from your sheet…", ""));
for (const [name, p] of Object.entries(TWO_PRESETS)) twoPreset.add(new Option(`${name} — Fullness ${p.fam.toFixed(1)}, Apex ${p.apex}%`, name));
twoPreset.addEventListener("change", () => { const p = TWO_PRESETS[twoPreset.value]; if (!p) return; for (const k of KEYS) state.two[k] = { ...p }; recompute(); });
document.getElementById("overlayBtn").addEventListener("click", (e) => { state.overlay = !state.overlay; e.target.classList.toggle("on", state.overlay); drawPlots(); });
document.getElementById("showFinished").addEventListener("change", (e) => { state.showFinished = e.target.checked; drawPlots(); });
document.getElementById("resetAll").addEventListener("click", () => { state.spec = clone(DEFAULT_RAIL_BAND_SPEC); state.two = twoDefaults(); twoPreset.value = ""; recompute(); });
recompute();
</script>
