<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketch 016 — Custom rocker on ROCKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--color-page); color: var(--color-text); font-family: var(--font-sans); min-height: 100vh; }
  button, input, select { font-family: inherit; }

  /* ---------- sketch chrome (not part of the design) ---------- */
  #chrome { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9998; }
  #variant-nav { display: flex; gap: 6px; align-items: center; padding: 8px 16px; background: #0d0f14; border-bottom: 1px solid #262a33; font: 13px/1.2 system-ui, sans-serif; color: #cfd5de; flex-wrap: wrap; position: relative; }
  #variant-nav .sketch-id { font-weight: 700; margin-right: 8px; color: #fff; }
  .variant-tab { background: #1b1f27; color: #cfd5de; border: 1px solid #2c313b; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  .variant-tab:hover { border-color: #4b5361; color: #fff; }
  .variant-tab.active { background: #234f66; border-color: #3490bc; color: #fff; }
  .variant-tab.winner { border-color: #c9a227; }
  .notes-btn { margin-left: auto; }
  #sketch-bar { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 7px 16px; background: #14171d; border-bottom: 1px solid #262a33; font: 12px/1.3 system-ui, sans-serif; color: #aeb5c0; }
  .grp { display: flex; align-items: center; gap: 6px; }
  .seg { display: inline-flex; border: 1px solid #2f343e; border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
  .seg button { background: transparent; color: #aeb5c0; border: 0; padding: 4px 8px; font: 12px system-ui, sans-serif; cursor: pointer; }
  .seg button + button { border-left: 1px solid #2f343e; }
  .seg button:hover { color: #fff; background: #222731; }
  .seg button.on { background: #234f66; color: #fff; }
  #notes-panel { display: none; position: absolute; right: 12px; top: calc(100% + 6px); width: min(520px, calc(100vw - 24px)); max-height: 72vh; overflow-y: auto; background: #12151b; color: #dfe3ea; border: 1px solid #2c313b; border-radius: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.5); padding: 14px 16px; font: 13.5px/1.5 system-ui, sans-serif; }
  #notes-panel.open { display: block; }
  #notes-panel h2 { font-size: 14px; margin: 0 0 6px; color: #fff; }
  #notes-panel h3 { font-size: 12px; margin: 12px 0 4px; letter-spacing: .05em; color: #fff; text-transform: uppercase; }
  #notes-panel p, #notes-panel ul { margin: 0 0 8px; color: #aeb5c0; }
  #notes-panel ul { padding-left: 18px; }
  #notes-panel b { color: #dfe3ea; }
  #stage { padding: 16px 16px 80px; }
  .intro { max-width: 1280px; margin: 0 auto 12px; font: 14px/1.5 system-ui, sans-serif; color: var(--color-text-muted); }
  .intro b { color: var(--color-text); font-weight: 600; }
  .compare { display: flex; gap: 18px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  .compare figure { margin: 0; }
  .compare figcaption { font: 600 13px system-ui, sans-serif; color: var(--color-text); margin: 0 0 6px; }
  .scaler { position: relative; }
  .scaler > .device { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  body.on-phone #stage { padding: 0; }
  body.on-phone .intro { display: none; }
  body.on-phone #variant-nav { padding: 6px 12px; gap: 5px; flex-wrap: nowrap; }
  body.on-phone #sketch-bar { padding: 6px 12px; }
  body.on-phone #sketch-bar.closed { display: none; }
  body.on-phone .variant-tab { padding: 6px 8px; }
  body.on-phone .device { border-radius: 0; border: 0; box-shadow: none; }

  /* ---------- the design: the app's own tokens ---------- */
  :root {
    --foam: color-mix(in srgb, var(--color-text-muted) 24%, transparent);
    --blank-line: color-mix(in srgb, var(--color-text-muted) 60%, transparent);
    --station: color-mix(in srgb, var(--color-text-muted) 36%, transparent);
    --line-faint: color-mix(in srgb, var(--color-line) 40%, transparent);
  }
  .device { margin: 0 auto; background: var(--color-bg); color: var(--color-text); border: 1px solid #000; box-shadow: 0 18px 50px rgba(0,0,0,.45); overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .device.computer { width: 1280px; height: 900px; border-radius: 10px; }
  .device.phone { width: 390px; height: 664px; border-radius: 30px; }
  .device.side { width: 844px; height: 340px; border-radius: 26px; }

  /* top bars */
  .topbar { height: 64px; flex: none; display: flex; align-items: center; padding: 0 28px; gap: 18px; border-bottom: 1px solid var(--color-border); background: var(--color-bg); }
  .device.phone .topbar, .device.side .topbar { height: 48px; padding: 0 14px; gap: 10px; }
  .wordmark { font-size: 21px; letter-spacing: -0.02em; white-space: nowrap; }
  .wordmark b { font-weight: 800; }
  .wordmark small { font-size: 9px; margin-left: 1px; color: var(--color-text-muted); }
  .topnav { margin-left: auto; display: flex; gap: 20px; align-items: center; font-size: 11.5px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-text-muted); }
  .topnav span.on { color: var(--color-text); border-bottom: 2px solid var(--color-text); padding-bottom: 2px; }
  .topnav .sep { width: 1px; height: 18px; background: var(--color-border); }
  .save { background: var(--color-primary); color: var(--color-on-primary); border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 600; font-size: 14px; }
  .device.phone .save, .device.side .save { margin-left: auto; padding: 9px 16px; }
  .ham { font-size: 22px; color: var(--color-text-muted); padding-left: 10px; border-left: 1px solid var(--color-border); }

  /* the shell */
  .shell { flex: 1; min-height: 0; display: flex; }
  .device.phone .shell { flex-direction: column; }
  .sidebar { width: 340px; flex: none; padding: 20px 30px 24px; overflow-y: auto; background: var(--color-surface); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 10px; }
  .device.side .sidebar { width: 300px; padding: 10px 18px 24px; gap: 8px; }
  .device.phone .sidebar { width: auto; flex: 1; border-right: 0; padding: 12px 16px 30px; border-top: 1px solid var(--color-border); }
  .sidebar > * { flex-shrink: 0; }
  .sidebar h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; }
  .sidebar .sub { margin: -4px 0 0; font-size: 13px; line-height: 1.4; color: var(--color-text-muted); }
  .sidebar .boardline { font-size: 12px; color: var(--color-text-muted); }
  .sect { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--color-line); font-size: 12px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; }
  .sect::after { content: "▾"; font-size: 11px; color: var(--color-text-muted); }
  .sect.closed::after { content: "▸"; }
  .sect .sv { margin-left: auto; font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 12px; color: var(--color-text-muted); text-align: right; } .device.side .sect .sv, .device.phone .sect .sv { font-size: 11px; }
  .sect .sv.set { color: var(--color-text); }
  .lblrow { display: flex; justify-content: space-between; align-items: center; font-size: 13px; gap: 8px; }
  .valbox { border: 1px solid var(--color-line); border-radius: 6px; padding: 3px 10px; font-size: 13px; min-width: 64px; text-align: right; }
  .fake-range { height: 4px; border-radius: 2px; background: var(--color-line); position: relative; margin: 8px 0 4px; }
  .fake-range i { position: absolute; top: -5px; width: 14px; height: 14px; border-radius: 50%; background: var(--color-accent-ink); }
  .hints { display: flex; justify-content: space-between; font-size: 10px; color: var(--color-text-muted); }
  .note { font-size: 12px; line-height: 1.45; color: var(--color-text-muted); }
  .note.fine { font-size: 11px; }
  .note.warn { color: var(--color-warning-ink); }
  .link { background: none; border: 0; padding: 0; color: var(--color-accent-ink); font-size: 11px; font-weight: 700; cursor: pointer; text-align: left; }
  .link.muted { color: var(--color-text-muted); }
  .links { display: flex; gap: 14px; flex-wrap: wrap; }
  .stepnav { display: flex; gap: 10px; margin-top: 12px; }
  .stepnav span { flex: 1; text-align: center; border: 1px solid var(--color-line); border-radius: 8px; padding: 10px 0; font-size: 12px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; }
  input[type=range].rng { width: 100%; accent-color: var(--color-accent-ink); margin: 6px 0 2px; display: block; }
  .device.phone input[type=range].rng, .device.side input[type=range].rng { height: 28px; }
  select.sel { border: 1px solid var(--color-line); border-radius: 6px; background: var(--color-surface); color: var(--color-text); font-size: 12px; padding: 3px 6px; }
  .device.phone select.sel, .device.side select.sel { min-height: 36px; font-size: 14px; }
  .endblk { display: flex; flex-direction: column; gap: 4px; padding: 6px 0 2px; }
  .endblk + .endblk { border-top: 1px solid var(--color-border); margin-top: 4px; }
  .endhd { font-size: 11px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-text-muted); display: flex; justify-content: space-between; align-items: center; }
  .chg { display: flex; flex-direction: column; gap: 2px; }
  .chg + .chg { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--color-border); }
  .fromrow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-text-muted); }
  .pair { display: flex; gap: 12px; } .pair .half { flex: 1; min-width: 0; } .pair .sub { font-size: 12px; color: var(--color-text-muted); } .pair .valbox { min-width: 0; padding: 2px 7px; font-size: 12px; white-space: nowrap; }
  .fromrow select { margin-left: auto; }
  .notein { width: 100%; border: 1px solid var(--color-line); border-radius: 6px; background: transparent; color: var(--color-text); padding: 7px 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .notein.bad { border-color: var(--color-warning-ink); }
  .readback { font-size: 12px; color: var(--color-text-muted); line-height: 1.45; }
  .readback b { color: var(--color-text); font-weight: 600; }

  /* the blank button */
  .blankbtn { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--color-line); border-left: 2px solid var(--color-accent-ink); border-radius: 6px; background: var(--color-well); color: var(--color-text); padding: 8px 10px 8px 8px; cursor: pointer; }
  .blankbtn:hover { filter: brightness(1.08); }
  .blankbtn .thumb { width: 92px; flex: none; }
  .blankbtn .thumb svg { width: 100%; height: auto; display: block; }
  .blankbtn .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .blankbtn .nm { font-size: 14px; font-weight: 600; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .blankbtn .rn { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--color-text); }
  .blankbtn .nm .vol { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--color-text-muted); }
  .blankbtn .meta { font-size: 12px; color: var(--color-text-muted); }
  .blankbtn .go { font-size: 11px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-accent-ink); margin-top: 3px; }
  .bcard { border: 1px solid var(--color-line); border-left: 2px solid var(--color-accent-ink); border-radius: 6px; background: var(--color-well); }
  .bcard .blankbtn { border: 0; background: transparent; }
  .bcard .rockrow { display: flex; align-items: center; gap: 8px; padding: 6px 10px 8px 10px; border-top: 1px solid var(--color-border); font-size: 12px; }
  .bcard .rockrow .lab { color: var(--color-text-muted); }
  .bcard .rockrow .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .bcard .rockrow .link { margin-left: auto; }
  .bcard .rockval { padding: 0 10px 8px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: -4px; }
  .bcard .inrows { padding: 2px 10px 8px; border-top: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 4px; }

  /* drawing column */
  .main { flex: 1; min-width: 0; padding: 12px; background: var(--color-canvas); display: flex; flex-direction: column; }
  .device.phone .main { flex: none; height: 372px; padding: 2px; }
  .device.side .main { padding: 4px; }
  .tabs { display: flex; gap: 4px; align-items: flex-end; flex: none; }
  .tab { border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; padding: 6px 16px; font-size: 11.5px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-text-muted); background: transparent; cursor: pointer; }
  .tab.on { border-color: var(--color-line); background: var(--color-surface); color: var(--color-text); }
  .device.phone .tab, .device.side .tab { padding: 3px 7px; font-size: 10.5px; letter-spacing: .1em; }
  .tabs .name { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--color-text-muted); padding: 0 8px 6px; white-space: nowrap; }
  .device.phone .tabs .name, .device.side .tabs .name { font-size: 11px; padding-bottom: 3px; }
  .panel { flex: 1; min-height: 0; border: 1px solid var(--color-line); border-radius: 0 10px 10px 10px; margin-top: -1px; background: var(--color-surface); padding: 10px; display: flex; flex-direction: column; position: relative; }
  .device.phone .panel, .device.side .panel { padding: 2px; }
  .drawing { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .mainwrap { flex: 1; min-height: 0; position: relative; } .mainwrap > svg.mainart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .closeups { flex: none; display: flex; gap: 10px; padding: 0 6px 6px; }
  .closeups figure { margin: 0; flex: 1; min-width: 0; border: 1px solid var(--color-border); border-radius: 8px; padding: 4px 6px 2px; background: var(--color-bg); }
  .closeups figcaption { font-size: 10px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-text-muted); display: flex; justify-content: space-between; }
  .closeups svg { width: 100%; height: 150px; display: block; overflow: hidden; }
  .device.phone .closeups { display: none; }
  .vcap { flex: none; padding: 2px 8px 0; font-size: 11px; color: var(--color-text-muted); }
  .device.phone .vcap { display: none; }
  .tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; } .device.phone .tools { display: none; }
  .tools span { width: 28px; height: 28px; border: 1px solid var(--color-line); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: var(--color-text-muted); background: var(--color-surface); }

  /* the datasheet */
  .sheet { flex: 1; min-height: 0; overflow: auto; padding: 8px 10px 14px; font-size: 12.5px; }
  .sheet .lead { color: var(--color-text-muted); margin: 0 0 8px; font-size: 12px; }
  .sheet table { border-collapse: collapse; min-width: 540px; width: 100%; }
  .sheet th { text-align: right; font-size: 10px; font-weight: 800; letter-spacing: var(--tracking-architectural); text-transform: uppercase; padding: 4px 6px 6px; border-bottom: 2px solid var(--color-border); }
  .sheet th:first-child { text-align: left; }
  .sheet td { text-align: right; padding: 5px 6px; color: var(--color-text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; vertical-align: top; }
  .sheet td:first-child { text-align: left; }
  .sheet td.ink { color: var(--color-text); }
  .sheet td .nat { display: block; font-size: 10px; color: var(--color-text-muted); opacity: .8; }
  .sheet tr.grp td { white-space: normal; padding: 10px 6px 4px; font-size: 10px; font-weight: 800; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-text); }
  .sheet tr.grp td .rn { font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 11px; }
  .sheet tr.grp td .cat { font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 10px; color: var(--color-text-muted); }
  .sheet tr.grp td .rn2 { display: block; font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .sheet td .rnlab { font-size: 11px; font-weight: 600; color: var(--color-text); white-space: normal; display: inline-block; max-width: 150px; font-variant-numeric: tabular-nums; }
  .sheet .foot { margin-top: 10px; display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--color-text-muted); }
  .sheet .order { margin-top: 12px; border: 1px solid var(--color-border); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
  .sheet .order b { display: block; font-size: 10px; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 4px; }
  .sheet .order span { font-variant-numeric: tabular-nums; }
  .device.phone .sheet { font-size: 11.5px; }

  /* the PICK A BLANK popup, as sketch 015 B drew it, with a saved blank among the cards */
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 20; }
  .dialog { width: calc(100% - 64px); max-width: 1180px; height: calc(100% - 64px); background: var(--color-surface); border: 1px solid var(--color-line); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  .device.phone .dialog, .device.side .dialog { width: 100%; height: 100%; border-radius: 0; border: 0; }
  .cat-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; border-bottom: 1px solid var(--color-border); flex-wrap: wrap; }
  .cat-head h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; }
  .cat-head .for { font-size: 12px; color: var(--color-text-muted); }
  .cat-head .x { margin-left: auto; width: 36px; height: 36px; border: 1px solid var(--color-line); border-radius: 8px; background: transparent; color: var(--color-text); font-size: 18px; cursor: pointer; flex: none; }
  .device.phone .cat-head { padding: 6px 8px 6px 14px; } .device.phone .cat-head .for { width: 100%; order: 3; }
  .fbar { flex: none; padding: 10px 14px 8px; border-bottom: 1px solid var(--color-border); }
  .fline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .device.phone .fline, .device.side .fline { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .chip { flex: none; height: 30px; border: 1px solid var(--color-line); border-radius: 999px; background: transparent; color: var(--color-text-muted); padding: 0 11px; font-size: 12px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .chip span { font-weight: 400; opacity: .8; }
  .chip.on { background: var(--color-primary); color: var(--color-on-primary); border-color: transparent; }
  .chip.set { color: var(--color-text); border-color: var(--color-text-muted); }
  .cat-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 14px 24px; }
  .device.phone .cat-scroll, .device.side .cat-scroll { padding: 2px 8px 24px; }
  .grp-label { padding: 12px 2px 6px; font-size: 10px; font-weight: 800; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-text-muted); }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .device.phone .grid { grid-template-columns: 1fr; gap: 8px; }
  .card { position: relative; border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-bg); padding: 9px 10px 8px; display: flex; flex-direction: column; gap: 5px; text-align: left; font-size: 12px; }
  .card.picked { border-color: var(--color-accent-ink); box-shadow: inset 2px 0 0 var(--color-accent-ink); background: var(--color-well); }
  .card.ghost { justify-content: center; color: var(--color-text-muted); border-style: dashed; min-height: 120px; }
  .card .hd { display: flex; align-items: baseline; gap: 8px; }
  .card .hd .nm { font-size: 14px; font-weight: 600; }
  .card .rnline { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: -3px; }
  .card table.st tr.ord td { color: var(--color-text); }
  .card table.st td .rnlab { white-space: normal; display: inline-block; max-width: 92px; line-height: 1.2; }
  .card .hd .fig { margin-left: auto; color: var(--color-text-muted); white-space: nowrap; }
  .card .hd .star { color: var(--color-text-muted); } .card .hd .star.on { color: var(--color-accent-ink); }
  .card .mk { font-size: 11px; color: var(--color-text-muted); }
  .card .yours { color: var(--color-accent-ink); font-weight: 700; } .card .onb { color: var(--color-accent-ink); font-weight: 700; }
  .card table.st { border-collapse: collapse; width: 100%; font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .card table.st th { font-weight: 700; color: var(--color-text-muted); text-align: right; padding: 2px 3px; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; }
  .card table.st td { text-align: right; padding: 2px 3px; color: var(--color-text-muted); border-top: 1px solid var(--color-border); }
  .card table.st td:first-child, .card table.st th:first-child { text-align: left; }
  .card .asord { font-size: 10.5px; color: var(--color-text-muted); }
  .card .pickbtn { align-self: flex-start; margin-top: 2px; }

  /* variant D: the ADVANCED section and the CUSTOMIZE ROCKER popup */
  .sect[data-act="adv"] { cursor: pointer; }
