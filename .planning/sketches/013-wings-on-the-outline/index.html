<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 013 — Wings on the outline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link id="theme-link" rel="stylesheet" href="../themes/app-slate.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--color-page); color: var(--color-text); font-family: var(--font-sans); min-height: 100vh; }
  button, input, select { font-family: inherit; }

  /* ---------- sketch chrome (not part of the design) ---------- */
  #chrome { position: sticky; top: 0; z-index: 9998; }
  #variant-nav { display: flex; gap: 6px; align-items: center; padding: 8px 16px; background: #0d0f14; border-bottom: 1px solid #262a33; font: 13px/1.2 system-ui, sans-serif; color: #cfd5de; flex-wrap: wrap; }
  #variant-nav .sketch-id { font-weight: 700; margin-right: 8px; color: #fff; }
  .variant-tab { background: #1b1f27; color: #cfd5de; border: 1px solid #2c313b; border-radius: 6px; padding: 6px 10px; cursor: pointer; transition: all .15s ease; font: inherit; }
  .variant-tab:hover { border-color: #4b5361; color: #fff; }
  .variant-tab.active { background: #234f66; border-color: #3490bc; color: #fff; }
  .variant-tab.winner { border-color: #c9a227; }
  .variant-tab.winner.active { background: #4a3d10; border-color: #e0b52c; }
  .notes-btn { margin-left: auto; }
  #sketch-bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 7px 16px; background: #14171d; border-bottom: 1px solid #262a33; font: 12px/1.3 system-ui, sans-serif; color: #aeb5c0; }
  #sketch-bar .desc { flex: 1 1 320px; color: #dfe3ea; }
  .grp { display: flex; align-items: center; gap: 6px; }
  .seg { display: inline-flex; border: 1px solid #2f343e; border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: #aeb5c0; border: 0; padding: 4px 8px; font: 12px system-ui, sans-serif; cursor: pointer; transition: all .15s ease; }
  .seg button + button { border-left: 1px solid #2f343e; }
  .seg button:hover { color: #fff; background: #222731; }
  .seg button.on { background: #234f66; color: #fff; }
  .seg button:disabled { opacity: .4; cursor: not-allowed; }
  #sketch-bar .legend { display: inline-flex; gap: 12px; align-items: center; }
  #sketch-bar .legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
  #notes-panel { display: none; position: absolute; right: 12px; top: calc(100% + 6px); width: 440px; max-height: 72vh; overflow-y: auto; background: #12151b; color: #dfe3ea; border: 1px solid #2c313b; border-radius: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.5); padding: 14px 16px; font: 13.5px/1.5 system-ui, sans-serif; }
  #notes-panel.open { display: block; }
  #notes-panel h2 { font-size: 14px; margin: 0 0 6px; color: #fff; }
  #notes-panel h3 { font-size: 12px; margin: 12px 0 4px; letter-spacing: .05em; color: #fff; text-transform: uppercase; }
  #notes-panel p, #notes-panel ul { margin: 0 0 8px; color: #aeb5c0; }
  #notes-panel ul { padding-left: 18px; }
  #notes-panel b { color: #dfe3ea; }
  #sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font: 12px system-ui, sans-serif; background: rgba(0,0,0,0.82); color: #fff; padding: 6px 8px; border-radius: 8px; opacity: .7; transition: opacity .2s; display: flex; flex-direction: column; gap: 6px; }
  #sketch-tools:hover, #sketch-tools.open { opacity: 1; }
  #sketch-tools:not(.open) .row { display: none; }
  #tools-toggle { align-self: flex-end; }
  #sketch-tools .row { display: flex; gap: 4px; align-items: center; }
  #sketch-tools .row > span:first-child { width: 84px; color: #aeb5c0; }
  #sketch-tools button, #tools-toggle { font: 11px system-ui, sans-serif; background: #22262e; color: #fff; border: 1px solid #3a404b; border-radius: 4px; padding: 3px 6px; cursor: pointer; }
  #sketch-tools button.on { background: #234f66; border-color: #3490bc; }

  /* ---------- the design: the app's own tokens, derived exactly as app/globals.css derives them ---------- */
  :root {
    --outline-board-fill: var(--color-board);
    --outline-ink: var(--color-text);
    --outline-dim-ink: var(--color-text);
    --outline-station-line: color-mix(in srgb, var(--color-text-muted) 36%, transparent);
    --outline-widepoint-knot: var(--color-accent-ink);
    --outline-widepoint-line: color-mix(in srgb, var(--color-accent-ink) 45%, transparent);
    --outline-construction: var(--color-accent-ink);
    --outline-ghost: color-mix(in srgb, var(--color-text-muted) 55%, transparent);
    --outline-callout-label: var(--color-text-muted);
    --outline-page-bg: var(--color-canvas);
    --outline-fin: var(--color-accent-ink);
  }
  #stage { padding: 18px 16px 70px; }
  .intro { max-width: 1500px; margin: 0 auto 12px; font-size: 14px; line-height: 1.5; color: var(--color-text-muted); }
  .intro b { color: var(--color-text); font-weight: 600; }
  .sheet { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: 300px 1fr; gap: 14px; align-items: start; }
  .sidebar { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar h3 { margin: 6px 0 2px; font-size: 11px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-text-muted); }
  .sidebar .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; font-size: 13px; }
  .sidebar .row .v { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 64px; text-align: right; }
  .sidebar input[type=range] { width: 100%; accent-color: var(--color-accent-ink); grid-column: 1 / -1; margin: 0; }
  .sidebar .row.dim { opacity: .45; }
  .sidebar label.ck { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .sidebar .note { font-size: 11.5px; color: var(--color-text-muted); line-height: 1.4; }
  .sidebar .pick { display: inline-flex; border: 1px solid var(--color-border); border-radius: 6px; overflow: hidden; }
  .sidebar .pick button { background: transparent; color: var(--color-text-muted); border: 0; padding: 5px 10px; font: 12px/1 var(--font-sans); font-weight: 600; cursor: pointer; transition: all .15s ease; }
  .sidebar .pick button + button { border-left: 1px solid var(--color-border); }
  .sidebar .pick button.on { background: var(--color-primary); color: var(--color-on-primary); }
  .sidebar .pick button:disabled { opacity: .4; cursor: not-allowed; }
  .sidebar .wingcard { border-top: 1px solid var(--color-border); padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .sidebar .wingcard.off { opacity: .4; pointer-events: none; }
  .plates { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
  .plate.zoom { grid-column: 1 / -1; }
  .plate.zoom svg { margin: 0 auto; }
  .plate { background: var(--color-canvas); border: 1px solid var(--color-border); border-radius: 12px; padding: 10px; }
  .plate h4 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-text-muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .plate h4 span { font-weight: 500; letter-spacing: 0; text-transform: none; }
  .plate svg { display: block; overflow: visible; max-width: 100%; height: auto; }
  .cap { font-size: 13px; line-height: 1.55; color: var(--color-text-muted); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; padding: 12px 14px; }
  .cap b { color: var(--color-text); font-weight: 600; }
  .cap table { border-collapse: collapse; margin-top: 8px; font-size: 12.5px; }
  .cap td, .cap th { padding: 3px 10px 3px 0; text-align: left; font-variant-numeric: tabular-nums; }
  .cap th { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 10.5px; color: var(--color-text-muted); }
  .cap td { color: var(--color-text); }
  .lbl { font-family: var(--font-sans); font-weight: 700; fill: var(--outline-callout-label); }
  .val { font-family: var(--font-sans); font-weight: 700; fill: var(--outline-ink); }
  /* the popup — the app's own surfaces */
  #popup { position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); }
  #popup.open { display: flex; }
  #popup .card { width: min(420px, calc(100vw - 32px)); background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 18px 18px 14px; }
  #popup h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; line-height: 1.2; }
  #popup p { margin: 0 0 14px; font-size: 14px; line-height: 1.5; color: var(--color-text-muted); }
  #popup .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  #popup button { font: 12px/1 var(--font-sans); font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--color-border); background: transparent; color: var(--color-text); cursor: pointer; transition: all .15s ease; }
  #popup button.primary { background: var(--color-primary); color: var(--color-on-primary); border-color: transparent; }
  #popup button:hover { filter: brightness(1.08); }
  @media (max-width: 1100px) { .plates { grid-template-columns: 1fr; } }
  @media (max-width: 980px) { .sheet { grid-template-columns: 1fr; } }
</style>
</head>

const MARGIN = 16, DIAMOND_DEPTH_CAP = 5, DIAMOND_BLOCK_MARGIN = 2, MEASURE_STATION = 12;

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function tailHandleMaxLength(dirY, chord, cw, bw) {
  if (Math.abs(dirY) <= EPSILON) return HANDLE_CAP * chord;

  if (Math.abs(dirY) <= EPSILON) return HANDLE_CAP * chord;

function bez1(p0, p1, p2, p3, t) { const mt = 1 - t; return mt * mt * mt * p0 + 3 * mt * mt * t * p1 + 3 * mt * t * t * p2 + t * t * t * p3; }

function interpolateHalfWidth(points, station) {
  for (let i = 0; i < points.length - 1; i++) {
    const [y0, x0] = points[i], [y1, x1] = points[i + 1];
    if (station >= y0 && station <= y1) { const t = y1 > y0 ? (station - y0) / (y1 - y0) : 0; return x0 + (x1 - x0) * t; }

/* spec: { length, widePointWidth, widePointOffset, tailRailLength, noseRailLength, noseAngle, noseFullness,

/* The exact curve (not the 161-point polyline) at a station, by solving the Bezier for its station. */
function exactHalfWidthAt(g, s) {

  if (s >= g.length) return 0;

  let lo = 0, hi = 1;

/* The exact curve's slope dy/ds at a station (for the key's angle readouts). */
function exactSlopeAt(g, s, h = 1e-3) { return (exactHalfWidthAt(g, s + h) - exactHalfWidthAt(g, s - h)) / (2 * h); }

/* ---- wings ----
   A wing: { on, station, depth, run, smoothing }. `station` is where the outline LEAVES the main curve (the
   nose-side edge of the step); the full depth is reached `run + smoothing` further toward the tail. `run` is
   the straight part of the step along the stringer (0 = square step); `smoothing` is spread half on each
   corner, easing them (0 = sharp corners). */
function wingFootprint(w) { return { hi: w.station, lo: w.station - w.run - w.smoothing, inner: w.station - w.run - w.smoothing }; }

/* Share of the depth taken at station s: 0 ahead of the step, 1 behind it, eased through it. */
function stepProfile(w, s) {
  const T = w.run + w.smoothing, hi = w.station, lo = hi - T;
  if (s >= hi) return 0;
  if (s <= lo || T <= 0) return 1;
  const u = (hi - s) / T;                 // 0 at the outer corner, 1 at the inner corner
  const a = (w.smoothing / 2) / T;        // eased share at each end, 0 (sharp) to 1/2 (all ease)
  if (a <= 0) return u;
  const k = 1 / (1 - a);
  if (u <= a) return (k * u * u) / (2 * a);
  if (u >= 1 - a) return 1 - (k * (1 - u) * (1 - u)) / (2 * a);
  return k * (u - a / 2);

/* Half-width at station s with the wings applied, under one of the three constructions:
   "a" — the tail is re-drawn to the block you set: each wing's depth fades to nothing at the tail pod.
   "b" — the tail is moved in: each wing's depth is carried all the way to the tail (the block narrows).
   "c" — a flyer: the tail is as drawn; the outline AHEAD of the wing is widened by the depth, fading out by the widepoint. */
function wingedHalfWidth(g, wings, variant, s) {
  const base = exactHalfWidthAt(g, s);
  if (s <= g.tailPodStation) {
    if (variant !== "b") return base;
    let hw = base; for (const w of wings) if (w.on) hw -= w.depth; return clamp(hw, 0, g.cw);
  }
  let hw = base;
  for (const w of wings) {
    if (!w.on) continue;
    const p = stepProfile(w, s), inner = wingFootprint(w).inner;
    if (variant === "a") {
      const fade = inner > g.tailPodStation ? clamp((s - g.tailPodStation) / (inner - g.tailPodStation), 0, 1) : 0;
      hw -= w.depth * p * fade;
    } else if (variant === "b") {
      hw -= w.depth * p;
    } else {

      hw += w.depth * (1 - p) * fadeWp;
    }
  }

/* A dense list of [station, halfWidth] for drawing: the app's own 161 stations, every 1/20" through the tail

function wingedPoints(g, wings, variant, tailZoomTo = 30) {
  const st = new Set(g.points.map((p) => p[0]));
  for (let s = 0; s <= Math.min(tailZoomTo, g.length); s += 0.05) st.add(Number(s.toFixed(4)));
  for (const w of wings) if (w.on) {
    const f = wingFootprint(w);

  }

function areaOf(points) { let a = 0; for (let i = 0; i < points.length - 1; i++) a += ((points[i][1] + points[i + 1][1]) / 2) * (points[i + 1][0] - points[i][0]); return 2 * a; }

function wingReadouts(g, wings, variant) {

    if (!w.on) return null;
    const f = wingFootprint(w);
    return {

      widthAhead: 2 * wingedHalfWidth(g, wings, variant, f.hi + 1e-6),

/* ---- numbers ---- */
function frac(v, denom = 16) {

/* ---- the board ---- */

/* The two wings as the curve code reads them. `station` is where the outline leaves the main curve; with
   "Station marks the middle of the step" the shaper's number is the step's middle instead, so the leaving
   point sits half the step's length nose-ward of it. */
function resolveWings(board) {
  const fin = frontFin(board);
  const count = state.wings === "none" ? 0 : state.wings === "one" ? 1 : 2;
  return [state.w1, state.w2].map((w, i) => {
    const on = i < count;
    const T = w.run + w.smoothing;
    const locked = w.lock && !!fin;
    let shown = locked ? finEdgeStation(fin, w.edge) + w.finOffset : w.station;

  out += `<rect x="${r2(x - CHIP_W)}" y="${r2(y - CHIP_H / 2)}" width="${CHIP_W}" height="${CHIP_H}" rx="${CHIP_R}" fill="var(--outline-page-bg)" stroke="var(--color-border)"/>`;
  out += `<text class="lbl" x="${r2(cx)}" y="${r2(y - FONT_VALUE * 0.34)}" text-anchor="middle" style="font-size:${FONT_NAME}px;letter-spacing:.12em;${nameColor ? `fill:${nameColor}` : ""}">${esc(name)}</text>`;
  out += `<text class="val" x="${r2(cx)}" y="${r2(y + FONT_VALUE * 0.76)}" text-anchor="middle" style="font-size:${value.length > 9 ? 14 : FONT_VALUE}px">${esc(value)}</text></g>`;

}
function tickSvg(x, y, color = "var(--outline-dim-ink)") { return `<line x1="${r2(x - TICK)}" y1="${r2(y + TICK)}" x2="${r2(x + TICK)}" y2="${r2(y - TICK)}" stroke="${color}" stroke-width="1.1"/>`; }
function outputSvg(edgeX, atY, y, value, station, valueX) {
  // extension line from the board edge at the true station (atY) to the rail; the text may be pushed to y to avoid a neighbour.
  const reach = valueX - VALUE_GAP;
  let out = `<g data-output="${esc(station)}">`;
  if (Math.abs(atY - y) < 0.5) out += `<line x1="${r2(edgeX)}" y1="${r2(atY)}" x2="${r2(reach)}" y2="${r2(atY)}" stroke="var(--outline-station-line)" stroke-width="1"/>`;
  else { const kx = reach - 14; out += `<path d="M ${r2(edgeX)} ${r2(atY)} L ${r2(kx)} ${r2(atY)} L ${r2(kx)} ${r2(y)} L ${r2(reach)} ${r2(y)}" fill="none" stroke="var(--outline-station-line)" stroke-width="1"/>`; }
  out += tickSvg(edgeX, atY);
  out += `<text class="val" x="${r2(valueX)}" y="${r2(y - 2)}" style="font-size:${FONT_VALUE}px">${esc(value)}</text>`;
  out += `<text class="lbl" x="${r2(valueX)}" y="${r2(y + FONT_NAME)}" style="font-size:${FONT_NAME}px;letter-spacing:.1em">${esc(station)}</text></g>`;

/* Keep a column of labels apart: items {y} sorted toward the nose (smaller y = higher on screen); each is pushed

function spread(items, minGap) {
  const order = items.map((it, i) => ({ i, y: it.y })).sort((a, b) => b.y - a.y); // tail first (largest y)
  const out = new Array(items.length);

function dimH(x1, x2, y, value, color = "var(--outline-dim-ink)") {

  const left = Math.min(x1, x2), right = Math.max(x1, x2);
  return `<g><line x1="${r2(left)}" y1="${r2(y)}" x2="${r2(right)}" y2="${r2(y)}" stroke="${color}" stroke-width="1.1"/>${tickSvg(left, y, color)}${tickSvg(right, y, color)}<text class="val" x="${r2(right + 8)}" y="${r2(y + 4.5)}" style="font-size:13px">${esc(value)}</text></g>`;

  return `<g><line x1="${r2(x)}" y1="${r2(top)}" x2="${r2(x)}" y2="${r2(bottom)}" stroke="${color}" stroke-width="1.1"/>${tickSvg(x, top, color)}${tickSvg(x, bottom, color)}${label}</g>`;

function finLinesSvg(board, toX, toY, lateralSign = 1) {
  if (!state.showFins) return "";

    const lx = m.side === 0 ? 0 : Math.abs(m.lateralIn) * m.side * lateralSign, llx = m.side === 0 ? 0 : Math.abs(m.leadingLateralIn) * m.side * lateralSign;
    return `<g data-fin="${m.role}${m.side}"><line x1="${r2(toX(lx))}" y1="${r2(toY(m.offTailIn))}" x2="${r2(toX(llx))}" y2="${r2(toY(m.leadingOffTailIn))}" stroke="var(--outline-fin)" stroke-width="2"/><circle cx="${r2(toX(lx))}" cy="${r2(toY(m.offTailIn))}" r="3.5" fill="var(--outline-ink)"/><circle cx="${r2(toX(llx))}" cy="${r2(toY(m.leadingOffTailIn))}" r="3.5" fill="var(--outline-ink)"/></g>`;

function outlinePath(pts, g, toX, toY, lo = 0, hi = Infinity) {
  // right rail up from the tail pod, left rail back down, closed at the stringer (a swallow's notch sits forward)
  const vis = pts.filter(([s]) => s >= Math.max(lo, g.tailPodStation - 1e-9) && s <= hi);
  const up = vis.map(([s, hw], i) => `${i ? "L" : "M"} ${r2(toX(hw))} ${r2(toY(s))}`);
  const down = vis.slice().reverse().map(([s, hw]) => `L ${r2(toX(-hw))} ${r2(toY(s))}`);
  const closeY = Math.min(g.centreCloseStation, hi);

/* ---- the TEMPLATE drawing, as the app frames it (components/outline/outline-viewer.tsx, callout-primitives.tsx) ---- */
function templateSvg(board, g, wings, variant, pts, basePts) {
  const L = g.length, scale = (620 - 48) / L, cxl = 170, tailPy = 596, tipPy = 24;
  const toY = (s) => tailPy - s * scale, toX = (hw) => cxl + hw * scale;
  const halfPx = g.cw * scale, overflow = Math.max(0, halfPx - (282 - 36.5 - cxl));
  const minX = -104 - overflow, width = 514 + 2 * overflow, chipRightX = 58 - overflow, valueX = 282 + overflow;
  const hwAt = (s) => wingedHalfWidth(g, wings, variant, s);
  const wpS = g.widePointStation, midS = L / 2, noseS = L - 12, tailS = 12;
  let out = `<svg viewBox="${r2(minX)} -16 ${r2(width)} 638" width="${r2(width * 620 / 638)}" height="620" font-family="var(--font-sans)">`;
  // base curve (wings off) as a ghost, under the board
  if (state.base === "on" && wings.some((w) => w.on)) out += `<path d="${outlinePath(basePts, g, toX, toY)}" fill="none" stroke="var(--outline-ghost)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  out += `<path d="${outlinePath(pts, g, toX, toY)}" fill="var(--outline-board-fill)" stroke="var(--outline-ink)" stroke-width="2" stroke-linejoin="round"/>`;
  // reference lines: stringer, mid-length, the two 12" stations, the widepoint (input colour + its dash)
  out += `<line x1="${cxl}" y1="${tipPy - 6}" x2="${cxl}" y2="${tailPy + 6}" stroke="var(--outline-station-line)" stroke-dasharray="${STRINGER_DASH}"/>`;
  for (const [s, dash] of [[midS, STRINGER_DASH], [noseS, STATION_DASH], [tailS, STATION_DASH]]) { const hw = hwAt(s); out += `<line x1="${r2(toX(-hw))}" y1="${r2(toY(s))}" x2="${r2(toX(hw))}" y2="${r2(toY(s))}" stroke="var(--outline-station-line)" stroke-dasharray="${dash}"/>`; }
  out += `<line x1="${r2(toX(-g.cw))}" y1="${r2(toY(wpS))}" x2="${r2(toX(g.cw))}" y2="${r2(toY(wpS))}" stroke="var(--outline-widepoint-line)" stroke-dasharray="${WIDEPOINT_DASH}"/>`;
  out += `<circle cx="${r2(toX(-g.cw))}" cy="${r2(toY(wpS))}" r="2.6" fill="var(--outline-widepoint-knot)"/><circle cx="${r2(toX(g.cw))}" cy="${r2(toY(wpS))}" r="2.6" fill="var(--outline-widepoint-knot)"/>`;
  // construction: the app's three knots and four handles, plus each wing's two corners
  if (state.construction) {
    for (let i = 0; i < 2; i++) { const c = g.controls[i], A = g.knots[i], B = g.knots[i + 1]; out += `<line x1="${r2(toX(A.y))}" y1="${r2(toY(A.x))}" x2="${r2(toX(c.c1.y))}" y2="${r2(toY(c.c1.x))}" stroke="var(--outline-construction)" stroke-dasharray="2 3"/><line x1="${r2(toX(B.y))}" y1="${r2(toY(B.x))}" x2="${r2(toX(c.c2.y))}" y2="${r2(toY(c.c2.x))}" stroke="var(--outline-construction)" stroke-dasharray="2 3"/><circle cx="${r2(toX(c.c1.y))}" cy="${r2(toY(c.c1.x))}" r="3" fill="var(--color-bg)" stroke="var(--outline-construction)"/><circle cx="${r2(toX(c.c2.y))}" cy="${r2(toY(c.c2.x))}" r="3" fill="var(--color-bg)" stroke="var(--outline-construction)"/>`; }
    for (const k of g.knots) out += `<circle cx="${r2(toX(k.y))}" cy="${r2(toY(k.x))}" r="3.5" fill="var(--outline-construction)"/>`;
    for (const w of wings) if (w.on) { const f = wingFootprint(w); for (const s of [f.hi, f.inner]) out += `<circle cx="${r2(toX(hwAt(s + (s === f.hi ? 1e-6 : -1e-6))))}" cy="${r2(toY(s))}" r="3.5" fill="var(--outline-construction)"/>`; }
  }
  out += finLinesSvg(board, toX, toY);
  // outputs on the one right rail: nose 12", centre, tail 12" — pushed apart only if they would touch
  const outputs = [{ s: noseS, value: frac(2 * hwAt(noseS)), station: 'Nose @ 12"' }, { s: midS, value: frac(2 * hwAt(midS)), station: "Center" }, { s: tailS, value: frac(2 * hwAt(tailS)), station: 'Tail @ 12"' }];
  const oy = spread(outputs.map((o) => ({ y: toY(o.s) })), 40);
  outputs.forEach((o, i) => { out += outputSvg(toX(hwAt(o.s)), toY(o.s), oy[i], o.value, o.station, valueX); });
  // inputs as chips in the left gutter: LENGTH, WIDEPOINT (+ WP OFFSET beneath), TAIL BLOCK, and each wing
  const s = board.spec;
  out += chipSvg(chipRightX, tipPy, "LENGTH", `${Math.floor(L / 12 + 1e-9)}'${frac(L - 12 * Math.floor(L / 12 + 1e-9), 8)}`, null, { toX: cxl, atY: tipPy });
  out += chipSvg(chipRightX, toY(wpS), "WIDEPOINT", frac(s.widePointWidthIn, 8), "var(--outline-widepoint-knot)", { toX: toX(-g.cw), atY: toY(wpS) });
  out += chipSvg(chipRightX, toY(wpS) + CHIP_H + 6, "WP OFFSET", (s.widePointOffsetIn === 0 ? "0\"" : (s.widePointOffsetIn > 0 ? "+" : "−") + frac(Math.abs(s.widePointOffsetIn), 8)), null, null);
  const tailChips = [];
  if (!g.tailBlockPinned) tailChips.push({ y: toY(g.tailPodStation), name: "TAIL BLOCK", value: frac(2 * hwAt(g.tailPodStation + 1e-9), 8), toX: toX(-hwAt(g.tailPodStation + 1e-9)), color: null });
  for (const w of wings) if (w.on) tailChips.push({ y: toY(w.shown), name: w.label + (w.locked ? " · FIN" : ""), value: `${frac(w.depth)} @ ${frac(w.shown, 8)}`, toX: toX(-hwAt(w.station + 1e-6)), color: w.locked ? "var(--outline-fin)" : null, atY: toY(w.station) });
  const cy = spread(tailChips.map((c) => ({ y: c.y })), CHIP_H + 6);
  tailChips.forEach((c, i) => { out += chipSvg(chipRightX, cy[i], c.name, c.value, c.color, { toX: c.toX, atY: c.atY ?? c.y }); });
  return out + "</svg>";
}

/* ---- the tail, closer: the same strokes, with the wing's own dimensions ---- */
function zoomSvg(board, g, wings, variant, curves) {
  const Z = Number(state.zoom), padY = 16, zs = (620 - 2 * padY) / Z;
  const hwMax = Math.max(...curves.map((c) => Math.max(...c.pts.filter(([s]) => s <= Z).map((p) => p[1]))));
  const gutterL = 214, railR = 240, cx = gutterL + hwMax * zs + 20, W = Math.ceil(cx + hwMax * zs + 20 + railR), H = 620;
  const toY = (s) => H - padY - s * zs, toX = (hw) => cx + hw * zs;
  const many = curves.length > 1, main = curves[0];
  const hwAt = (s) => wingedHalfWidth(g, wings, variant, s);
  let out = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="var(--font-sans)">`;
  // the base curve under everything
  if (state.base === "on" || many) out += `<path d="${outlinePath(main.basePts, g, toX, toY, 0, Z)}" fill="none" stroke="var(--outline-ghost)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  if (!many) {
    out += `<path d="${outlinePath(main.pts, g, toX, toY, 0, Z)}" fill="var(--outline-board-fill)" stroke="none"/>`;
    // the ink line: the two rails and the tail only (no line across the window's top)
    const vis = main.pts.filter(([s]) => s >= g.tailPodStation - 1e-9 && s <= Z);
    const right = vis.map(([s, hw], i) => `${i ? "L" : "M"} ${r2(toX(hw))} ${r2(toY(s))}`).join(" ");
    const left = vis.map(([s, hw], i) => `${i ? "L" : "M"} ${r2(toX(-hw))} ${r2(toY(s))}`).join(" ");
    const tailClose = `M ${r2(toX(-vis[0][1]))} ${r2(toY(vis[0][0]))} L ${r2(toX(0))} ${r2(toY(g.centreCloseStation))} L ${r2(toX(vis[0][1]))} ${r2(toY(vis[0][0]))}`;
    out += `<path d="${right} ${left} ${tailClose}" fill="none" stroke="var(--outline-ink)" stroke-width="2" stroke-linejoin="round"/>`;
  }
  out += `<line x1="${r2(cx)}" y1="0" x2="${r2(cx)}" y2="${r2(toY(0) + 6)}" stroke="var(--outline-station-line)" stroke-dasharray="${STRINGER_DASH}"/>`;
  // the 12" station and the widepoint if in the window
  const hw12 = hwAt(12); out += `<line x1="${r2(toX(-hw12))}" y1="${r2(toY(12))}" x2="${r2(toX(hw12))}" y2="${r2(toY(12))}" stroke="var(--outline-station-line)" stroke-dasharray="${STATION_DASH}"/>`;
  if (g.widePointStation <= Z) out += `<line x1="${r2(toX(-g.cw))}" y1="${r2(toY(g.widePointStation))}" x2="${r2(toX(g.cw))}" y2="${r2(toY(g.widePointStation))}" stroke="var(--outline-widepoint-line)" stroke-dasharray="${WIDEPOINT_DASH}"/>`;
  if (many) for (const c of curves) {
    const vis = c.pts.filter(([s]) => s >= g.tailPodStation - 1e-9 && s <= Z);
    const d = vis.map(([s, hw], i) => `${i ? "L" : "M"} ${r2(toX(hw))} ${r2(toY(s))}`).join(" ") + " " + vis.map(([s, hw], i) => `${i ? "L" : "M"} ${r2(toX(-hw))} ${r2(toY(s))}`).join(" ");
    out += `<path d="${d}" fill="none" stroke="${c.ink}" stroke-width="${c.width}" ${c.dash ? `stroke-dasharray="${c.dash}"` : ""} stroke-linejoin="round"/>`;
  }
  out += finLinesSvg(board, toX, toY);
  // the right rail: derived widths at the 12" station, the tail block, and ahead of / behind each wing
  const valueX = toX(hwMax) + 124, extEnd = toX(hwMax) + 50;
  const outputs = [{ s: 12, value: frac(2 * hw12), station: 'Tail @ 12"', edge: toX(hw12) }];
  if (!g.tailBlockPinned) outputs.push({ s: g.tailPodStation, value: frac(2 * hwAt(g.tailPodStation + 1e-9), 8), station: "Tail block", edge: toX(hwAt(g.tailPodStation + 1e-9)) });
  wings.forEach((w, wi) => {
    if (!w.on) return;
    const f = wingFootprint(w), ahead = hwAt(f.hi + 1e-6), behind = hwAt(f.inner - 1e-6);
    outputs.push({ s: f.hi, value: frac(2 * ahead), station: `Ahead of ${w.label.toLowerCase()}`, edge: toX(ahead) });
    outputs.push({ s: f.inner, value: frac(2 * behind), station: `Behind ${w.label.toLowerCase()}`, edge: toX(behind) });
    // the depth, dimensioned across the step in the clear air just tail-ward of the inner corner
    const yd = toY(f.inner) + 18;
    out += `<line x1="${r2(toX(ahead))}" y1="${r2(toY(f.hi))}" x2="${r2(toX(ahead))}" y2="${r2(yd + 5)}" stroke="var(--outline-station-line)"/>`;
    out += `<line x1="${r2(toX(behind))}" y1="${r2(toY(f.inner))}" x2="${r2(toX(behind))}" y2="${r2(yd + 5)}" stroke="var(--outline-station-line)"/>`;
    out += dimH(toX(behind), toX(ahead), yd, frac(w.depth));
    // the step's length along the board, when it has one — to the right of the extension lines
    const span = toY(f.inner) - toY(f.hi);
    if (w.run + w.smoothing > 0 && span >= 10) {
      const x = extEnd + 2;
      out += `<g><line x1="${r2(x)}" y1="${r2(toY(f.hi))}" x2="${r2(x)}" y2="${r2(toY(f.inner))}" stroke="var(--outline-dim-ink)" stroke-width="1.1"/>${tickSvg(x, toY(f.hi))}${tickSvg(x, toY(f.inner))}<text class="val" x="${r2(x + 7)}" y="${r2((toY(f.hi) + toY(f.inner)) / 2 + 4.5)}" style="font-size:13px">${esc(frac(w.run + w.smoothing, 8))}</text></g>`;
    }
    // the fin lock: a dotted accent line at the fin's edge, from the stringer out past the rail
    if (w.locked && state.showFins && w.finStation !== null) out += `<line x1="${r2(toX(0))}" y1="${r2(toY(w.finStation))}" x2="${r2(toX(-ahead) - 34)}" y2="${r2(toY(w.finStation))}" stroke="var(--outline-fin)" stroke-dasharray="2 3"/>`;
  });
  const oy = spread(outputs.map((o) => ({ y: toY(o.s) })), 40);
  outputs.forEach((o, i) => { out += outputSvg(o.edge, toY(o.s), oy[i], o.value, o.station, valueX); });
  // inputs: the wing chips in the left gutter, leader to where the outline leaves the curve
  const chipRight = gutterL - 14;
  const chips = wings.filter((w) => w.on).map((w) => ({ y: toY(w.shown), atY: toY(w.station), name: w.label + (w.locked ? " · FIN" : ""), value: `${frac(w.depth)} @ ${frac(w.shown, 8)}`, toX: toX(-hwAt(w.station + 1e-6)), color: w.locked ? "var(--outline-fin)" : null }));
  const cy = spread(chips.map((c) => ({ y: c.y })), CHIP_H + 6);
  chips.forEach((c, i) => { out += chipSvg(chipRight, cy[i], c.name, c.value, c.color, { toX: c.toX, atY: c.atY }); });
  // each wing's station from the tail, dimensioned at the far left, clear of the chips
  wings.forEach((w, wi) => { if (w.on) out += dimV(22 + wi * 30, toY(0), toY(w.shown), frac(w.shown, 8), "start"); });
  return out + "</svg>";
}

/* ---- captions ---- */
function describeWing(w, board, g, wings, variant, i) {
  const fin = frontFin(board), f = wingFootprint(w);
  const ahead = 2 * wingedHalfWidth(g, wings, variant, f.hi + 1e-6), behind = 2 * wingedHalfWidth(g, wings, variant, f.inner - 1e-6);
  const kind = w.run + w.smoothing === 0 ? "a square step" : w.smoothing === 0 ? `an angled step ${frac(w.run, 8)} long` : w.run === 0 ? `a smooth bump eased over ${frac(w.smoothing, 8)}` : `a ${frac(w.run, 8)} step with its corners eased over ${frac(w.smoothing, 8)}`;
  let where = `<b>${frac(w.shown, 8)}</b> from the tail`;
  if (fin) { const d = w.shown - fin.offTailIn; where += w.locked ? ` — locked to the front fins' ${w.edge} edge${w.finOffset ? `, ${w.finOffset > 0 ? "+" : "−"}${frac(Math.abs(w.finOffset), 8)}` : ""}` : ` (the front fins' trailing edge is ${dec(fin.offTailIn)} off the tail, so the wing sits ${Math.abs(d) < 1 / 32 ? "right on it" : `${frac(Math.abs(d), 8)} ${d > 0 ? "ahead of" : "behind"} it`})`; }
  return `<b>Wing ${i + 1}</b> at ${where}: ${frac(w.depth)} deep, ${kind}. Width <b>${frac(ahead)}</b> ahead → <b>${frac(behind)}</b> behind.`;
}
function captionHtml(board, g, wings, variant, pts, basePts) {
  const on = wings.filter((w) => w.on);
  const block = 2 * wingedHalfWidth(g, wings, variant, g.tailPodStation + 1e-9), blockBase = 2 * g.bw;
  const area = areaOf(pts), areaBase = areaOf(basePts), t12 = 2 * wingedHalfWidth(g, wings, variant, 12), t12b = 2 * exactHalfWidthAt(g, 12);
  const head = { a: "<b>A — the tail is re-drawn to the block you set.</b> Ahead of the wing nearest the nose the outline is exactly the curve you drew; behind each wing its depth is taken out and fades to nothing at the tail block, so the block stays the number on its chip. With two wings the steps add up, like a staircase.", b: "<b>B — the tail is moved in.</b> Behind a wing the whole tail is narrower by the depth, all the way down: the tail block narrows by twice the depth, and on a pin or round tail the tip arrives early.", c: "<b>C — a flyer.</b> The curve you drew is the tail; ahead of the wing the outline is widened by the depth, fading back to your curve by the widepoint. The tail block and the 12\" tail width are untouched; the width ahead of the fins grows.", x: "<b>All three on one tail.</b> Dotted: the curve with no wing. Solid ink: A. Blue: B. Dashed ink: C. The main drawing is hidden here; the sliders still work." }[variant];
  if (!on.length) return `<p>${head}</p><p>No wing yet — pick <b>One</b> or <b>Two</b> in the sidebar. The drawing is the app's TEMPLATE screen for the ${esc(board.name)} exactly as it is today.</p>`;
  const rows = on.map((w, i) => `<p>${describeWing(w, board, g, wings, variant, i)}</p>`).join("");
  const table = `<table><tr><th></th><th>No wing</th><th>With wing${on.length > 1 ? "s" : ""}</th></tr>
    <tr><td>Tail block</td><td>${g.tailBlockPinned ? "—" : frac(blockBase, 8)}</td><td>${g.tailBlockPinned ? "—" : frac(block, 8)}${!g.tailBlockPinned && Math.abs(block - blockBase) > 1e-6 ? " (narrowed)" : ""}</td></tr>
    <tr><td>Tail @ 12"</td><td>${frac(t12b)}</td><td>${frac(t12)}</td></tr>
    <tr><td>Planshape area</td><td>${areaBase.toFixed(0)} sq in</td><td>${area.toFixed(0)} sq in (${area >= areaBase ? "+" : "−"}${(Math.abs(area - areaBase) / areaBase * 100).toFixed(1)}%)</td></tr></table>`;
  return `<p>${head}</p>${rows}${table}`;
}

/* ---- the sidebar (the TEMPLATE page's controls, as the sketch needs them) ---- */
function sliderRow(wi, field, label, min, max, step, value, fmt, dim) {
  return `<div class="row${dim ? " dim" : ""}"><span>${label}</span><span class="v">${fmt(value)}</span><input type="range" data-wing="${wi}" data-field="${field}" min="${min}" max="${max}" step="${step}" value="${value}" ${dim ? "disabled" : ""}></div>`;
}
function wingCard(i, w, board) {
  const fin = frontFin(board), on = (state.wings === "one" && i === 0) || state.wings === "two";
  const locked = w.lock && !!fin;
  return `<div class="wingcard${on ? "" : " off"}">
    <h3>Wing ${i + 1}</h3>
    ${sliderRow(i, "station", "Position from tail", STATION_RANGE[0], STATION_RANGE[1], 0.125, w.station, (v) => frac(v, 8), locked)}
    <label class="ck"><input type="checkbox" data-wing="${i}" data-check="lock" ${w.lock ? "checked" : ""} ${fin ? "" : "disabled"}> Lock to front fin${fin ? "" : " <span class=\"note\">(no side fins on this board)</span>"}</label>
    ${locked ? `<div class="row"><span>Fin edge</span><span class="pick"><button data-wing="${i}" data-pick="edge" data-v="trailing" class="${w.edge === "trailing" ? "on" : ""}">Trailing</button><button data-wing="${i}" data-pick="edge" data-v="leading" class="${w.edge === "leading" ? "on" : ""}">Leading</button></span></div>
      ${sliderRow(i, "finOffset", "Offset from the fin", -3, 3, 0.125, w.finOffset, (v) => (v === 0 ? '0"' : (v > 0 ? "+" : "−") + frac(Math.abs(v), 8)), false)}` : ""}
    ${sliderRow(i, "depth", "Depth", 0.0625, 1, 0.0625, w.depth, (v) => frac(v), false)}
    ${sliderRow(i, "run", "Run along the stringer", 0, 1, 0.125, w.run, (v) => frac(v, 8), false)}
    ${sliderRow(i, "smoothing", "Smoothing", 0, 3, 0.125, w.smoothing, (v) => frac(v, 8), false)}
  </div>`;
}
function sidebarHtml(board) {
  const pick = (key, options) => `<span class="pick">${options.map(([v, label]) => `<button data-set="${key}" data-v="${v}" class="${String(state[key]) === String(v) ? "on" : ""}">${label}</button>`).join("")}</span>`;
  return `<aside class="sidebar">
    <h3>Board</h3>
    <div class="row"><span>${esc(board.name)} · ${frac(board.spec.lengthIn, 8)} × ${frac(board.spec.widePointWidthIn, 8)} · ${esc(board.spec.tail.kind)} · ${esc(board.finSetup)}</span></div>
    ${pick("board", DATA.boards.map((b) => [b.id, b.name.replace(" board", "")]))}
    <h3>Wings</h3>
    <div class="row"><span>How many</span>${pick("wings", [["none", "None"], ["one", "One"], ["two", "Two"]])}</div>
    <div class="row"><span>Position marks</span>${pick("marks", [["start", "Where the step starts"], ["middle", "Its middle"]])}</div>
    ${wingCard(0, state.w1, board)}
    ${wingCard(1, state.w2, board)}
    <h3>Settings</h3>
    <label class="ck"><input type="checkbox" data-check="showFins" ${state.showFins ? "checked" : ""}> Show fins <span class="note">(marks only, no dims)</span></label>
    <label class="ck"><input type="checkbox" data-check="construction" ${state.construction ? "checked" : ""}> Show construction</label>
    <label class="ck"><input type="checkbox" data-check="base" ${state.base === "on" ? "checked" : ""}> Show the curve without wings</label>
    <p class="note">Adding a wing turns <b>Show fins</b> on and asks you to dial in the placement (the founder, 2026-10-14). Fins come from the FINS page with Import Template ticked.</p>
  </aside>`;
}

/* ---- render ---- */
function renderNav() {
  const nav = document.getElementById("variant-nav");
  nav.innerHTML = `<span class="sketch-id">Sketch 013</span>` + VARIANTS.map((v) => `<button class="variant-tab${v.winner ? " winner" : ""}${v.id === state.variant ? " active" : ""}" data-variant="${v.id}">${esc(v.label)}</button>`).join("") + `<button class="variant-tab notes-btn" data-notes="1">${document.getElementById("notes-panel").classList.contains("open") ? "Close notes" : "Notes"}</button>`;
}
function renderBar() {
  const bar = document.getElementById("sketch-bar");
  const legend = state.variant === "x" ? `<span class="legend"><span><i style="border-color:var(--color-text-muted);border-top-style:dotted"></i>no wing</span><span><i style="border-color:var(--color-text)"></i>A</span><span><i style="border-color:var(--compare-b)"></i>B</span><span><i style="border-color:var(--color-text);border-top-style:dashed"></i>C</span></span>` : "";
  bar.innerHTML = `<span class="desc">Up to <b>two wings</b> on the TEMPLATE outline — each ${frac(1 / 16)} to 1" deep, a step 0 to 1" long along the stringer, eased over 0 to 3", placed by hand or locked to the front fin. How should the step read, and what happens to the tail behind it?</span>${legend}`;
}
function platesHtml(board) {
  const g = buildOutline(specOf(board.spec)), wings = resolveWings(board);
  const off = wings.map((w) => ({ ...w, on: false }));
  const basePts = wingedPoints(g, off, "a", Number(state.zoom));
  const variant = state.variant, many = variant === "x";
  const curves = many
    ? [{ v: "a", pts: wingedPoints(g, wings, "a", Number(state.zoom)), basePts, ink: "var(--outline-ink)", width: 2 }, { v: "b", pts: wingedPoints(g, wings, "b", Number(state.zoom)), basePts, ink: "var(--compare-b)", width: 2 }, { v: "c", pts: wingedPoints(g, wings, "c", Number(state.zoom)), basePts, ink: "var(--outline-ink)", width: 1.5, dash: "6 3" }]
    : [{ v: variant, pts: wingedPoints(g, wings, variant, Number(state.zoom)), basePts, ink: "var(--outline-ink)", width: 2 }];
  const pts = curves[0].pts;
  return `<div class="plate zoom"><h4>The tail, closer<span>last ${state.zoom}" · ${(620 / Number(state.zoom) / ((620 - 48) / g.length)).toFixed(1)}× the drawing beside</span></h4>${zoomSvg(board, g, wings, many ? "a" : variant, curves)}</div>
    ${many ? "" : `<div class="plate tpl"><h4>Template<span>as the app frames it</span></h4>${templateSvg(board, g, wings, variant, pts, basePts)}</div>`}
    <div class="cap" style="${many ? "grid-column:1 / -1" : ""}">${captionHtml(board, g, wings, many ? "a" : variant, pts, basePts)}</div>`;
}
function renderPlates() { const el = document.querySelector(".plates"); if (el) el.innerHTML = platesHtml(boardOf()); }
function renderStage() {
  const board = boardOf(), fin = frontFin(board);
  const stage = document.getElementById("stage");
  stage.innerHTML = `<p class="intro"><b>The TEMPLATE screen</b> for the ${esc(board.name)}, drawn with the app's own curve (this page's copy reproduces the app's 161 points to a millionth of an inch) and its own callout grammar, with the last ${state.zoom}" of the tail closer above it. ${fin ? `The ${esc(board.finSetup)} fins sit where the FINS page puts them: front fins ${dec(fin.offTailIn)} off the tail at the trailing edge, ${dec(fin.leadingOffTailIn)} at the leading edge.` : "This board has no side fins, so the fin lock is unavailable."}</p>
    <div class="sheet">${sidebarHtml(board)}<div class="plates">${platesHtml(board)}</div></div>`;
}
function renderNotes() {
  document.getElementById("notes-panel").innerHTML = `
    <h2>Sketch 013 — wings on the outline</h2>
    <p>The founder, 2026-10-14: up to two wings, each 1/16" to 1" deep (toward the stringer), an offset of 0 to 1" along the stringer, and "a sharp wing to a smooth bump" — a smoothing slider spreading the step over 0 to 3" of curve; a wing may be locked to the front fin's position, with an offset. Adding a wing turns on a "Show fins" setting on the TEMPLATE page (marks, no dims) and pops up "Dial in your wing placement…".</p>
    <h3>How the four numbers are read here</h3>
    <ul>
      <li><b>Position</b> — the station where the outline leaves the curve you drew (or, with "Its middle", the middle of the step). Locked, it is the front fin's trailing or leading edge plus the offset.</li>
      <li><b>Depth</b> — how far the outline steps in toward the stringer.</li>
      <li><b>Run</b> — how far along the stringer the step itself travels: 0 is a square step, 1" an angled one.</li>
      <li><b>Smoothing</b> — the step's two corners eased, half the length at each: 0 is a sharp wing, 3" a smooth bump. The step's whole length is run + smoothing.</li>
    </ul>
    <h3>The three constructions</h3>
    <ul>
      <li><b>A — tail re-drawn to your block.</b> Ahead of the wing nearest the nose the outline is your curve exactly; behind each wing its depth fades to nothing by the tail pod, so the tail block keeps its number. Two wings add up, like a staircase.</li>
      <li><b>B — tail moved in.</b> The depth is carried all the way to the tail; the block narrows by twice the depth; pins and rounds reach zero width early.</li>
      <li><b>C — flyer.</b> Your curve is the tail; ahead of the wing the outline is widened by the depth, fading back by the widepoint.</li>
    </ul>
    <h3>What to look for</h3>
    <ul>
      <li>Which construction matches what you'd cut: does a wing take width out of the tail (A, B) or add it ahead of the fins (C)? Should the tail block you set survive (A) or not (B)?</li>
      <li>Drag Run and Smoothing: does run + smoothing cover every wing you've shaped, from a hard winger to a bump? Is 3" enough smoothing?</li>
      <li>Lock a wing to the fin: trailing or leading edge — which do you measure a wing from? Try the Fish (twin) and the Mid-length (quad).</li>
      <li>Two wings close together (try 11" and 13"): do the chips and read-outs stay legible? That is sketch 015's question, visible here.</li>
      <li>The popup: once per board, or every time a wing is added?</li>
    </ul>
    <h3>If it gets built</h3>
    <ul>
      <li>The wing is a new outline feature in lib/geometry (station, depth, run, smoothing, lock), applied after today's curve: boards without wings redraw identically, so nothing saved changes. Every reader of the outline — the printed templates, FINS' tail drawing, volume, the rack, the ☰ tiles — follows automatically through the one builder.</li>
      <li>The lock reads the FINS page's placement, so the two screens share state: the popup is how the shaper is told.</li>
    </ul>`;
}
function renderTools() {
  document.getElementById("t-theme").innerHTML = ["slate", "daylight"].map((t) => `<button data-tool="theme" data-v="${t}" class="${state.theme === t ? "on" : ""}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("");
  document.getElementById("t-zoom").innerHTML = ["20", "26", "32"].map((z) => `<button data-tool="zoom" data-v="${z}" class="${state.zoom === z ? "on" : ""}">${z}"</button>`).join("");
}
function applyTheme() {
  const root = document.documentElement.style;
  for (const [k, v] of Object.entries({ ...COMMON_VARS, ...PALETTES[state.theme] })) root.setProperty(k, v);
  const link = document.getElementById("theme-link"); if (link) link.href = `../themes/app-${state.theme}.css`;
}
function renderAll() { applyTheme(); renderNav(); renderBar(); renderNotes(); renderTools(); renderStage(); }
function openPopup() { document.getElementById("popup").classList.add("open"); }
function closePopup() { document.getElementById("popup").classList.remove("open"); }

document.getElementById("variant-nav").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.notes) { document.getElementById("notes-panel").classList.toggle("open"); renderNav(); return; }
  state.variant = b.dataset.variant; save(); renderAll();
});
document.getElementById("stage").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.set) {
    const key = b.dataset.set, v = b.dataset.v, had = state.wings !== "none";
    state[key] = v;
    // the founder's rule: adding a wing turns Show fins on and asks the shaper to dial in the placement
    if (key === "wings" && !had && v !== "none") { state.showFins = true; openPopup(); }
    save(); renderStage(); return;
  }
  if (b.dataset.pick) { const w = state[b.dataset.wing === "0" ? "w1" : "w2"]; w[b.dataset.pick] = b.dataset.v; save(); renderStage(); }
});
document.getElementById("stage").addEventListener("input", (e) => {
  const el = e.target; if (!el.matches("input[type=range]")) return;
  const w = state[el.dataset.wing === "0" ? "w1" : "w2"]; w[el.dataset.field] = Number(el.value); save();
  // redraw the plates and this slider's own readout, never the slider under the thumb
  const fmt = { station: (v) => frac(v, 8), finOffset: (v) => (v === 0 ? '0"' : (v > 0 ? "+" : "−") + frac(Math.abs(v), 8)), depth: (v) => frac(v), run: (v) => frac(v, 8), smoothing: (v) => frac(v, 8) }[el.dataset.field];
  const readout = el.parentElement.querySelector(".v"); if (readout && fmt) readout.textContent = fmt(Number(el.value));
  renderPlates();
});
document.getElementById("stage").addEventListener("change", (e) => {
  const el = e.target; if (!el.matches("input[type=checkbox]")) return;
  if (el.dataset.check === "lock") { const w = state[el.dataset.wing === "0" ? "w1" : "w2"]; w.lock = el.checked; }
  else if (el.dataset.check === "base") state.base = el.checked ? "on" : "off";
  else state[el.dataset.check] = el.checked;
  save(); renderStage();
});
document.getElementById("popup").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) closePopup(); else if (e.target.id === "popup") closePopup(); });
document.getElementById("sketch-tools").addEventListener("click", (e) => { const b = e.target.closest("[data-tool]"); if (!b) return; state[b.dataset.tool] = b.dataset.v; save(); renderAll(); });
document.getElementById("tools-toggle").onclick = () => document.getElementById("sketch-tools").classList.toggle("open");
renderAll();
</script>
</body>
</html>
