<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketch 009 — Board rack on a phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link id="theme-link" rel="stylesheet" href="../themes/app-slate.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--color-page); color: var(--color-text); font-family: var(--font-sans); min-height: 100vh; }
  button { font-family: inherit; }

  /* ---------- sketch chrome (not part of the design) ---------- */
  #variant-nav { position: sticky; top: 0; z-index: 9998; display: flex; gap: 6px; align-items: center; padding: 9px 16px; background: #0d0f14; border-bottom: 1px solid #262a33; font: 13px/1.2 system-ui, sans-serif; color: #cfd5de; flex-wrap: wrap; }
  #variant-nav .sketch-id { font-weight: 700; margin-right: 8px; color: #fff; }
  .variant-tab { background: #1b1f27; color: #cfd5de; border: 1px solid #2c313b; border-radius: 6px; padding: 6px 10px; cursor: pointer; transition: all .15s ease; font: inherit; }
  .variant-tab:hover { border-color: #4b5361; color: #fff; }
  .variant-tab.active { background: #234f66; border-color: #3490bc; color: #fff; }
  .variant-tab.baseline { font-style: italic; }
  .variant-tab.winner { border-color: #c9a227; }
  .variant-tab.winner.active { background: #4a3d10; border-color: #e0b52c; }
  #stage { display: flex; gap: 28px; justify-content: center; align-items: flex-start; padding: 22px 16px 90px; flex-wrap: wrap; }
  .notes { width: 300px; font: 14px/1.5 system-ui, sans-serif; color: var(--color-text); }
  .notes h2 { font-size: 15px; margin: 0 0 6px; }
  .notes h3 { font-size: 13px; margin: 14px 0 6px; letter-spacing: .04em; }
  .notes p { margin: 0 0 10px; color: var(--color-text-muted); }
  .notes .vdesc { border-left: 3px solid var(--color-accent-ink); padding: 6px 10px; background: color-mix(in srgb, var(--color-bg) 70%, transparent); border-radius: 0 6px 6px 0; color: var(--color-text); margin-bottom: 12px; }
  .notes ul { padding-left: 18px; margin: 0 0 10px; color: var(--color-text-muted); }
  .seg { display: inline-flex; border: 1px solid var(--color-border); border-radius: 7px; overflow: hidden; margin: 0 0 8px; }
  .seg button { background: transparent; color: var(--color-text-muted); border: 0; padding: 6px 10px; font: 13px system-ui, sans-serif; cursor: pointer; transition: all .15s ease; }
  .seg button + button { border-left: 1px solid var(--color-border); }
  .seg button:hover { color: var(--color-text); background: color-mix(in srgb, var(--color-text) 8%, transparent); }
  .seg button.on { background: var(--color-primary); color: var(--color-on-primary); }
  .try-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .try-row > span { width: 64px; font-size: 12px; color: var(--color-text-muted); }
  .nudge { display: flex; gap: 6px; margin-top: 4px; }
  .nudge button { background: var(--color-canvas); color: var(--color-text); border: 1px solid var(--color-border); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: 13px system-ui, sans-serif; transition: all .15s ease; }
  .nudge button:hover { border-color: var(--color-accent-ink); }
  .phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .phone-box { position: relative; }
  .phone-box .phone { position: absolute; top: 0; left: 0; transform-origin: top left; }
  @media (max-width: 1000px) { .phone-wrap { order: 0; } .notes { order: 1; } .meter { order: 2; } }
  .phone { position: relative; border-radius: 34px; padding: 11px; background: #050608; box-shadow: 0 22px 50px rgba(0,0,0,.45), inset 0 0 0 2px #2a2e36; }
  .phone-caption { font: 12px system-ui, sans-serif; color: var(--color-text-muted); }
  .meter { width: 260px; font: 13px/1.45 system-ui, sans-serif; color: var(--color-text); }
  .meter h3 { font-size: 13px; margin: 0 0 8px; letter-spacing: .04em; }
  .meter dl { margin: 0 0 12px; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; }
  .meter dt { color: var(--color-text-muted); }
  .meter dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .meter .big { color: var(--color-accent-ink); }
  .meter p { color: var(--color-text-muted); margin: 0 0 8px; }
  #sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font: 12px system-ui, sans-serif; background: rgba(0,0,0,0.82); color: #fff; padding: 6px 8px; border-radius: 8px; opacity: .7; transition: opacity .2s; display: flex; flex-direction: column; gap: 6px; max-width: 340px; }
  #sketch-tools:hover, #sketch-tools.open { opacity: 1; }
  #sketch-tools:not(.open) .row { display: none; }
  #tools-toggle { align-self: flex-end; }
  #sketch-tools .row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  #sketch-tools .row > span { width: 78px; color: #aeb5c0; }
  #sketch-tools button { font: 11px system-ui, sans-serif; background: #22262e; color: #fff; border: 1px solid #3a404b; border-radius: 4px; padding: 3px 6px; cursor: pointer; }
  #sketch-tools button:hover { border-color: #5a6170; }
  #sketch-tools button.on { background: #234f66; border-color: #3490bc; }

  /* real-phone mode: the page IS the phone (open this file on a phone to swipe with your thumb) */
  body.on-phone #stage { padding: 0; display: block; }
  body.on-phone .notes, body.on-phone .meter, body.on-phone .phone-caption { display: none; }
  body.on-phone .phone-box { width: auto !important; height: auto !important; }
  body.on-phone .phone-box .phone { position: static; transform: none !important; padding: 0; border-radius: 0; box-shadow: none; background: none; }
  body.on-phone .screen { border-radius: 0 !important; }
  body.on-phone #variant-nav { padding: 6px 8px; gap: 4px; font-size: 11px; }
  body.on-phone #variant-nav .sketch-id { display: none; }
  body.on-phone .variant-tab { padding: 5px 7px; }
  .notes-btn { display: none; margin-left: auto; }
  body.on-phone .notes-btn { display: inline-block; }
  body.on-phone.show-notes .notes { display: block; position: fixed; left: 0; right: 0; bottom: 0; top: var(--nav-h, 40px); width: auto; overflow-y: auto; z-index: 9997; background: var(--color-bg); padding: 16px 16px 80px; }

  /* ---------- the phone page (the design) ---------- */
  .screen { position: relative; overflow: hidden; border-radius: 24px; background: var(--color-bg); display: flex; flex-direction: column; color: var(--color-text); font-family: var(--font-sans); }
  .topbar { height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 16px; border-bottom: 1px solid var(--color-border); background: var(--color-bg); position: relative; z-index: 25; }
  .wordmark { font-size: 14px; font-weight: 800; letter-spacing: var(--tracking-architectural); color: var(--color-text); white-space: nowrap; }
  .cluster { display: flex; align-items: center; gap: 6px; }
  .save { background: var(--color-primary); color: var(--color-on-primary); border: 0; border-radius: 8px; padding: 0 12px; height: 36px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .tsep { width: 1px; height: 20px; background: var(--color-border); margin: 0 4px; }
  .burger { width: 44px; height: 44px; background: none; border: 0; color: var(--color-text); cursor: pointer; display: grid; place-items: center; }
  .page { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px 16px 32px; position: relative; scrollbar-width: none; }
  .page::-webkit-scrollbar { display: none; }
  h2.sec { font-size: 16px; line-height: 1.2; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
  h2.sec .count { font-size: 12px; font-weight: 600; letter-spacing: 0; color: var(--color-text-muted); text-transform: none; }
  h1.sec { font-size: 20px; line-height: 1.2; font-weight: 800; letter-spacing: var(--tracking-architectural); text-transform: uppercase; margin: 0; }
  .cards { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
  .card { display: flex; flex-direction: column; gap: 8px; border-radius: 14px; border: 1px solid transparent; background: var(--color-canvas); padding: 12px; text-align: left; color: inherit; cursor: pointer; transition: all .15s ease; }
  .card:hover { border-color: var(--color-accent-ink); }
  .frame-outer { border-radius: 10px; border: 1px solid var(--color-line); background: var(--color-tab-active); padding: 12px; }
  .frame-inner { border-radius: 10px; border: 1px solid var(--color-border); background: var(--color-surface); overflow: hidden; }
  .frame-inner svg { display: block; width: 100%; height: 100%; }
  .tag { font-size: 12px; line-height: 1.4; font-weight: 700; letter-spacing: var(--tracking-architectural); color: var(--color-text-muted); text-transform: uppercase; }
  .name { font-size: 20px; line-height: 1.2; font-weight: 600; color: var(--color-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dims { font-size: 12px; line-height: 1.4; font-weight: 600; color: var(--color-text-muted); }
  .touched { font-size: 12px; line-height: 1.4; color: var(--color-text-muted); }
  .desc { font-size: 14px; line-height: 1.4; color: var(--color-text-muted); }
  .cta { font-size: 12px; line-height: 1.4; font-weight: 600; letter-spacing: var(--tracking-architectural); color: var(--color-accent-ink); text-transform: uppercase; }
  .card-wrap { position: relative; }
  .card-more { position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px; border-radius: 8px; background: none; border: 0; color: var(--color-text-muted); cursor: pointer; display: grid; place-items: center; }

  /* the rack */
  .rack { position: relative; margin: 12px -16px 0; }
  .rack-scroller { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; cursor: grab; }
  .rack-scroller.dragging { cursor: grabbing; }
  .rack-scroller::-webkit-scrollbar { display: none; }
  .rack-track { position: relative; }
  .snap { position: absolute; top: 0; bottom: 0; scroll-snap-align: center; pointer-events: none; }
  .rack-svg { display: block; position: relative; overflow: visible; }
  .rack-svg .hit { fill: transparent; cursor: pointer; }
  .rack-labels { position: absolute; left: 0; top: 0; bottom: 0; width: 28px; pointer-events: none; }
  .rack-labels span { position: absolute; left: 6px; transform: translateY(-50%); font-size: 10px; line-height: 1; font-weight: 600; color: var(--color-text-muted); background: var(--color-bg); padding: 1px 2px; border-radius: 3px; }
  .rack-mark { position: absolute; left: 50%; bottom: -9px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 7px solid var(--color-accent-ink); transform: translateX(-50%); pointer-events: none; }
  .spine { font-size: 11px; font-family: var(--font-sans); }
  .spine .nm { font-weight: 600; fill: var(--color-text); }
  .spine .dm { fill: var(--color-text-muted); font-weight: 500; }

  /* caption under the turned board */
  .cap { position: relative; margin-top: 14px; min-height: 104px; transition: opacity .15s ease; }
  .cap.dim { opacity: .45; }
  .cap .name { padding-right: 48px; }
  .cap .lines { display: flex; flex-direction: column; gap: 2px; }
  .cap .tag { margin-bottom: 2px; }
  .cap .open { margin-top: 6px; background: none; border: 0; padding: 8px 0; text-align: left; cursor: pointer; }
  .cap .open:hover { text-decoration: underline; text-underline-offset: 3px; }
  .more { position: absolute; top: -10px; right: -10px; width: 44px; height: 44px; border-radius: 8px; background: none; border: 0; color: var(--color-text-muted); cursor: pointer; display: grid; place-items: center; transition: all .15s ease; }
  .more:hover { background: color-mix(in srgb, var(--color-text) 8%, transparent); color: var(--color-text); }
  .menu { position: absolute; right: 0; top: 34px; z-index: 30; min-width: 170px; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 4px; display: none; }
  .menu.open { display: block; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--color-text); font-size: 14px; padding: 10px 12px; border-radius: 6px; cursor: pointer; }
  .menu button:hover { background: color-mix(in srgb, var(--color-text) 8%, transparent); }
  .menu button.danger { color: var(--color-warning-ink); }
  h1.sec.after-rack { margin-top: 32px; }

  /* C: the held-up board */
  .held { display: flex; gap: 14px; align-items: stretch; margin-top: 12px; }
  .held-art { flex: none; width: 116px; border-radius: 10px; background: var(--color-canvas); display: grid; place-items: center; cursor: pointer; }
  .held .cap { flex: 1; min-width: 0; margin-top: 4px; }
  .held .cap .name { white-space: normal; }

  .toast { position: absolute; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: var(--color-text); color: var(--color-bg); font-size: 13px; font-weight: 500; padding: 9px 14px; border-radius: 999px; opacity: 0; pointer-events: none; transition: all .2s ease; white-space: nowrap; z-index: 40; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

<main id="stage">
  <section class="notes" id="notes"></section>
  <div class="phone-wrap">
    <div class="phone-box" id="phone-box"><div class="phone" id="phone"><div class="screen" id="screen"></div></div></div>
    <div class="phone-caption" id="phone-caption"></div>
  </div>
  <aside class="meter" id="meter"></aside>
</main>

</div>

/* ---------------- board drawing: the real turn ---------------- */
/* A board standing on its tail, rail facing you. Turning it by θ about its long axis, each station's
   cross-section (taken as an ellipse: the board's half-width by half its thickness) projects onto the
   screen as  x = t·cosθ − w·sinθ ; at θ = 0 that is exactly the side profile (rocker up to deck), at
   θ = 90° exactly the outline. Every number comes from the board's own rocker, deck and half-width. */
function prep(b, s) {
  let maxDeck = 0, maxHalf = 0;
  for (let i = 0; i < b.deck.length; i++) { if (b.deck[i] > maxDeck) maxDeck = b.deck[i]; if (b.half[i] > maxHalf) maxHalf = b.half[i]; }
  return { b, s, n: b.stations.length, tMid: maxDeck / 2, sideW: maxDeck * s, outW: 2 * maxHalf * s, h: b.lengthMm * s };
}
function turnPath(P, theta, cx, floorY) {
  const { b, s, n, tMid } = P, c = Math.cos(theta), sn = Math.sin(theta);
  let left = "";
  const right = [];
  for (let i = 0; i < n; i++) {
    const r = b.rocker[i], d = b.deck[i], h = b.half[i];
    const xc = ((r + d) / 2 - tMid) * c;
    const ext = Math.sqrt(((d - r) / 2) ** 2 * c * c + h * h * sn * sn);
    const y = (floorY - b.stations[i] * s).toFixed(2);
    left += (i ? "L" : "M") + (cx + (xc - ext) * s).toFixed(2) + " " + y;
    right.push((cx + (xc + ext) * s).toFixed(2) + " " + y);
  }
  return left + "L" + right.reverse().join("L") + "Z";
}
/* The exact TEMPLATE silhouette (with a swallow's notch), used once the turn is complete. */
function outlinePath(b, s, cx, floorY) {
  const pts = b.outline;
  let p = "";
  pts.forEach(([st, w], i) => { p += (i ? "L" : "M") + (cx + w * s).toFixed(2) + " " + (floorY - st * s).toFixed(2); });
  for (let i = pts.length - 1; i >= 0; i--) p += "L" + (cx - pts[i][1] * s).toFixed(2) + " " + (floorY - pts[i][0] * s).toFixed(2);
  return p + "L" + cx.toFixed(2) + " " + (floorY - b.closeStation * s).toFixed(2) + "Z";
}
function boardPath(P, theta, cx, floorY) { return theta > 1.5620 ? outlinePath(P.b, P.s, cx, floorY) : turnPath(P, theta, cx, floorY); }
function stringerPath(P, theta, cx, floorY) {
  const { b, s, n, tMid } = P, c = Math.cos(theta);
  let p = "";
  for (let i = 0; i < n; i++) p += (i ? "L" : "M") + (cx + (b.deck[i] - tMid) * c * s).toFixed(2) + " " + (floorY - b.stations[i] * s).toFixed(2);
  return p;
}
function halfExtent(P, theta) { return Math.sqrt((P.sideW / 2 * Math.cos(theta)) ** 2 + (P.outW / 2 * Math.sin(theta)) ** 2); }
const ease = (f) => (f < 0.5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2);
const smooth = (f) => f * f * (3 - 2 * f);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    const trackW = this.padL * 2 + n * P;
    const look = this.o.look, shop = SHOP[state.theme];
    let defs = `<defs><linearGradient id="foam" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="${shop.foamEdge}"/><stop offset=".22" stop-color="${shop.foamShade}"/><stop offset=".5" stop-color="${shop.foam}"/><stop offset=".78" stop-color="${shop.foamShade}"/><stop offset="1" stop-color="${shop.foamEdge}"/></linearGradient>
      <linearGradient id="rail" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${shop.railTop}"/><stop offset=".35" stop-color="${shop.rail}"/><stop offset="1" stop-color="${shop.railLow}"/></linearGradient>
      <filter id="lift" x="-50%" y="-10%" width="200%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="${shop.shadow}"/></filter></defs>`;
    let back = "", front = "";
    if (look === "drawing") {
      if (state.lines === "on") {
        for (const mk of this.heightMarks()) back += `<line x1="0" x2="${trackW}" y1="${mk.y}" y2="${mk.y}" stroke="var(--color-border)" stroke-dasharray="5 4" stroke-width="1"/>`;
      }
      back += `<line x1="0" x2="${trackW}" y1="${this.floorY + 0.5}" y2="${this.floorY + 0.5}" stroke="var(--color-line)" stroke-width="1"/>`;
    } else {
      back += `<rect x="0" y="0" width="${trackW}" height="${H}" fill="${shop.wall}"/>`;
      const barY = this.floorY - this.o.boardsH * 0.5;
      back += `<rect x="0" y="${barY - 3}" width="${trackW}" height="6" rx="2" fill="${shop.bar}" opacity=".8"/>`;
      for (let i = 0; i < n; i++) back += `<ellipse cx="${this.cxOf(i)}" cy="${this.floorY - 1}" rx="${(this.preps[i].sideW / 2 + 5).toFixed(1)}" ry="3" fill="${shop.shadow}" opacity=".7"/>`;
      front += `<rect x="0" y="${this.floorY - 4}" width="${trackW}" height="${this.floorPad + 4}" rx="3" fill="url(#rail)"/>`;
    }
    let boardsSvg = "";
    this.list.forEach((b, i) => {
      const fill = look === "shop" ? "url(#foam)" : "var(--color-board)";
      const stroke = look === "shop" ? shop.stroke : "var(--color-text)";
      const strCol = look === "shop" ? shop.stringer : "var(--color-line)";
      const dash = look === "shop" ? "" : `stroke-dasharray="16 4 4 4"`;
      boardsSvg += `<g class="bd" data-i="${i}"><g class="lift"><path class="body" fill="${fill}" stroke="${stroke}" stroke-width="${look === "shop" ? 0.8 : 1.1}" stroke-linejoin="round"/><path class="str" fill="none" stroke="${strCol}" stroke-width="${look === "shop" ? 1 : 0.8}" ${dash}/></g><text class="spine"></text></g>`;
    });
    let hits = "";
    for (let i = 0; i < n; i++) hits += `<rect class="hit" data-i="${i}" y="0" height="${H}"/>`;
    let snaps = "";
    for (let i = 0; i < n; i++) snaps += `<div class="snap" style="left:${this.padL + i * P}px;width:${P}px"></div>`;
    const marks = this.heightMarks();
    const gap = marks.length > 1 ? Math.abs(marks[0].y - marks[1].y) : 99;
    const labels = look === "drawing" && state.lines === "on" ? marks.filter((m, k) => gap >= 22 || k % 2 === 0).map((m) => `<span style="top:${m.y}px">${m.label}</span>`).join("") : "";
    this.host.innerHTML = `<div class="rack-scroller" tabindex="0" aria-label="Board rack. Swipe to look along it."><div class="rack-track" style="width:${trackW}px;height:${H}px">${snaps}<svg class="rack-svg" width="${trackW}" height="${H}" viewBox="0 0 ${trackW} ${H}">${defs}${back}<g class="boards">${boardsSvg}</g>${front}${hits}</svg></div></div><div class="rack-labels">${labels}</div>${this.o.mark ? `<div class="rack-mark"></div>` : ""}`;
    this.scroller = this.host.querySelector(".rack-scroller");
    this.svg = this.host.querySelector(".rack-svg");
    this.groups = [...this.host.querySelectorAll("g.bd")];
    this.boardsLayer = this.host.querySelector("g.boards");
    this.hits = [...this.host.querySelectorAll("rect.hit")];
    this.groups.forEach((g, i) => { g._body = g.querySelector(".body"); g._str = g.querySelector(".str"); g._lift = g.querySelector(".lift"); g._spine = g.querySelector(".spine"); g._dot = g.querySelector(".unsaved"); this.fillSpine(i); });
    this.wire();
    this.update(performance.now(), true);
  }
  heightMarks() {
    const out = [];
    const maxMm = (this.floorY - this.top) / this.s;
    if (state.units === "metric") { for (let cm = 50; cm * 10 <= maxMm + 1; cm += 50) if (cm >= 150) out.push({ y: this.floorY - cm * 10 * this.s, label: cm + "" }); }
    else { for (let ft = 4; ft * 304.8 <= maxMm + 1; ft++) out.push({ y: this.floorY - ft * 304.8 * this.s, label: ft + "′" }); }
    return out;
  }
  fillSpine(i) {
    const b = this.list[i], t = this.groups[i]._spine;
    const short = this.o.spine === "short";
    const second = short ? lengthOf(b) : lineOf(b);
    t.innerHTML = `<tspan class="nm">${esc(b.name)}</tspan><tspan class="dm" dx="6">${esc(second)}</tspan>`;
    t.style.fontSize = (this.o.spineSize || 11) + "px";
    const room = this.o.boardsH - 4;
    try { if (t.getComputedTextLength() > room) t.style.fontSize = ((this.o.spineSize || 11) * room / t.getComputedTextLength()).toFixed(2) + "px"; } catch (e) {}
  }
  wire() {
    const sc = this.scroller;
    sc.addEventListener("scroll", () => { this.scrolling = true; this.lastScroll = performance.now(); this.kick(); }, { passive: true });
    let drag = null;
    sc.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "mouse" || e.button !== 0) return;
      drag = { x: e.clientX, left: sc.scrollLeft, moved: false, id: e.pointerId };
      sc.style.scrollSnapType = "none"; sc.classList.add("dragging");
    });
    window.addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = (e.clientX - drag.x) / phoneScale;
      if (Math.abs(dx) > 3) drag.moved = true;
      sc.scrollLeft = drag.left - dx;
    });
    window.addEventListener("pointerup", (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const moved = drag.moved; drag = null; sc.classList.remove("dragging");
      if (moved) { this.suppressClick = true; setTimeout(() => (this.suppressClick = false), 50); }
      this.goTo(this.nearest(), true);
      setTimeout(() => { sc.style.scrollSnapType = ""; }, 450);
    });
    this.svg.addEventListener("click", (e) => {
      if (this.suppressClick) return;
      const hit = e.target.closest("rect.hit"); if (!hit) return;
      const i = +hit.dataset.i;
      if (i === this.nearest() && Math.abs(this.dist(i)) < this.P * 0.3) openBoard(this.list[i]);
      else this.goTo(i, true);
    });
    sc.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") { this.goTo(Math.min(this.n - 1, this.nearest() + 1), true); e.preventDefault(); }
      if (e.key === "ArrowLeft") { this.goTo(Math.max(0, this.nearest() - 1), true); e.preventDefault(); }
      if (e.key === "Enter") openBoard(this.list[this.nearest()]);
    });
  }
  goTo(i, smoothly) { this.scroller.scrollTo({ left: i * this.P, behavior: smoothly ? "smooth" : "auto" }); }
  nearest() { return clamp(Math.round(this.scroller.scrollLeft / this.P), 0, this.n - 1); }
  dist(i) { return this.cxOf(i) - (this.scroller.scrollLeft + this.W / 2); }
  kick() { if (!this.raf) this.raf = requestAnimationFrame((t) => { this.raf = 0; this.update(t); }); }
  update(now, force) {
    const dt = this.lastT ? Math.min(64, now - this.lastT) : 16; this.lastT = now;
    const mode = this.o.mode, n = this.n;
    if (this.scrolling && now - this.lastScroll > 140) { this.scrolling = false; }
    const near = this.nearest();
    let busy = this.scrolling;
    if (mode === "follow") {
      for (let i = 0; i < n; i++) this.f[i] = smooth(clamp(1 - Math.abs(this.dist(i)) / this.P, 0, 1));
    } else if (mode === "snap") {
      for (let i = 0; i < n; i++) {
        let tgt = 0;
        if (i === near && Math.abs(this.dist(i)) < this.P * 0.2 && (!this.scrolling || this.tgt[i] === 1)) tgt = 1;
        if (!this.scrolling && i === near) tgt = 1;
        this.tgt[i] = tgt;
        if (this.f[i] !== tgt) { this.f[i] = tgt > this.f[i] ? Math.min(tgt, this.f[i] + dt / this.dur) : Math.max(tgt, this.f[i] - dt / (this.dur * 0.6)); busy = true; }
      }
    } else { this.f.fill(0); }
    // How far each board moves aside so the turned board has room (Drawing look: the rack opens).
    const ext = this.f.map((f, i) => (this.o.look === "drawing" && mode !== "held" ? Math.max(0, this.preps[i].outW + 18 - this.P) * (mode === "follow" ? f : ease(f)) : 0));
    const total = ext.reduce((a, v) => a + v, 0);
    let before = 0;
    for (let i = 0; i < n; i++) {
      const shift = before / 2 - (total - before - ext[i]) / 2;
      before += ext[i];
      const g = this.groups[i];
      const fe = mode === "follow" ? this.f[i] : ease(this.f[i]);
      if (force || Math.abs(shift - this.lastShift[i]) > 0.05) { g.setAttribute("transform", `translate(${shift.toFixed(2)} 0)`); this.lastShift[i] = shift; }
      if (force || Math.abs(fe - this.lastF[i]) > 0.0005) {
        this.lastF[i] = fe;
        const P = this.preps[i], theta = fe * Math.PI / 2, cx = this.cxOf(i);
        g._body.setAttribute("d", boardPath(P, theta, cx, this.floorY));
        g._str.setAttribute("d", stringerPath(P, theta, cx, this.floorY));
        g._str.setAttribute("opacity", (Math.sin(theta) * (this.o.look === "shop" ? 0.9 : 0.8)).toFixed(3));
        const he = halfExtent(P, theta);
        const sx = cx - he - 3.5;
        if (state.spine === "up") g._spine.setAttribute("transform", `translate(${sx.toFixed(2)} ${this.floorY - 3}) rotate(-90)`);
        else g._spine.setAttribute("transform", `translate(${(sx - 8.5).toFixed(2)} ${this.top + 2}) rotate(90)`);
        g._spine.setAttribute("opacity", (1 - fe).toFixed(3));
        if (g._dot) { g._dot.setAttribute("cx", (cx + he + 5).toFixed(2)); g._dot.setAttribute("cy", (this.floorY - 6).toFixed(2)); }
        if (this.o.look === "shop") {
          const lift = fe;
          g._lift.setAttribute("transform", `translate(${cx} ${this.floorY - 9 * lift}) scale(${1 + 0.1 * lift}) translate(${-cx} ${-this.floorY})`);
          if (lift > 0.02) { g._lift.setAttribute("filter", "url(#lift)"); if (this.boardsLayer.lastElementChild !== g) this.boardsLayer.appendChild(g); }
          else g._lift.removeAttribute("filter");
        }
        if (mode === "held") {
          const sel = i === near;
          g._body.setAttribute("stroke", sel ? "var(--color-accent-ink)" : this.o.look === "shop" ? SHOP[state.theme].stroke : "var(--color-text)");
          g._body.setAttribute("stroke-width", sel ? "1.8" : this.o.look === "shop" ? "0.8" : "1.1");
        }
      }
    }
    if (mode === "held") {
      if (this._lastSel !== near) { this._lastSel = near; this.lastF.fill(-1); this.update(now, false); return; }
    }
    // hit areas follow the boards
    let prevEdge = 0;
    for (let i = 0; i < n; i++) {
      const cx = this.cxOf(i) + this.lastShift[i];
      const nx = i < n - 1 ? this.cxOf(i + 1) + this.lastShift[i + 1] : cx + this.P;
      const right = (cx + nx) / 2;
      const left = i === 0 ? cx - this.P / 2 - this.padL : prevEdge;
      this.hits[i].setAttribute("x", left.toFixed(1)); this.hits[i].setAttribute("width", Math.max(1, right - left).toFixed(1));
      prevEdge = right;
    }
    if (this.o.onChange) this.o.onChange(near, this.scrolling && mode === "snap");
    if (busy || this.scrolling) this.kick();
    else this.lastT = 0;
  }
  visibleCount() {
    let k = 0;
    for (let i = 0; i < this.n; i++) { const x = this.cxOf(i) + (this.lastShift[i] || 0) - this.scroller.scrollLeft; if (x > 6 && x < this.W - 6) k++; }
    return k;
  }
}

/* ---------------- C: the held-up board ---------------- */
class Held {
  constructor(host, list) { this.host = host; this.list = list; this.shown = 0; this.want = 0; this.f = 0; this.raf = 0; this.lastT = 0; this.cache = {}; }
  set(i) { if (i !== this.want) { this.want = i; this.kick(); } }
  kick() { if (!this.raf) this.raf = requestAnimationFrame((t) => { this.raf = 0; this.step(t); }); }
  step(now) {
    const dt = this.lastT ? Math.min(64, now - this.lastT) : 16; this.lastT = now;
    const dur = state.speed === "slow" ? 2600 : 520;
    if (this.want !== this.shown) { this.f = Math.max(0, this.f - dt / (dur * 0.45)); if (this.f === 0) this.shown = this.want; }
    else if (this.f < 1) this.f = Math.min(1, this.f + dt / dur);
    this.draw();
    if (this.f < 1 || this.want !== this.shown) this.kick(); else this.lastT = 0;
  }
  draw() {
    const art = this.host.querySelector(".held-art svg");
    if (!art) return;
    const b = this.list[this.shown];
    const H = art.viewBox.baseVal.height, Wd = art.viewBox.baseVal.width;
    const key = this.shown;
    const P = this.cache[key] || (this.cache[key] = prep(b, (H - 20) / b.lengthMm));
    const fe = ease(this.f), theta = fe * Math.PI / 2, floorY = H - 10, cx = Wd / 2;
    const shop = state.look === "shop";
    const body = art.querySelector(".body"), str = art.querySelector(".str");
    body.setAttribute("d", boardPath(P, theta, cx, floorY));
    str.setAttribute("d", stringerPath(P, theta, cx, floorY));
    str.setAttribute("opacity", (Math.sin(theta) * 0.85).toFixed(3));
    body.setAttribute("fill", shop ? "url(#foamH)" : "var(--color-board)");
    body.setAttribute("stroke", shop ? SHOP[state.theme].stroke : "var(--color-text)");
    str.setAttribute("stroke", shop ? SHOP[state.theme].stringer : "var(--color-line)");
    if (shop) str.removeAttribute("stroke-dasharray"); else str.setAttribute("stroke-dasharray", "16 4 4 4");
  }
}

/* ---------------- the caption under (or beside) the turned board ---------------- */
function captionHtml(b, i) {
  if (!b) return "";
  const tag = b.inProgress ? `<span class="tag">In progress — not saved</span>` : "";
  const touched = b.inProgress ? "" : `<span class="touched">Last touched ${touchedOf(b)}</span>`;
  const more = b.inProgress ? "" : `<button class="more" data-more="${i}" aria-label="More actions for ${esc(b.name)}">${DOTS}</button><div class="menu" data-menu="${i}"><button data-toast="Rename… (as today)">Rename…</button><button data-toast="Duplicated ${esc(b.name)} (as today)">Duplicate</button><button class="danger" data-toast="Delete… asks first (as today)">Delete…</button></div>`;
  return `<div class="lines">${tag}<span class="name">${esc(b.name)}</span><span class="dims">${esc(lineOf(b))}</span>${touched}</div><button class="open cta" data-open="${i}">${b.inProgress ? "Continue This Board" : "Open This Board"}</button>${more}`;
}

let currentList = [];
function wireScreen(screen) {

    screen.querySelectorAll(".menu.open").forEach((m) => { if (!m.contains(e.target)) m.classList.remove("open"); });

    const o = e.target.closest("[data-open]"); if (o) { openBoard(list[+o.dataset.open]); return; }

}
function openBoard(b) { toast(b.inProgress ? `Would continue ${b.name} on TEMPLATE` : `Would open ${b.name} on TEMPLATE`); }
let toastTimer = 0;
function toast(msg) { const t = document.getElementById("toast"); if (!t) return; t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600); }

function fitPhone() {

    <div class="try-row"><span>Boards</span>${seg("count", [[1, "1"], [4, "4"], [15, "15"], [30, "30"]], state.count)}</div>
    <div class="try-row"><span>Units</span>${seg("units", [["imperial", "Imperial"], ["metric", "Metric"]], state.units)}</div>
    ${rackOn ? `<div class="try-row"><span>Swipe</span><div class="nudge"><button type="button" data-nudge="-1">← one board</button><button type="button" data-nudge="1">one board →</button></div></div><p style="margin-top:8px">With a mouse, drag the rack sideways. A trackpad swipes it natively. On a real phone, open this page and use your thumb.</p>` : ""}
    <p style="margin-top:10px">Every rocker, outline and litres figure here was worked out by the app's own calculators, each board in the nearest blank that fits.</p>`;
}
function renderMeter() {
  const el = document.getElementById("meter");
  const list = boards();
  const page = document.getElementById("page"), h1 = document.getElementById("shape-new");
  if (!page || !h1) return;
  const pageH = page.clientHeight;
  const reach = Math.max(0, Math.round(h1.offsetTop + h1.offsetHeight - pageH + 8));
  let seen;
  if (state.variant === "today") {
    const top = page.getBoundingClientRect().top;
    const cards = [...page.querySelectorAll("#yours .card")];
    seen = cards.filter((c) => (c.getBoundingClientRect().top - top) / phoneScale + 120 < pageH).length;
  } else seen = rack ? rack.visibleCount() : 0;
  const across = rack && state.variant !== "today" ? Math.min(list.length, Math.floor((rack.W - Math.max(0, Math.max(...rack.preps.map((p) => p.outW)) + 18 - rack.P)) / rack.P) + 1) : 0;
  el.innerHTML = `<h3>ON THE FIRST SCREEN</h3>
    <dl><dt>Boards you can see</dt><dd class="big">${Math.min(seen, list.length)} of ${list.length}</dd>
    ${across ? `<dt>Across the screen mid-rack</dt><dd>${across}</dd>` : ""}
    <dt>Scroll to reach Shape a New Board</dt><dd>${reach === 0 ? "none" : reach.toLocaleString() + " dots"}</dd></dl>
    <p>${state.variant === "today" ? "Today every board is a full-width card, about 474 dots tall with its gap." : "The rest of the boards are one swipe away. The page itself doesn't get longer as the quiver grows."}</p>
    <p>Measured live on the sketched ${PHONES[state.phone].label.split(" · ")[0]} page.</p>`;
}
function renderNav() {
  const nav = document.getElementById("variant-nav");
  const small = document.body.classList.contains("on-phone");
  nav.innerHTML = `<span class="sketch-id">Sketch 009</span>` + VARIANTS.map((v) => `<button class="variant-tab${v.baseline ? " baseline" : ""}${v.winner ? " winner" : ""}${v.id === state.variant ? " active" : ""}" data-variant="${v.id}">${esc(small ? v.short : v.label)}</button>`).join("") + `<button class="variant-tab notes-btn" data-notes="1">${document.body.classList.contains("show-notes") ? "Close notes" : "Notes"}</button>`;
  document.documentElement.style.setProperty("--nav-h", nav.offsetHeight + "px");
}
function renderTools() {
  const mk = (id, name, opts) => { document.getElementById(id).innerHTML = opts.map(([v, l]) => `<button type="button" data-tool="${name}" data-v="${v}" class="${String(state[name]) === String(v) ? "on" : ""}">${l}</button>`).join(" "); };
  mk("t-theme", "theme", [["slate", "Dark (slate)"], ["daylight", "Light (daylight)"]]);
  mk("t-phone", "phone", [["iphone14", "iPhone 14"], ["android", "Small Android"], ["pixel7", "Pixel 7"]]);
  mk("t-speed", "speed", [["normal", "Normal"], ["slow", "Slow motion"]]);
  mk("t-spine", "spine", [["up", "Up (tail → nose)"], ["down", "Down"]]);
  mk("t-lines", "lines", [["on", "On"], ["off", "Off"]]);
}
function applyTheme() {
  const root = document.documentElement.style;
  for (const [k, v] of Object.entries({ ...COMMON_VARS, ...PALETTES[state.theme] })) root.setProperty(k, v);
  const link = document.getElementById("theme-link"); if (link) link.href = `../themes/app-${state.theme}.css`;
}
function renderAll() { applyTheme(); renderNav(); renderNotes(); renderTools(); buildScreen(); }

document.getElementById("variant-nav").addEventListener("click", (e) => {
  if (e.target.closest("[data-notes]")) { document.body.classList.toggle("show-notes"); renderNav(); return; }
  const b = e.target.closest("[data-variant]"); if (!b) return; state.variant = b.dataset.variant; document.body.classList.remove("show-notes"); save(); renderAll();
});
document.getElementById("notes").addEventListener("click", (e) => {
  const b = e.target.closest(".seg button"); if (b) { const k = b.parentElement.dataset.seg; state[k] = k === "count" ? +b.dataset.v : b.dataset.v; save(); renderAll(); return; }
  const n = e.target.closest("[data-nudge]"); if (n && rack) rack.goTo(clamp(rack.nearest() + +n.dataset.nudge, 0, rack.n - 1), true);
});
document.getElementById("sketch-tools").addEventListener("click", (e) => { const b = e.target.closest("[data-tool]"); if (!b) return; state[b.dataset.tool] = b.dataset.v; save(); renderAll(); });
document.getElementById("tools-toggle").onclick = () => document.getElementById("sketch-tools").classList.toggle("open");
let meterTimer = 0;
document.getElementById("stage").addEventListener("scroll", () => {}, true);
document.addEventListener("scroll", () => { clearTimeout(meterTimer); meterTimer = setTimeout(renderMeter, 200); }, true);
window.addEventListener("resize", () => { const was = document.body.classList.contains("on-phone"); setPhoneMode(); if (was !== document.body.classList.contains("on-phone")) { renderNav(); buildScreen(); } else fitPhone(); });
function setPhoneMode() { document.body.classList.toggle("on-phone", window.matchMedia("(max-width: 520px)").matches); }
setPhoneMode();
renderAll();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (rack) rack.list.forEach((_, i) => rack.fillSpine(i)); renderMeter(); });
</script>
</body>
</html>
