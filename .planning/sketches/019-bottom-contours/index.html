<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketch 019 — Bottom contours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== the app's four palettes, copied from app/globals.css (--ramp-*) on 2026-11-06 ===== */
.theme-daylight { --ground:#ffffff; --sidebar:#ffffff; --canvas:#dfdcd3; --tab-active:#ffffff; --panel:#ffffff; --well:#dfdcd3;
  --ink:#1f2a3b; --muted:#566171; --line:#897c58; --faint:#897c58; --accent:#8ec1b8; --on-accent:#1f2a3b; --accent-ink:#48605c; --fill:#d9f2ed; color-scheme:light; }
.theme-chalk { --ground:#ffffff; --sidebar:#ffffff; --canvas:#dfdcd3; --tab-active:#ffffff; --panel:#ffffff; --well:#dfdcd3;
  --ink:#1f2a3b; --muted:#566171; --line:#897c58; --faint:#897c58; --accent:#3490bc; --on-accent:#090e16; --accent-ink:#2b424c; --fill:#d8ebf2; color-scheme:light; }
.theme-slate { --ground:#12141a; --sidebar:#12141a; --canvas:#1a1d25; --tab-active:#12141a; --panel:#12141a; --well:#1b1f26;
  --ink:#f2f4f7; --muted:#a1a8b4; --line:#6a707c; --faint:#333842; --accent:#18526d; --on-accent:#f2f4f7; --accent-ink:#3490bc; --fill:#1a2732; color-scheme:dark; }
.theme-phosphor { --ground:#050805; --sidebar:#050805; --canvas:#142414; --tab-active:#050805; --panel:#050805; --well:#050805;
  --ink:#26d026; --muted:#2ca62c; --line:#3e783e; --faint:#3e783e; --accent:#2ca62c; --on-accent:#050805; --accent-ink:#52ab52; --fill:#142414; color-scheme:dark; }
/* derived, as app/globals.css derives them: faint construction ink, the widepoint's line, the foam shade */
#app { --station: color-mix(in srgb, var(--muted) 36%, transparent); --widepoint: color-mix(in srgb, var(--accent-ink) 45%, transparent);
  --pencil: color-mix(in srgb, var(--muted) 78%, transparent); --ghost: color-mix(in srgb, var(--muted) 60%, transparent); }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: #c9c5ba; font-family: Inter, Roboto, system-ui, sans-serif; }

/* ---- sketch chrome (not part of the design) ---- */
#bar { flex: none; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 16px;
  padding-top: max(8px, env(safe-area-inset-top)); background: #0d0f14; color: #cfd5de; font: 13px/1.2 system-ui, sans-serif; border-bottom: 1px solid #262a33; }
#bar b { color: #fff; margin-right: 4px; }
.grp { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.grp > span { color: #8a93a3; margin-right: 2px; }
#bar button { font: inherit; color: #cfd5de; background: #1b1f28; border: 1px solid #333a47; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
#bar button.on { background: #3490bc; border-color: #3490bc; color: #fff; }
#note { flex: none; font: 12.5px/1.45 system-ui, sans-serif; color: #cfd5de; background: #15181f; padding: 6px 16px; border-bottom: 1px solid #262a33; }
#note b { color: #fff; }
#stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: stretch; }
#stage.framed { align-items: flex-start; padding: 16px; overflow: auto; }
#stage.framed #app { width: 390px; height: 760px; flex: none; border: 10px solid #1a1c22; border-radius: 28px; overflow: hidden; }

/* ===== the page ===== */
#app { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--ground); color: var(--ink);
  font-family: Inter, Roboto, system-ui, sans-serif; font-size: 14px; line-height: 1.4; }
.caps { font-weight: 800; text-transform: uppercase; letter-spacing: .15em; }

/* the computer's top row */
.nav { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 40px; padding: 24px; border-bottom: 1px solid var(--faint); background: var(--ground); }
.nav .mark { width: 10.96rem; min-width: 6.26rem; color: var(--ink); }
.nav .mark svg { display: block; width: 100%; height: auto; }
.nav .links { display: flex; align-items: center; gap: 16px; }
.nav .links a { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; color: var(--muted); text-decoration: none; padding-bottom: 2px; border-bottom: 2px solid transparent; white-space: nowrap; }
.nav .links a.on { color: var(--ink); border-bottom-color: var(--accent); }
.nav .links .sep { width: 1px; height: 16px; background: var(--faint); margin: 0 4px; }
.pill { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 9999px; padding: 5px 14px; cursor: pointer; }
.iconbtn { width: 28px; height: 28px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); display: inline-grid; place-items: center; cursor: pointer; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--well); border: 1px solid var(--line); }

/* the phone's compact bar */
.topbar { display: none; flex: none; height: 48px; align-items: center; justify-content: space-between; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); border-bottom: 1px solid var(--faint); background: var(--ground); }
.topbar .mark { width: 120px; color: var(--ink); }
.topbar .mark svg { display: block; width: 100%; height: auto; }
.topbar .right { display: flex; align-items: center; gap: 12px; }
.topbar .sep { width: 1px; height: 16px; background: var(--faint); }
.hamb { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--ink); cursor: pointer; margin-right: -12px; }

.shell { flex: 1; min-height: 0; display: flex; }
.side { width: 340px; flex: none; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--faint); background: var(--sidebar); }
.side .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 40px; }
.main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--canvas); padding: 12px; }

/* ---- the sidebar's dress (RAILS' own) ---- */
.title { font-size: 18px; line-height: 1.2; font-weight: 800; text-transform: uppercase; letter-spacing: .15em; color: var(--ink); }
.sub { margin-top: 2px; font-size: 14px; color: var(--muted); }
.ruled { margin-top: 22px; padding-bottom: 8px; border-bottom: 1px solid var(--faint); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .15em; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ruled .cutname { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 12px; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group { display: flex; flex-direction: column; gap: 14px; padding-top: 12px; }
.lbl { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.hints { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 2px; }
.flatnote { font-size: 13px; color: var(--muted); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; min-height: 24px; }
.check input { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 0; border-radius: 4px; border: 1px solid var(--line); display: inline-grid; place-items: center; cursor: pointer; background: transparent; flex: none; }
.check input:checked { background: var(--accent); border-color: var(--accent); }
.check input:checked::after { content: ""; width: 8px; height: 4px; border-left: 2px solid var(--on-accent); border-bottom: 2px solid var(--on-accent); transform: translateY(-1px) rotate(-45deg); }
.selwrap { position: relative; }
.selwrap select { font: inherit; font-size: 14px; width: 100%; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 32px 8px 10px; appearance: none; -webkit-appearance: none; cursor: pointer; }
.selwrap::after { content: ""; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.selwrap select:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }

/* the app's slider: accent fill, ink-ringed 6px track, accent dot with an ink ring */
input.rng { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; border: 1px solid var(--ink); margin: 6px 0; display: block;
  background: linear-gradient(to right, var(--accent) 0 var(--p, 50%), transparent var(--p, 50%) 100%); cursor: pointer; }
input.rng.fill-end { background: linear-gradient(to right, transparent 0 var(--p, 50%), var(--accent) var(--p, 50%) 100%); }
input.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 1px solid var(--ink); }
input.rng::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 1px solid var(--ink); }
input.rng:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; }
@media (pointer: coarse) { input.rng::-webkit-slider-thumb { width: 22px; height: 22px; } input.rng { margin: 11px 0; } }

/* the imported-dimensions card (sketch 017 C) and the readout figures it set the style for */
.rcard { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 11px; }
.rcard .cap { font-size: 10px; line-height: 1.2; font-weight: 800; text-transform: uppercase; letter-spacing: .15em; color: var(--accent-ink); }
.figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 10px; margin-top: 8px; }
.fig { display: flex; flex-direction: column-reverse; justify-content: flex-end; min-width: 0; }
.fig dt { margin-top: 2px; font-size: 10px; line-height: 1.2; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.fig dd { margin: 0; font-size: 18px; line-height: 1.15; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
.rcard .footline { margin-top: 8px; border-top: 1px solid var(--faint); padding-top: 7px; font-size: 12px; color: var(--muted); }

.stepnav { display: flex; gap: 8px; margin-top: 24px; }
.stepnav a { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--ink); text-decoration: none; }
.stepnav a:first-child { flex: .8; }
.footer { margin-top: 20px; font-size: 11px; color: var(--muted); }
.side .scroll::after { content: ""; display: block; height: 0; }

/* ---- the tabbed panel (components/viewer/tabbed-panel.tsx) ---- */
.strip { flex: none; display: flex; align-items: flex-end; gap: 6px; }
.tabs { display: flex; gap: 6px; }
.tab { font: inherit; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; padding: 6px 18px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; position: relative; }
.tab.on { border-color: var(--line); background: var(--tab-active); color: var(--ink); }
.boardname { margin-left: auto; min-width: 0; align-self: center; font-size: 12px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px 4px; }
.folder { flex: 1; min-height: 0; margin-top: -1px; border: 1px solid var(--line); border-radius: 0 8px 8px 8px; background: var(--tab-active); padding: 12px; display: flex; }
.inner { flex: 1; min-height: 0; min-width: 0; background: var(--panel); border: 1px solid var(--faint); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; }
.inner.text { overflow: auto; }

/* the phone's NOSE / CENTER / TAIL switch (RAILS' own row, copied) */
.secrow { display: none; flex: none; gap: 6px; padding-top: 11px; }
.secrow .tab { padding: 2px 8px; }

.views { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; }
.view { min-height: 0; display: flex; flex-direction: column; }
.view.top { flex: 1.25; }
.view.sec { flex: 1; }
.view h3 { margin: 0; flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
.view h3 .v { text-transform: none; letter-spacing: 0; font-weight: 500; }
.view svg { flex: 1; min-height: 0; width: 100%; display: block; overflow: visible; }
.chips { display: inline-flex; gap: 2px; }
.chips button { font: inherit; font-size: 10px; font-weight: 700; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 1px 6px; cursor: pointer; letter-spacing: .05em; }
.chips button.on { color: var(--ink); border-color: var(--line); }
.strow { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 2px 0; font-size: 12px; color: var(--muted); }
.strow .lbl { margin: 0; font-size: 12px; flex: none; white-space: nowrap; }
.strow input.rng { margin: 0; flex: 1; }
.foot { flex: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--faint); display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; }
.foot .fig dd { font-size: 18px; }
.footline { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }

/* DATA */
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: right; font-weight: 800; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--faint); white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; color: var(--ink); position: sticky; left: 0; background: var(--panel); }
table.data td { text-align: right; padding: 6px 8px; color: var(--muted); border-bottom: 1px solid var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data tr.fin td, table.data tr.wide td { color: var(--ink); }
.datanotes { margin-top: 12px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.datanotes p { margin: 4px 0; }

/* drawing strokes — one ink, one dash per role, as the app's viewers draw them. Widths, dashes and type are
   written by the drawing code in screen pixels (every picture scales to its box, the lines and words must not). */
.board { fill: var(--fill); stroke: var(--ink); }
.stringer { stroke: var(--station); fill: none; }
.station { stroke: var(--station); fill: none; }
.widepoint { stroke: var(--widepoint); fill: none; }
.deepline { stroke: var(--station); fill: none; }
.pencil { stroke: var(--pencil); fill: none; }
.pencil.live { stroke: var(--ink); }
.iso { stroke: var(--station); fill: none; }
.shade { fill: var(--muted); }
.cutline { stroke: var(--ink); fill: none; }
.grab { fill: var(--accent); stroke: var(--ink); cursor: ew-resize; }
.grabzone { fill: transparent; cursor: ew-resize; }
.tick { stroke: var(--muted); }
.lab { font-family: Inter, Roboto, system-ui, sans-serif; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; fill: var(--muted); }
.val { font-family: Inter, Roboto, system-ui, sans-serif; font-weight: 500; fill: var(--ink); font-variant-numeric: tabular-nums; }
.val.muted { fill: var(--muted); }
.straight { stroke: var(--ink); fill: none; }
.ghost { stroke: var(--ghost); fill: none; }
.dim { stroke: var(--ink); fill: none; }
.ext { stroke: var(--station); fill: none; }
.brk { stroke: var(--ink); fill: none; }

/* the sketch bar on a narrow screen: smaller, and the variant note folds behind ⓘ */
@media (max-width: 819.98px) {
  #bar { font-size: 12px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; gap: 10px; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top)); scrollbar-width: none; }
  #bar::-webkit-scrollbar { display: none; }
  #bar b, #bar .grp { flex: none; flex-wrap: nowrap; white-space: nowrap; }
  #bar button { padding: 3px 7px; }
  #note { display: none; }
  #note.open { display: block; }
  #noteBtn { display: inline-block; }
}
#noteBtn { display: none; }

/* ===== the phone (width < 820, or the sketch bar's Phone frame): drawing pinned above, controls beneath.
   Written once against #app.phone; build.py copies the block under @media (max-width: 819.98px) with the plain
   #app selector, so the real rule is width alone — the app's own switch — and the class is only the sketch bar's frame. ===== */
/* PHONE-START */
#app.phone .nav { display: none; }
#app.phone .topbar { display: flex; }
#app.phone .shell { flex-direction: column; }
#app.phone .main { order: -1; flex: none; height: 66%; padding: 2px max(2px, env(safe-area-inset-right)) 2px 2px; }
#app.phone .view.top { flex: 1.05; }
#app.phone .view.top h3 { display: none; }
#app.phone .capB { display: none; }
#app.phone #exag .v { display: none; }
#app.phone .foot { margin-top: 4px; padding-top: 4px; gap: 4px 8px; }
#app.phone .side { width: auto; flex: 1; min-height: 0; border-right: 0; border-top: 1px solid var(--faint); }
#app.phone .side .scroll { padding: 16px; }
#app.phone .side .scroll::after { height: 53px; }
#app.phone .tab { padding: 2px 8px; }
#app.phone .secrow { display: flex; }
#app.phone .folder { padding: 2px; }
#app.phone .inner { padding: 2px 4px 4px; }
#app.phone .inner.text { padding: 8px; }
#app.phone .ruled { margin-top: 14px; }
#app.phone .side .rcard { padding: 8px 10px; }
#app.phone .foot .fig dd { font-size: 16px; }
#app.phone .view h3 { font-size: 10px; }
#app.phone .sidesec { display: none; }
#app.phone .sidesec.shown { display: block; }
#app.phone .strow { font-size: 11px; padding-top: 4px; }
#app.phone .footline { display: none; }
@media (max-width: 819.98px) {
#app .nav { display: none; }
#app .topbar { display: flex; }
#app .shell { flex-direction: column; }
#app .main { order: -1; flex: none; height: 66%; padding: 2px max(2px, env(safe-area-inset-right)) 2px 2px; }
#app .view.top { flex: 1.05; }
#app .view.top h3 { display: none; }
#app .capB { display: none; }
#app #exag .v { display: none; }
#app .foot { margin-top: 4px; padding-top: 4px; gap: 4px 8px; }
#app .side { width: auto; flex: 1; min-height: 0; border-right: 0; border-top: 1px solid var(--faint); }
#app .side .scroll { padding: 16px; }
#app .side .scroll::after { height: 53px; }
#app .tab { padding: 2px 8px; }
#app .secrow { display: flex; }
#app .folder { padding: 2px; }
#app .inner { padding: 2px 4px 4px; }
#app .inner.text { padding: 8px; }
#app .ruled { margin-top: 14px; }
#app .side .rcard { padding: 8px 10px; }
#app .foot .fig dd { font-size: 16px; }
#app .view h3 { font-size: 10px; }
#app .sidesec { display: none; }
#app .sidesec.shown { display: block; }
#app .strow { font-size: 11px; padding-top: 4px; }
#app .footline { display: none; }
}
/* PHONE-END */
</style>
</head>
<body>
<div id="bar">
  <b>019 Bottom</b>
  <span class="grp"><span>Variant</span>
    <button data-v="A" class="on">A: Shade</button>
    <button data-v="B">B: Contour lines</button>
    <button data-v="C">C: Shade + lines</button>
  </span>
  <span class="grp"><span>Board</span><span id="gBoard"></span></span>
  <span class="grp"><span>Theme</span>
    <button data-t="daylight" class="on">Daylight</button><button data-t="chalk">Chalk</button><button data-t="slate">Slate</button><button data-t="phosphor">Phosphor</button>
  </span>
  <span class="grp"><span>Units</span><button data-u="imperial" class="on">Imperial</button><button data-u="metric">Metric</button></span>
  <span class="grp"><span>Layout</span><button data-f="0" class="on">Auto</button><button data-f="1">Phone frame</button></span>
  <span class="grp"><button id="resetAll">↺ Starting numbers</button><button id="noteBtn" aria-label="About this variant">ⓘ</button></span>
</div>
<div id="note"></div>

<div id="stage">
<div id="app" class="theme-daylight">

/* ============ units — the app's lib/geometry/units.ts rules, ported line for line ============ */
const IN = 25.4;
function fmtInFrac(mmv, den = 16) {
  const inches = mmv / IN; const sign = inches < 0 ? "-" : ""; const nudge = inches < 0 ? -1e-9 : 1e-9;
  const rounded = Math.abs(Math.round(inches * den + nudge) / den);
  let whole = Math.floor(rounded + 1e-9); let f = Math.round((rounded - whole) * den);
  if (f === den) { whole += 1; f = 0; }
  if (f === 0) return `${sign}${whole}"`;
  let n = f, d = den; while (n % 2 === 0) { n /= 2; d /= 2; }
  return `${sign}${whole > 0 ? whole + " " : ""}${n}/${d}"`;
}
function fmtCm(mmv) { const cm = mmv / 10; const nudge = cm < 0 ? -1e-9 : 1e-9; return (Math.round((cm + nudge) * 10) / 10).toFixed(1); }
function fmtMm(mmv) { const nudge = mmv < 0 ? -1e-9 : 1e-9; return String(Math.round(mmv + nudge)); }
function fmtFeetIn(mmv) {
  const inches = mmv / IN; const r = Math.round(inches * 16) / 16; const feet = Math.floor((r + 1e-9) / 12); const rem = r - feet * 12;
  const zero = rem > 0 && rem < 1 ? "0 " : ""; return `${feet}'${zero}${fmtInFrac(rem * IN)}`;
}
const metric = () => state.units === "metric";
const dim = (v) => metric() ? `${fmtCm(v)} cm` : fmtInFrac(v);          // dims: stations, widths, lengths
const dimBare = (v) => metric() ? fmtCm(v) : fmtInFrac(v);
const mark = (v) => metric() ? `${fmtMm(v)} mm` : fmtInFrac(v);         // marks: depths, lifts, thicknesses
const markBare = (v) => metric() ? fmtMm(v) : fmtInFrac(v);
const len = (v) => metric() ? `${fmtCm(v)} cm` : fmtFeetIn(v);
const L1 = (v) => `${v.toFixed(2)} L`;

/* ============ the cuts ============ */
// the across-section curves (the planning memory): u 0..1, r smoothness 0..1
const sec = (u, r) => (1 - r) * (1 - u) + r * (1 + Math.cos(Math.PI * u)) / 2;     // concave: deepest at u=0, nothing at u=1
const rise = (u, r) => (1 - r) * u + r * (1 - Math.cos(Math.PI * u / 2));         // lift: nothing at the stringer, full at the rail
const sm = (t) => (1 - Math.cos(Math.PI * Math.max(0, Math.min(1, t)))) / 2;
const PINCH = 3 * IN; // a concave narrower than this shallows out in proportion, so a tip never gets a slot

  const { H, px } = fit; const S = strokes(px);
  const s = state.station, Wo = curveAt(s), inner = innerAt(s), T = thickAt(s), Wf = foamAt(s);
  const Wmax = B.widePointWidth / 2; const kx = Math.min(860, 1000 - 150 * px) / (2 * Wmax); const E = state.exag;
  const cx = 500, y0 = H - Math.min(44 * px, H * 0.26), budget = Math.min(24 * px, H * 0.14);
  // the height is exaggerated by E — unless that would push the cut itself out of the box, when it is fitted instead
  let deepestHere = 0; for (let j = 0; j <= 40; j++) deepestHere = Math.max(deepestHere, foamOff(s, Wo * j / 40));
  const room = Math.max(4 * px, y0 - budget - 10 * px);
  let ky = kx * E; if (deepestHere > 0.3 && deepestHere * ky > room) ky = room / deepestHere;
  const slabTop = y0 - T * ky; const broken = slabTop < budget; const yTop = broken ? budget : slabTop;
  const xOf = (y) => cx + y * kx, hOf = (y) => y0 - foamOff(s, Math.abs(y)) * ky;
  let out = "";
  if (Wo > 0.5) {
    const n = 140;
    const piece = (yA, yB) => { // yA..yB across (yA < yB), foam between them
      let d = `M${xOf(yA).toFixed(1)} ${yTop.toFixed(1)}L${xOf(yB).toFixed(1)} ${yTop.toFixed(1)}`;
      for (let j = 0; j <= n; j++) { const y = yB - (yB - yA) * j / n; d += `L${xOf(y).toFixed(1)} ${hOf(y).toFixed(1)}`; }
      return d + "Z";
    };
    if (inner > 0.5) out += `<path class="board" ${S.board} d="${piece(inner, Wo)}"/><path class="board" ${S.board} d="${piece(-Wo, -inner)}"/>`;
    else out += `<path class="board" ${S.board} d="${piece(-Wo, Wo)}"/>`;
    if (broken) { // the slab runs on above: a break line across the top, in the drawing convention
      let z = `M${(xOf(-Wo) - 8 * px).toFixed(1)} ${yTop.toFixed(1)}`; const segs = 28; for (let j = 1; j <= segs; j++) { const x = xOf(-Wo) - 8 * px + (2 * Wo * kx + 16 * px) * j / segs; z += `L${x.toFixed(1)} ${(yTop + (j % 2 ? -3 * px : 3 * px)).toFixed(1)}`; }
      out += `<path class="brk" d="${z}" style="stroke:var(--panel);stroke-width:${sw(px, 7)}"/><path class="brk" ${S.line} d="${z}"/>`;
    }
    // the finished rail from RAILS, as it would sit on what the contour leaves
    const rail = state.showRail ? railAt(s) : null;
    if (rail) {
      const half = (sign) => { let d = ""; const pts = [];
        for (let q = 0; q < DATA.U.length; q++) { const y = inner + DATA.U[q] * Wf; const f = foamOff(s, y); const fix = (h) => f + h * (T - f) / T; pts.push([y, fix(rail.hi[q]), fix(rail.lo[q])]); }
        for (let q = 0; q < pts.length; q++) d += `${q ? "L" : "M"}${xOf(sign * pts[q][0]).toFixed(1)} ${(y0 - pts[q][1] * ky).toFixed(1)}`;
        for (let q = pts.length - 1; q >= 0; q--) d += `L${xOf(sign * pts[q][0]).toFixed(1)} ${(y0 - pts[q][2] * ky).toFixed(1)}`;
        return d; };
      out += `<defs><clipPath id="clipSlab"><rect x="0" y="${(yTop - (broken ? 0 : 2 * px)).toFixed(1)}" width="1000" height="${(H - yTop).toFixed(1)}"/></clipPath></defs><g clip-path="url(#clipSlab)"><path class="ghost" ${S.line} d="${half(1)}${half(-1)}"/></g>`;
    }
    // the stringer, as a faint line down the section (the drawing's centreline)
    if (inner <= 0.5) out += `<line class="stringer" ${S.stringer} x1="${cx}" y1="${(yTop + 2 * px).toFixed(1)}" x2="${cx}" y2="${(hOf(0) - 2 * px).toFixed(1)}"/>`;
  }
  // the planed bottom: a straightedge laid rail to rail
  out += `<line class="straight" ${S.station} x1="${(xOf(-Wo) - 30 * px).toFixed(1)}" y1="${y0.toFixed(1)}" x2="${(xOf(Wo) + 30 * px).toFixed(1)}" y2="${y0.toFixed(1)}"/>`;
  if (px < 1.6) out += `<text class="lab" ${S.lab} x="${(xOf(-Wo) - 30 * px).toFixed(1)}" y="${(y0 + 13 * px).toFixed(1)}" text-anchor="start">Planed bottom</text>`;
  const shownE = ky / kx; out += `<text class="lab" ${S.lab} x="${(8 * px).toFixed(1)}" y="${(14 * px).toFixed(1)}" text-anchor="start">${shownE < 1.01 ? "True height" : `Height ×${Math.abs(shownE - E) < 0.01 ? E : shownE.toFixed(1)}`}</text>`;
  // the dimensions a shaper measures: the gap under the straightedge at the stringer, the lift at each rail, the stringer left
  const dline = (x, ya, yb, side, text, cls = "", line = 1) => { const t = Math.min(ya, yb), b2 = Math.max(ya, yb); let o = `<line class="dim" ${S.dimw} x1="${x.toFixed(1)}" y1="${t.toFixed(1)}" x2="${x.toFixed(1)}" y2="${b2.toFixed(1)}"/>`;
    o += `<line class="dim" ${S.dimw} x1="${(x - 4 * px).toFixed(1)}" y1="${t.toFixed(1)}" x2="${(x + 4 * px).toFixed(1)}" y2="${t.toFixed(1)}"/><line class="dim" ${S.dimw} x1="${(x - 4 * px).toFixed(1)}" y1="${b2.toFixed(1)}" x2="${(x + 4 * px).toFixed(1)}" y2="${b2.toFixed(1)}"/>`;
    if (side === "below") o += `<text class="val ${cls}" ${S.val} x="${x.toFixed(1)}" y="${(b2 + (2 + 13 * line) * px).toFixed(1)}" text-anchor="middle">${svgEsc(text)}</text>`;
    else o += `<text class="val ${cls}" ${S.val} x="${(x + (side === "right" ? 7 * px : -7 * px)).toFixed(1)}" y="${((t + b2) / 2 + 4 * px).toFixed(1)}" text-anchor="${side === "right" ? "start" : "end"}">${svgEsc(text)}</text>`;
    return o; };
  if (Wo > 0.5) {
    const d0 = inner <= 0.5 ? foamOff(s, 0) : 0;
    if (d0 > 0.25) out += dline(cx, y0, y0 - d0 * ky, "below", `${mark(d0)} at the stringer`);
    const dR = foamOff(s, Wo);
    const roomRight = 1000 - xOf(Wo); // drawing units free beyond the right rail
    const words = roomRight > 150 * px; // the words fit on a computer; a phone keeps the value alone
    if (dR > 0.25) { out += `<line class="ext" ${S.line} x1="${xOf(Wo).toFixed(1)}" y1="${(y0 - dR * ky).toFixed(1)}" x2="${(xOf(Wo) + 22 * px).toFixed(1)}" y2="${(y0 - dR * ky).toFixed(1)}"/>` + dline(xOf(Wo) + 16 * px, y0, y0 - dR * ky, "right", `${mark(dR)}${words ? " rail lift" : ""}`);
      out += `<line class="ext" ${S.line} x1="${xOf(-Wo).toFixed(1)}" y1="${(y0 - dR * ky).toFixed(1)}" x2="${(xOf(-Wo) - 22 * px).toFixed(1)}" y2="${(y0 - dR * ky).toFixed(1)}"/>` + dline(xOf(-Wo) - 16 * px, y0, y0 - dR * ky, "left", mark(dR)); }
    if (!broken && inner <= 0.5 && T * ky > 30 * px && roomRight > 70 * px && (words || dR <= 0.25)) { const xr = Math.min(1000 - (words ? 90 : 40) * px, xOf(Wo) + (dR > 0.25 ? (words ? 110 : 60) * px : (words ? 50 : 30) * px)); const yb = y0 - d0 * ky;
      out += `<line class="ext" ${S.line} x1="${cx}" y1="${yTop.toFixed(1)}" x2="${xr.toFixed(1)}" y2="${yTop.toFixed(1)}"/><line class="ext" ${S.line} x1="${cx}" y1="${yb.toFixed(1)}" x2="${xr.toFixed(1)}" y2="${yb.toFixed(1)}"/>` + dline(xr - 5 * px, yTop, yb, "right", `${mark(T - d0)}${words ? " stringer left" : ""}`); }
    // a deepest-cut gap off the stringer (a double's trough) when it is not at the stringer
    let best = 0, yBest = 0; for (let j = 0; j <= 60; j++) { const y = Wo * j / 60; const f = foamOff(s, y); if (f > best + 1e-9) { best = f; yBest = y; } }
    // on its own line when the stringer's gap is labelled too, so the two never run together on a phone
    if (yBest > 3 && yBest < Wo - 3 && best > d0 + 0.25 && best > 0.25) out += dline(xOf(yBest), y0, y0 - best * ky, "below", `${mark(best)} in the trough`, "", d0 > 0.25 ? 2 : 1);
  }
  document.getElementById("sec").innerHTML = out;
  document.getElementById("secCap").textContent = `Section · ${dim(s)} from the tail`;
  document.getElementById("secCapB").textContent = ` · ${dim(2 * Wo)} wide`;
  const sl = document.getElementById("stSlider"); const metricU = metric();
  sl.min = 0; sl.max = metricU ? Math.floor(B.L / 10) * 10 : Math.floor(B.L / IN * 2) / 2; sl.step = metricU ? 10 : 0.5;
  const fromNose = B.L - s; sl.value = metricU ? Math.round(fromNose / 10) * 10 : Math.round(fromNose / IN * 2) / 2;
  sl.style.setProperty("--p", `${(fromNose / B.L) * 100}%`);
  document.getElementById("stLbl").textContent = `Section at`;
}

/* ============ the readouts and DATA ============ */
function drawFoot() {
  const off = litresOff(); const T = thickAt(B.L / 2); const strg = T - foamOff(B.L / 2, 0);
  document.getElementById("foot").innerHTML =
    `<div class="fig"><dt>Foam off</dt><dd>${L1(off)}</dd></div><div class="fig"><dt>Volume now</dt><dd>${L1(B.litres - off)}</dd></div><div class="fig"><dt>Stringer at center</dt><dd>${mark(strg)}</dd></div>` +
    `<div class="footline">Planed ${mark(T)} at the center · ${L1(B.litres)} before contours · contours only take foam away.</div>`;
}
function drawData() {
  const rows = []; const step = 6 * IN;
  for (let s = 0; s < B.L - 1; s += step) rows.push(s); rows.push(B.L);
  const unit = (f) => metric() ? ` <span style="font-weight:500;letter-spacing:0;text-transform:none">${f}</span>` : "";
  let h = `<table class="data"><thead><tr><th>From the tail${unit("cm")}</th><th>Width${unit("cm")}</th><th>Deepest cut${unit("mm")}</th><th>Rail lift${unit("mm")}</th><th>Stringer left${unit("mm")}</th></tr></thead><tbody>`;
  for (const s of rows) { const W = curveAt(s), inner = innerAt(s), T = thickAt(s); const cls = Math.abs(s - B.fin) < 3 * IN ? "fin" : Math.abs(s - B.wide) < 3 * IN ? "wide" : "";
    const label = s >= B.L - 1 ? "Nose tip" : s === 0 ? "Tail" : dimBare(s);
    const deep = deepestAt(s), lift = foamOff(s, W), left = inner > 0.5 || W <= 0.5 ? null : T - foamOff(s, 0);
    h += `<tr class="${cls}"><td>${label}</td><td>${W > 0.5 ? dimBare(2 * W) : "—"}</td><td>${deep > 0.25 ? markBare(deep) : "—"}</td><td>${lift > 0.25 ? markBare(lift) : "—"}</td><td>${left === null ? "—" : markBare(left)}</td></tr>`; }
  h += `</tbody></table><div class="datanotes"><p>Deepest cut is the largest gap under a straightedge laid rail to rail at that station. Rail lift is that gap at the rail. Stringer left is the planed thickness less the cut at the stringer.</p><p>Wide point ${dim(B.wide)} and ${B.finWord.toLowerCase()} ${dim(B.fin)} from the tail are the two rows in full ink.</p></div>`;
  document.getElementById("dataPanel").innerHTML = h;
}
function drawInputs() {
  document.getElementById("inputsCard").innerHTML = `<div class="cap">From TEMPLATE &amp; ROCKER</div><dl class="figs"><div class="fig"><dt>Length</dt><dd>${len(B.L)}</dd></div><div class="fig"><dt>Width</dt><dd>${dim(B.widePointWidth)}</dd></div><div class="fig"><dt>Thickness</dt><dd>${mark(thickAt(B.L / 2))}</dd></div></dl><div class="footline">Thickness is the planed number. The contour comes out of it.</div>`;
  document.getElementById("boardName").textContent = B.name;
}

/* ============ the sidebar's three sections ============ */
const CONTROLS = {
  off: { label: "Off Rail", fam: "mark", range: [0, 6], hints: ["At the rail", null] },
  trough: { label: "Trough At", fam: "mark", range: [0.5, 6], suffix: " from the stringer" },
  strip: { label: "Flat Strip", fam: "mark", range: [0, 8], suffix: " wide" },
  start: { label: "Start", fam: "station" }, deep: { label: "Deepest At", fam: "station" }, end: { label: "End", fam: "station" },
  depth: { label: "Depth", fam: "mark", range: [0, 0.5], hints: ["Nothing cut", null] },
  vee: { label: "Vee Lift", fam: "mark", range: [0, 0.5] },
  smooth: { label: "Smoothness", fam: "pct", hints: ["Straight to the edge", "Rounded out"] },
};
function controlsFor(c) {
  if (c.kind === "flat") return [];
  const list = [];
  if (c.kind === "single" || c.kind === "double") list.push("off");
  if (c.kind === "double") list.push("trough");
  if (c.kind === "vee" && (c.strip > 0 || c.name === "Tri-Plane Hull Center")) list.push("strip");
  list.push("start", "deep", "end", "depth");
  if (c.spiral) list.push("vee");
  list.push("smooth");
  return list;
}
function sliderSpec(key, sectionKey) {
  const C = CONTROLS[key]; const m = metric();
  if (C.fam === "pct") return { min: 0, max: 100, step: 5, toRaw: (v) => v, fromRaw: (v) => v, fill: "start" };
  if (C.fam === "mark") { const [a, b] = C.range; return m ? { min: Math.ceil(a * IN), max: Math.floor(b * IN), step: 1, toRaw: (mm) => Math.round(mm), fromRaw: (v) => v, fill: "start" } : { min: a, max: b, step: 1 / 16, toRaw: (mm) => mm / IN, fromRaw: (v) => v * IN, fill: "start" }; }
  // a station: every slider runs nose (left) to tail (right), like the drawing; the raw value is the distance from the nose
  const maxRaw = m ? Math.floor(B.L / 10) * 10 : Math.floor(B.L / IN * 2) / 2;
  return { min: 0, max: maxRaw, step: m ? 10 : 0.5, toRaw: (s) => m ? (B.L - s) : (B.L - s) / IN, fromRaw: (v) => B.L - (m ? v : v * IN), fill: sectionKey === "nose" ? "start" : "end" };
}
function labelFor(key, c, sectionKey) {
  const C = CONTROLS[key];
  if (C.fam === "pct") return `${C.label} — ${c[key]}%`;
  if (C.fam === "mark") return `${C.label} — ${mark(c[key])}${C.suffix || ""}`;
  const fromNose = sectionKey === "nose"; const v = fromNose ? B.L - c[key] : c[key];
  return `${C.label} — ${dim(v)} from the ${fromNose ? "nose" : "tail"}`;
}
function normalize(c, changed) {
  if (changed === "start") { if (c.deep > c.start) c.deep = c.start; if (c.end > c.deep) c.end = c.deep; }
  else if (changed === "end") { if (c.deep < c.end) c.deep = c.end; if (c.start < c.deep) c.start = c.deep; }
  else if (changed === "deep") { if (c.start < c.deep) c.start = c.deep; if (c.end > c.deep) c.end = c.deep; }
  if (c.kind === "double") c.trough = Math.min(c.trough, Math.max(IN / 2, (curveAt(c.deep) - c.off) * 0.85));
}
function buildControls() {
  const host = document.getElementById("sections"); let h = "";
  for (const key of ["nose", "center", "tail"]) {
    const c = state.cuts[key];
    h += `<div class="sidesec${key === state.active ? " shown" : ""}" data-sec="${key}"><div class="ruled"><span>${SECTION_TITLE[key]}</span><span class="cutname">${svgEsc(c.name)}</span></div><div class="group">`;
    h += `<div><div class="lbl">Cut</div><div class="selwrap"><select data-sel="${key}">${NAMES[key].map((n) => `<option${n.name === c.name ? " selected" : ""}>${svgEsc(n.name)}</option>`).join("")}</select></div></div>`;
    if (c.kind === "flat") h += `<div class="flatnote">Nothing is cut in this section.</div>`;
    for (const k of controlsFor(c)) {
      const sp = sliderSpec(k, key); const C = CONTROLS[k];
      h += `<div data-row="${k}"><div class="lbl" data-lbl></div><input class="rng${sp.fill === "end" ? " fill-end" : ""}" type="range" data-sec="${key}" data-key="${k}" min="${sp.min}" max="${sp.max}" step="${sp.step}" aria-label="${SECTION_TITLE[key]} ${C.label}">`;
      const hints = C.fam === "station" ? ["Nose", "Tail"] : C.hints ? [C.hints[0], C.hints[1] === null ? (C.fam === "mark" ? mark(C.range[1] * IN) : "") : C.hints[1]] : null;
      if (hints) h += `<div class="hints"><span>${hints[0] || ""}</span><span>${hints[1] || ""}</span></div>`;
      h += `</div>`;
    }
    if (c.kind === "single" && key === "nose") h += `<label class="check"><input type="checkbox" data-pointed="${key}"${c.pointed ? " checked" : ""}>Closes to a point toward the center</label>`;
    h += `</div></div>`;
  }
  host.innerHTML = h; syncControls();
}
function syncControls() {
  document.querySelectorAll("#sections input.rng").forEach((el) => {
    const key = el.dataset.key, sk = el.dataset.sec, c = state.cuts[sk], sp = sliderSpec(key, sk);
    const raw = sp.toRaw(c[key]); el.value = raw; el.style.setProperty("--p", `${((raw - sp.min) / (sp.max - sp.min)) * 100}%`);
    el.closest("[data-row]").querySelector("[data-lbl]").textContent = labelFor(key, c, sk);
  });
  document.querySelectorAll(".sidesec").forEach((el) => el.classList.toggle("shown", el.dataset.sec === state.active));
  document.querySelectorAll("#secrow .tab").forEach((el) => el.classList.toggle("on", el.dataset.sec === state.active));
}

/* ============ render ============ */
let raf = 0;
function render(full) {
  if (full) { drawInputs(); buildControls(); }
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => { drawTop(); drawSec(); drawFoot(); if (state.page === "data") drawData(); });
}
function applyChrome() {

  document.getElementById("app").className = `theme-${state.theme}${state.frame ? " phone" : ""}`;
  document.getElementById("stage").className = state.frame ? "framed" : "";
  document.querySelectorAll("#bar [data-v]").forEach((b) => b.classList.toggle("on", b.dataset.v === state.variant));
  document.querySelectorAll("#bar [data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === state.theme));
  document.querySelectorAll("#bar [data-u]").forEach((b) => b.classList.toggle("on", b.dataset.u === state.units));
  document.querySelectorAll("#bar [data-f]").forEach((b) => b.classList.toggle("on", (b.dataset.f === "1") === state.frame));
  document.querySelectorAll("#bar [data-b]").forEach((b) => b.classList.toggle("on", b.dataset.b === state.board));
  document.querySelectorAll("#exag button").forEach((b) => b.classList.toggle("on", +b.dataset.e === state.exag));
  document.querySelectorAll(".tabs .tab").forEach((b) => b.classList.toggle("on", b.dataset.page === state.page));
  document.getElementById("viewerPanel").style.display = state.page === "viewer" ? "" : "none";
  document.getElementById("dataPanel").style.display = state.page === "data" ? "" : "none";
  const notes = { A: "<b>A — Shade.</b> Depth reads as a faint wash inside the outline, darker where the cut is deeper; each cut's edge is a pencil line. Drag the dash-dot line (or tap the board) to move the section. The sidebar section you touch is the cut drawn in full ink, with its Start · Deepest · End taped under the board.",
    B: "<b>B — Contour lines.</b> No wash: a faint line at every 1/16\" of depth, like a topographic map, keeping sketch 004's rule of nothing but faint lines inside the outline.",
    C: "<b>C — Shade with lines.</b> The wash of A with a contour line at every 1/8\" of depth laid over it, so the shade shows the shape and the lines give the number." };
  document.getElementById("note").innerHTML = notes[state.variant];
}

/* ============ wiring (once) ============ */
document.getElementById("gBoard").innerHTML = DATA.boards.map((b) => `<button data-b="${b.id}">${b.name}</button>`).join("");
document.getElementById("bar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.v) state.variant = b.dataset.v;
  else if (b.dataset.t) state.theme = b.dataset.t;
  else if (b.dataset.u) { state.units = b.dataset.u; applyChrome(); render(true); return; }
  else if (b.dataset.f !== undefined) state.frame = b.dataset.f === "1";
  else if (b.dataset.b) { setBoard(b.dataset.b); applyChrome(); render(true); return; }
  else if (b.id === "resetAll") { setBoard(state.board); applyChrome(); render(true); return; }
  else if (b.id === "noteBtn") { document.getElementById("note").classList.toggle("open"); return; }
  applyChrome(); render(false);
});
// the pictures redraw whenever their boxes change size (a phone turning, a window resized, the frame toggled)
new ResizeObserver(() => render(false)).observe(document.getElementById("top"));
document.getElementById("exag").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.exag = +b.dataset.e; applyChrome(); render(false); });
document.querySelector(".tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.page = b.dataset.page; applyChrome(); render(false); });
document.getElementById("secrow").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.active = b.dataset.sec; syncControls(); render(false); });
document.getElementById("showRail").addEventListener("change", (e) => { state.showRail = e.target.checked; render(false); });
document.getElementById("sections").addEventListener("input", (e) => {
  const el = e.target; if (!el.matches("input.rng")) return;
  const key = el.dataset.key, sk = el.dataset.sec, c = state.cuts[sk], sp = sliderSpec(key, sk);
  c[key] = sp.fromRaw(+el.value); normalize(c, key); state.active = sk; syncControls(); render(false);
});
document.getElementById("sections").addEventListener("change", (e) => {
  const el = e.target;
  if (el.matches("select")) { const sk = el.dataset.sel; state.cuts[sk] = makeCut(sk, el.value, B); state.active = sk; buildControls(); render(false);
    if (state.cuts[sk].kind !== "flat") state.station = state.cuts[sk].deep; render(false); }
  else if (el.dataset.pointed) { state.cuts[el.dataset.pointed].pointed = el.checked; render(false); }
});
document.getElementById("sections").addEventListener("pointerdown", (e) => { const sec = e.target.closest(".sidesec"); if (sec && sec.dataset.sec !== state.active) { state.active = sec.dataset.sec; syncControls(); render(false); } });
document.getElementById("stSlider").addEventListener("input", (e) => { const v = +e.target.value; state.station = Math.max(0, Math.min(B.L, B.L - (metric() ? v : v * IN))); render(false); });
// dragging the section line on the top view, or tapping the board, moves the section
(() => {
  const svg = document.getElementById("top"); let dragging = false;
  const stationAt = (ev) => { const r = svg.getBoundingClientRect(); const vx = (ev.clientX - r.left) * (1000 / r.width);
    const H = +svg.getAttribute("viewBox").split(" ")[3]; const px = 1000 / r.width; const k = Math.min(900 / B.L, Math.max(1, (H - 30 * px - 46 * px) / B.widePointWidth));
    return Math.max(0, Math.min(B.L, B.L / 2 - (vx - 500) / k)); };

// the starting theme follows the viewer: an explicit light/dark choice on the page's root, else the OS
