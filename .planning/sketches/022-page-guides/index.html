<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketch 022 — A GUIDE tab on every page: ROCKER first</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== the app's four palettes, copied from app/globals.css (--ramp-*) on 2026-11-06 (sketch 021) ===== */
.theme-daylight { --ground:#ffffff; --sidebar:#ffffff; --canvas:#dfdcd3; --tab-active:#ffffff; --panel:#ffffff; --well:#dfdcd3;
  --ink:#1f2a3b; --muted:#566171; --line:#897c58; --faint:#897c58; --accent:#8ec1b8; --on-accent:#1f2a3b; --accent-ink:#48605c; --fill:#d9f2ed; --warn:#9a4b2f; color-scheme:light; }
.theme-chalk { --ground:#ffffff; --sidebar:#ffffff; --canvas:#dfdcd3; --tab-active:#ffffff; --panel:#ffffff; --well:#dfdcd3;
  --ink:#1f2a3b; --muted:#566171; --line:#897c58; --faint:#897c58; --accent:#3490bc; --on-accent:#090e16; --accent-ink:#2b424c; --fill:#d8ebf2; --warn:#9a4b2f; color-scheme:light; }
.theme-slate { --ground:#12141a; --sidebar:#12141a; --canvas:#1a1d25; --tab-active:#12141a; --panel:#12141a; --well:#1b1f26;
  --ink:#f2f4f7; --muted:#a1a8b4; --line:#6a707c; --faint:#333842; --accent:#18526d; --on-accent:#f2f4f7; --accent-ink:#3490bc; --fill:#1a2732; --warn:#e0a080; color-scheme:dark; }
.theme-phosphor { --ground:#050805; --sidebar:#050805; --canvas:#142414; --tab-active:#050805; --panel:#050805; --well:#050805;
  --ink:#26d026; --muted:#2ca62c; --line:#3e783e; --faint:#3e783e; --accent:#2ca62c; --on-accent:#050805; --accent-ink:#52ab52; --fill:#142414; --warn:#26d026; color-scheme:dark; }
/* derived, as app/globals.css derives them: faint construction ink, the blank's own line (60%) and the foam to come off (24%) */
#app { --station: color-mix(in srgb, var(--muted) 36%, transparent); --blankline: color-mix(in srgb, var(--muted) 60%, transparent);
  --foam: color-mix(in srgb, var(--muted) 24%, transparent); --ghost: color-mix(in srgb, var(--muted) 70%, transparent); }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: #c9c5ba; font-family: Inter, Roboto, system-ui, sans-serif; }

/* ---- sketch chrome (not part of the design) ---- */
#bar { flex: none; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 16px;
  padding-top: max(8px, env(safe-area-inset-top)); background: #0d0f14; color: #cfd5de; font: 13px/1.2 system-ui, sans-serif; border-bottom: 1px solid #262a33; }
#bar b { color: #fff; margin-right: 4px; }
.grp { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.grp > span { color: #8a93a3; margin-right: 2px; }
#bar button { font: inherit; color: #cfd5de; background: #1b1f28; border: 1px solid #333a47; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
#bar button.on { background: #3490bc; border-color: #3490bc; color: #fff; }
#bar button.soon { opacity: .45; cursor: default; }
#note { flex: none; font: 12.5px/1.45 system-ui, sans-serif; color: #cfd5de; background: #15181f; padding: 6px 16px; border-bottom: 1px solid #262a33; }
#note b { color: #fff; }
#stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: stretch; }
#stage.framed { align-items: flex-start; padding: 16px; overflow: auto; }
#stage.framed #app { width: 390px; height: 760px; flex: none; border: 10px solid #1a1c22; border-radius: 28px; overflow: hidden; }

/* ===== the page ===== */
#app { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--ground); color: var(--ink);
  font-family: Inter, Roboto, system-ui, sans-serif; font-size: 14px; line-height: 1.4; }

/* the computer's top row */
.nav { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 40px; padding: 24px; border-bottom: 1px solid var(--faint); background: var(--ground); }
.nav .mark { width: 10.96rem; min-width: 6.26rem; color: var(--ink); }
.nav .mark svg { display: block; width: 100%; height: auto; }
.nav .links { display: flex; align-items: center; gap: 16px; }
.nav .links a { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; color: var(--muted); text-decoration: none; padding-bottom: 2px; border-bottom: 2px solid transparent; white-space: nowrap; }
.nav .links a.on { color: var(--ink); border-bottom-color: var(--accent); }
.nav .links .sep { width: 1px; height: 16px; background: var(--faint); margin: 0 4px; }
.pill { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 9999px; padding: 5px 14px; cursor: pointer; }
.iconbtn { width: 28px; height: 28px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); display: inline-grid; place-items: center; cursor: pointer; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--well); border: 1px solid var(--line); }

/* the phone's compact bar */
.topbar { display: none; flex: none; height: 48px; align-items: center; justify-content: space-between; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); border-bottom: 1px solid var(--faint); background: var(--ground); }
.topbar .mark { width: 120px; color: var(--ink); }
.topbar .mark svg { display: block; width: 100%; height: auto; }
.topbar .right { display: flex; align-items: center; gap: 12px; }
.topbar .sep { width: 1px; height: 16px; background: var(--faint); }
.hamb { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--ink); cursor: pointer; margin-right: -12px; }

.shell { flex: 1; min-height: 0; display: flex; }
.side { width: 340px; flex: none; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--faint); background: var(--sidebar); }
.side .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 40px; }
.main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--canvas); padding: 12px; }

/* ---- the sidebar's dress (ROCKER's own: rocker-controls.tsx) ---- */
.title { font-size: 18px; line-height: 1.2; font-weight: 800; text-transform: uppercase; letter-spacing: .15em; color: var(--ink); }
.sub { margin-top: 2px; font-size: 14px; color: var(--muted); }
.ruled { margin-top: 22px; padding-bottom: 8px; border-bottom: 1px solid var(--faint); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .15em; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
button.ruled { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--faint); font: inherit; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .15em; color: var(--ink); cursor: pointer; text-align: left; padding: 0 0 8px; }
.advhead { margin-top: 4px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--faint); font: inherit; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .15em; color: var(--ink); cursor: pointer; text-align: left; padding: 0 0 8px 12px; display: flex; justify-content: space-between; }
.group { display: flex; flex-direction: column; gap: 14px; padding-top: 12px; }
.lbl { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.hints { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 2px; }
.hints .act { flex: none; font-weight: 700; font-size: 11px; color: var(--accent-ink); opacity: .4; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.smallnote { font-size: 12px; color: var(--muted); }
.smallnote b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.textlink { font-size: 11px; font-weight: 700; color: var(--accent-ink); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.textlink.dim { opacity: .4; }
/* the two-option toggle (Deck / Bottom) */
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.toggle button { font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; background: transparent; color: var(--muted); border: 0; cursor: pointer; }
.toggle button.on { background: var(--accent); color: var(--on-accent); }
.togglerow { display: flex; align-items: center; gap: 12px; }
.togglerow .hint { min-width: 0; font-size: 12px; color: var(--muted); }
/* the BLANK button (blank-picker.tsx, sketch 015 B) and Customize Rocker › */
.blankbtn { width: 100%; text-align: left; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; }
.blankbtn svg { display: block; width: 72px; height: 44px; overflow: visible; }
.blankbtn .bname { display: block; font-size: 14px; font-weight: 700; }
.blankbtn .bmeta { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
.blankbtn .bcta { display: block; margin-top: 5px; font-size: 10px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; color: var(--accent-ink); }
.outbtn { width: 100%; display: flex; justify-content: space-between; align-items: center; font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }

/* the app's slider: accent fill, ink-ringed 6px track, accent dot with an ink ring */
input.rng { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; border: 1px solid var(--ink); margin: 6px 0; display: block;
  background: linear-gradient(to right, var(--accent) 0 var(--p, 50%), transparent var(--p, 50%) 100%); cursor: pointer; }
input.rng.fill-end { background: linear-gradient(to right, transparent 0 var(--p, 50%), var(--accent) var(--p, 50%) 100%); }
input.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 1px solid var(--ink); }
input.rng::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 1px solid var(--ink); }
input.rng:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; }
@media (pointer: coarse) { input.rng::-webkit-slider-thumb { width: 22px; height: 22px; } input.rng { margin: 11px 0; } }

/* the imported-dimensions card (sketch 017 C) */
.rcard { margin-top: 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 11px; }
.rcard .cap { font-size: 10px; line-height: 1.2; font-weight: 800; text-transform: uppercase; letter-spacing: .15em; color: var(--accent-ink); }
.figs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 10px; margin-top: 8px; }
.fig { display: flex; flex-direction: column-reverse; justify-content: flex-end; min-width: 0; }
.fig dt { margin-top: 2px; font-size: 10px; line-height: 1.2; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.fig dd { margin: 0; font-size: 18px; line-height: 1.15; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }

.stepnav { display: flex; gap: 8px; margin-top: 24px; }
.stepnav a { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--ink); text-decoration: none; }
.stepnav a:first-child { flex: .8; }
.footer { margin-top: 20px; font-size: 11px; color: var(--muted); }
.side .scroll::after { content: ""; display: block; height: 0; }

/* ---- the tabbed panel (components/viewer/tabbed-panel.tsx) ---- */
.strip { flex: none; display: flex; align-items: flex-end; gap: 6px; }
.tabs { display: flex; gap: 6px; }
.tab { font: inherit; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; padding: 6px 18px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; position: relative; white-space: nowrap; }
.tab.on { border-color: var(--line); background: var(--tab-active); color: var(--ink); }
.tab .short { display: none; }
.tab[data-page="top"] { display: none; }   /* TOP VIEW is a tab on a small screen only (quick 261006-qfm) */
.boardname { margin-left: auto; min-width: 0; align-self: center; font-size: 12px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px 4px; }
.folder { flex: 1; min-height: 0; margin-top: -1px; border: 1px solid var(--line); border-radius: 0 8px 8px 8px; background: var(--tab-active); padding: 12px; display: flex; }
.inner { flex: 1; min-height: 0; min-width: 0; background: var(--panel); border: 1px solid var(--faint); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; }
.inner.text { overflow: auto; }
.inner svg.big { flex: 1; min-height: 0; width: 100%; display: block; overflow: visible; }
.viewnote { flex: none; font-size: 11px; color: var(--muted); padding-top: 4px; }

/* DATASHEET and PLANING */
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: right; font-weight: 800; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--faint); white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; color: var(--ink); position: sticky; left: 0; background: var(--panel); }
table.data td { text-align: right; padding: 6px 8px; color: var(--muted); border-bottom: 1px solid var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data td.ink { color: var(--ink); }
table.data td.typed span { display: inline-block; min-width: 56px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); text-align: right; }
table.data td .passes { display: block; font-size: 11px; color: var(--muted); }
.datahead { margin: 18px 0 6px; font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
.datahead:first-child { margin-top: 0; }
.datanotes { margin-top: 12px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.datanotes p { margin: 4px 0; }
.intro { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }

/* GUIDE: one card per control or named choice (sketch 021's dress) — its cartoon (the board the shaper has open, drawn by the
   page's own kind of drawing, with that one setting pushed in muted dashes), its name with the board's own value, a sentence
   on what it is and looks like, one on what it does, and a How to shape note under a dashed rule */
.guidenote { font-size: 12px; color: var(--muted); line-height: 1.5; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 10px; margin-bottom: 6px; }
.card { min-width: 0; border: 1px solid var(--faint); border-radius: 10px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.card.on { border-color: var(--line); }
.card h4 { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 700; color: var(--ink); }
.card h4 .now { flex: none; font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.card h4 .now.val { text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 600; }
.card svg { display: block; width: 100%; height: auto; overflow: visible; }
.card svg path, .card svg line, .card svg rect { vector-effect: non-scaling-stroke; }
.card p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
.card p b { font-weight: 600; color: var(--ink); }
.card p.how { margin-top: 2px; padding-top: 6px; border-top: 1px dashed var(--faint); font-size: 12px; line-height: 1.45; }
.card p.how .cap { display: block; margin-bottom: 1px; font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-ink); }
.datahead .sub2 { font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 12px; margin-left: 8px; }

/* drawing strokes — one ink, one dash per role, as the app's viewers draw them. The blank is a real object, so its line is
   solid (--outline-blank-line) and the foam to come off is a flat wash; dashes mean reference lines. */
.board { fill: var(--fill); stroke: var(--ink); }
.blankfoam { fill: var(--foam); stroke: var(--blankline); }
.baseline { stroke: var(--station); fill: none; }
.station { stroke: var(--station); fill: none; }
.mark { stroke: var(--ink); fill: none; }
.mark.ghost { stroke: var(--ghost); }
.ghost { stroke: var(--ghost); fill: none; }
.win { stroke: var(--ink); fill: none; }
.tick { stroke: var(--muted); }
.lab { font-family: Inter, Roboto, system-ui, sans-serif; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; fill: var(--muted); }
.val { font-family: Inter, Roboto, system-ui, sans-serif; font-weight: 500; fill: var(--ink); font-variant-numeric: tabular-nums; }
.val.muted { fill: var(--muted); }
.val.b { font-weight: 700; }
.dim { stroke: var(--ink); fill: none; }
.ext { stroke: var(--station); fill: none; }
.chip { fill: var(--panel); stroke: var(--line); }
.dot { fill: var(--accent); stroke: var(--ink); }

/* the sketch bar on a narrow screen: smaller, and the note folds behind ⓘ */
@media (max-width: 819.98px) {
  #bar { font-size: 12px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; gap: 10px; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top)); scrollbar-width: none; }
  #bar::-webkit-scrollbar { display: none; }
  #bar b, #bar .grp { flex: none; flex-wrap: nowrap; white-space: nowrap; }
  #bar button { padding: 3px 7px; }
  #note { display: none; }
  #note.open { display: block; }
  #noteBtn { display: inline-block; }
}
@media (max-height: 500px) {
  #bar { font-size: 12px; flex-wrap: nowrap; overflow-x: auto; gap: 10px; padding: 4px 10px; scrollbar-width: none; }
  #bar b, #bar .grp { flex: none; flex-wrap: nowrap; white-space: nowrap; }
  #note { display: none; }
  #note.open { display: block; }
  #noteBtn { display: inline-block; }
}
#noteBtn { display: none; }

/* ===== the phone (width < 820, or the sketch bar's Phone frame): drawing pinned above, controls beneath.
   Written once against #app.phone; build.py copies the block under @media (max-width: 819.98px) with the plain
   #app selector, so the real rule is width alone — the app's own switch — and the class is only the sketch bar's frame. ===== */
/* PHONE-START */
#app.phone .nav { display: none; }
#app.phone .topbar { display: flex; }
#app.phone .shell { flex-direction: column; }
#app.phone .main { order: -1; flex: none; height: 66%; padding: 2px max(2px, env(safe-area-inset-right)) 2px 2px; }
#app.phone .side { width: auto; flex: 1; min-height: 0; border-right: 0; border-top: 1px solid var(--faint); }
#app.phone .side .scroll { padding: 16px; }
#app.phone .side .scroll::after { height: 53px; }
#app.phone .tab { padding: 2px 8px; }
#app.phone .tab .full { display: none; }
#app.phone .tab .short { display: inline; }
#app.phone .tab[data-page="top"] { display: inline-block; }
#app.phone .folder { padding: 2px; }
#app.phone .inner { padding: 2px 4px 4px; }
#app.phone .inner.text { padding: 8px; }
#app.phone .ruled { margin-top: 14px; }
#app.phone .viewnote { display: none; }
#app.phone .card { padding: 8px 10px 10px; }
@media (max-width: 819.98px) {
#app .nav { display: none; }
#app .topbar { display: flex; }
#app .shell { flex-direction: column; }
#app .main { order: -1; flex: none; height: 66%; padding: 2px max(2px, env(safe-area-inset-right)) 2px 2px; }
#app .side { width: auto; flex: 1; min-height: 0; border-right: 0; border-top: 1px solid var(--faint); }
#app .side .scroll { padding: 16px; }
#app .side .scroll::after { height: 53px; }
#app .tab { padding: 2px 8px; }
#app .tab .full { display: none; }
#app .tab .short { display: inline; }
#app .tab[data-page="top"] { display: inline-block; }
#app .folder { padding: 2px; }
#app .inner { padding: 2px 4px 4px; }
#app .inner.text { padding: 8px; }
#app .ruled { margin-top: 14px; }
#app .viewnote { display: none; }
#app .card { padding: 8px 10px 10px; }
}
/* PHONE-END */
</style>
</head>
<body>
<div id="bar">
  <b>022 Guides</b>
  <span class="grp"><span>Page</span><button data-pg="rocker" class="on">Rocker</button><button class="soon" title="Round two, after the founder's rulings on ROCKER">Template</button><button class="soon" title="Round two">Rails</button><button class="soon" title="Round two">Volume</button><button class="soon" title="Round two">Fins</button></span>
  <span class="grp"><span>Board</span><span id="gBoard"></span></span>
  <span class="grp"><span>Theme</span>
    <button data-t="daylight" class="on">Daylight</button><button data-t="chalk">Chalk</button><button data-t="slate">Slate</button><button data-t="phosphor">Phosphor</button>
  </span>
  <span class="grp"><span>Units</span><button data-u="imperial" class="on">Imperial</button><button data-u="metric">Metric</button></span>
  <span class="grp"><span>Layout</span><button data-f="0" class="on">Auto</button><button data-f="1">Phone frame</button></span>
  <span class="grp"><button id="noteBtn" aria-label="About this sketch">ⓘ</button></span>
</div>
<div id="note"></div>

<div id="stage">
<div id="app" class="theme-daylight">

/* ============ units — the app's lib/geometry/units.ts and measure-display.ts rules, ported line for line (sketch 021) ============ */
const IN = 25.4;
function fmtInFrac(mmv, den = 16) {
  const inches = mmv / IN; const sign = inches < 0 ? "-" : ""; const nudge = inches < 0 ? -1e-9 : 1e-9;
  const rounded = Math.abs(Math.round(inches * den + nudge) / den);
  let whole = Math.floor(rounded + 1e-9); let f = Math.round((rounded - whole) * den);
  if (f === den) { whole += 1; f = 0; }
  if (f === 0) return `${sign}${whole}"`;
  let n = f, d = den; while (n % 2 === 0) { n /= 2; d /= 2; }
  return `${sign}${whole > 0 ? whole + " " : ""}${n}/${d}"`;
}
function fmtCm(mmv) { const cm = mmv / 10; const nudge = cm < 0 ? -1e-9 : 1e-9; return (Math.round((cm + nudge) * 10) / 10).toFixed(1); }
function fmtMm(mmv) { const nudge = mmv < 0 ? -1e-9 : 1e-9; return String(Math.round(mmv + nudge)); }
function fmtFeetIn(mmv) {
  const inches = mmv / IN; const r = Math.round(inches * 16) / 16; const feet = Math.floor((r + 1e-9) / 12); const rem = r - feet * 12;
  const zero = rem > 0 && rem < 1 ? "0 " : ""; return `${feet}'${zero}${fmtInFrac(rem * IN)}`;
}
const metric = () => state.units === "metric";
const dim = (v) => metric() ? `${fmtCm(v)} cm` : fmtInFrac(v);          // dims: lengths along the board — a thinning start, a bend's start
const dimBare = (v) => metric() ? fmtCm(v) : fmtInFrac(v);
const mark = (v) => metric() ? `${fmtMm(v)} mm` : fmtInFrac(v);         // marks: rocker heights, thicknesses, the deck skin, a placement
const markBare = (v) => metric() ? fmtMm(v) : fmtInFrac(v);
const len = (v) => metric() ? `${fmtCm(v)} cm` : fmtFeetIn(v);
const signedMark = (v) => { if (metric()) { const p = fmtMm(v); return p === "0" || p === "-0" ? "0 mm" : (p.startsWith("-") ? `${p} mm` : `+${p} mm`); } const p = fmtInFrac(v); return p === '0"' ? '0"' : (p.startsWith("-") ? p : `+${p}`); };

function passesText(depth) { const steps = (v) => metric() ? Math.round(v) : Math.round(v / IN * 16); const d = steps(depth), p = steps(DATA.planerMaxDepth); if (d <= 0 || p <= 0) return "0"; const whole = Math.floor(d / p); const left = d - whole * p; const leftMm = metric() ? left : left / 16 * IN; return left > 0 ? `${whole} + ${mark(leftMm)}` : `${whole}`; }

function sampleOver(arr, a, b, s) { const n = arr.length - 1; let x = Math.max(0, Math.min(n, ((s - a) / (b - a)) * n)); const k = Math.min(n - 1, Math.floor(x)); const t = x - k; return arr[k] + (arr[k + 1] - arr[k]) * t; }

// nose left on a computer; on an upright phone the board stands with the phone, nose up (D-09/D-18) — the drawing is made
// horizontally and the whole group turned, every word turned back upright, as the app's viewer does
const phoneUpright = () => state.frame || (window.matchMedia("(max-width: 819.98px)").matches && window.matchMedia("(orientation: portrait)").matches);
function fitBig(id) {
  const svg = document.getElementById(id); const b = svg.getBoundingClientRect(); if (b.width < 40 || b.height < 20) return null;
  const vertical = phoneUpright();
  // the canonical frame: 1000 along the board, the box's other side across it; px = one screen pixel in drawing units
  const along = vertical ? b.height : b.width, across = vertical ? b.width : b.height;
  const px = 1000 / along; const A = 1000, C = Math.round(1000 * across / along);
  svg.setAttribute("viewBox", vertical ? `0 0 ${C} ${A}` : `0 0 ${A} ${C}`);
  return { svg, A, C, px, vertical };
}
const sw = (px, n) => (n * px).toFixed(2);
const up = (vertical, x, y, inner) => vertical ? `<g transform="rotate(-90 ${f1(x)} ${f1(y)})">${inner}</g>` : inner;
function drawSide() {
  const fit = fitBig("side"); if (!fit) return;
  const { A, C, px, vertical } = fit; const R = readers(B);
  const S = { line: `stroke-width="${sw(px, 1)}"`, board: `stroke-width="${sw(px, 1.2)}"`, dash43: `stroke-dasharray="${sw(px, 4)} ${sw(px, 3)}"`, lab: `font-size="${sw(px, 10)}"`, val: `font-size="${sw(px, 13)}"`, name: `font-size="${sw(px, 10)}"` };
  const sMin = Math.min(0, R.start), sMax = Math.max(R.L, R.end);
  const titles = px < 1.6; const padX = (titles ? 100 : 40) * px, railDeck = 58 * px, railBot = 58 * px;
  const k = (A - 2 * padX) / (sMax - sMin);
  // the frame: the deck rail above, the bottom rail below, the board between
  let hiMax = 0; for (let j = 0; j <= 60; j++) { const s = sMin + (sMax - sMin) * j / 60; hiMax = Math.max(hiMax, R.hasBlank ? R.bTop(s) : 0, s >= 0 && s <= R.L ? R.deck(s) : 0); }
  let loMin = 0; for (let j = 0; j <= 60; j++) { const s = sMin + (sMax - sMin) * j / 60; if (R.hasBlank) loMin = Math.min(loMin, R.bBottom(s)); }
  const room = C - railDeck - railBot; const kY = Math.min(k, room / ((hiMax - loMin) || 1));
  const yBase = railDeck + (room - (hiMax - loMin) * kY) / 2 + hiMax * kY;
  const X = (s) => padX + (sMax - s) * k, Y = (h) => yBase - h * kY;
  let out = "";
  out += `<line class="baseline" ${S.line} ${S.dash43} x1="${f1(X(sMax) - 10 * px)}" y1="${f1(yBase)}" x2="${f1(X(sMin) + 10 * px)}" y2="${f1(yBase)}"/>`;
  if (R.hasBlank) out += `<path class="blankfoam" ${S.line} d="${blankPath(R, X, Y)}"/>`;
  out += `<path class="board" ${S.board} d="${boardPath(R, X, Y)}"/>`;
  // where each tip's thinning starts: a short dashed line across the board, in the board's own ink (Phase 14 D-12)
  if (R.hasBlank) for (const e of ["nose", "tail"]) { const t = B.blank.tips[e]; const x = X(t.station);
    out += `<line class="mark" ${S.line} ${S.dash43} x1="${f1(x)}" y1="${f1(Y(R.rocker(t.station)) + 6 * px)}" x2="${f1(x)}" y2="${f1(Y(R.deck(t.station)) - 6 * px)}"/>`; }
  // the two rails: thickness above (cards where the shaper sets the number, plain readings where the blank derives it), rocker below
  const cardKeys = R.hasBlank ? ["noseTip", "center", "tailTip"] : KEYS;
  const yDeckRail = railDeck - 14 * px, yBotRail = C - railBot + 14 * px;
  if (titles) { out += up(vertical, 8 * px, yDeckRail + 4 * px, `<text class="lab" ${S.lab} x="${f1(8 * px)}" y="${f1(yDeckRail + 4 * px)}" text-anchor="start" style="letter-spacing:.08em">Thickness</text>`);
    out += up(vertical, 8 * px, yBotRail + 4 * px, `<text class="lab" ${S.lab} x="${f1(8 * px)}" y="${f1(yBotRail + 4 * px)}" text-anchor="start" style="letter-spacing:.08em">Rocker</text>`); }
  for (const key of KEYS) {
    const s = B.stations[key], x = X(s);
    // thickness: leader from the rail to the deck, then a card or a reading
    const yDeck = Y(R.deck(s));
    out += `<line class="station" ${S.line} x1="${f1(x)}" y1="${f1(yDeckRail + 16 * px)}" x2="${f1(x)}" y2="${f1(yDeck)}"/>`;
    const tv = markBare(B.foil[key]);
    if (cardKeys.includes(key)) { // the card box turns with the board, so its words stay inside it nose-up too
      const w = (vertical ? 34 : 58) * px, h = (vertical ? 58 : 32) * px;
      out += `<rect class="chip" ${S.line} x="${f1(x - w / 2)}" y="${f1(yDeckRail - h / 2)}" width="${f1(w)}" height="${f1(h)}" rx="${sw(px, 4)}"/>`;
      out += up(vertical, x, yDeckRail, `<text class="lab" ${S.name} x="${f1(x)}" y="${f1(yDeckRail - 4 * px)}" text-anchor="middle" style="letter-spacing:.08em;text-transform:none;font-weight:700">${svgEsc(keyName(key))}</text><text class="val b" ${S.val} x="${f1(x)}" y="${f1(yDeckRail + 11 * px)}" text-anchor="middle">${svgEsc(tv)}</text>`);
    } else {
      out += `<line class="tick" ${S.line} x1="${f1(x - 4 * px)}" y1="${f1(yDeck + 4 * px)}" x2="${f1(x + 4 * px)}" y2="${f1(yDeck - 4 * px)}"/>`;
      out += up(vertical, x, yDeckRail, `<text class="val b" ${S.val} x="${f1(x)}" y="${f1(yDeckRail - 2 * px)}" text-anchor="middle">${svgEsc(tv)}</text><text class="lab" ${S.name} x="${f1(x)}" y="${f1(yDeckRail + 11 * px)}" text-anchor="middle" style="letter-spacing:.08em;text-transform:none;font-weight:700">${svgEsc(keyName(key))}</text>`);
    }
    // rocker: leader from the bottom curve down to the rail; the centre is the zero line itself, an em dash
    const yBot = Y(R.rocker(s));
    out += `<line class="station" ${S.line} x1="${f1(x)}" y1="${f1(yBot)}" x2="${f1(x)}" y2="${f1(yBotRail - 16 * px)}"/>`;
    const rv = key === "center" ? "—" : markBare(B.stationRocker[key]);
    if (key !== "center") out += `<line class="tick" ${S.line} x1="${f1(x - 4 * px)}" y1="${f1(yBot + 4 * px)}" x2="${f1(x + 4 * px)}" y2="${f1(yBot - 4 * px)}"/>`;
    out += up(vertical, x, yBotRail, `<text class="val b${key === "center" ? " muted" : ""}" ${S.val} x="${f1(x)}" y="${f1(yBotRail - 2 * px)}" text-anchor="middle">${svgEsc(rv)}</text><text class="lab" ${S.name} x="${f1(x)}" y="${f1(yBotRail + 11 * px)}" text-anchor="middle" style="letter-spacing:.08em;text-transform:none;font-weight:700">${svgEsc(keyName(key))}</text>`);
  }
  const g = vertical ? `<g transform="translate(${C} 0) rotate(90)">${out}</g>` : out;
  document.getElementById("side").innerHTML = g;
  const t = B.blank.tips;
  document.getElementById("sideNote").textContent = `${B.blank.vendor} ${B.blank.name} · ${len(B.blank.lengthMm)} blank, the board ${placementText(B.blank.placement)} · the dashed lines across the board are where each tip's thinning starts, ${dim(t.nose.fromTip)} from the nose and ${dim(t.tail.fromTip)} from the tail.`;
}
// TOP VIEW (a tab on a small screen only): the blank from above with the board's outline on it (rocker-top-view.tsx)
function drawTopView() {
  const fit = fitBig("topv"); if (!fit) return;
  const { A, C, px, vertical } = fit; const R = readers(B);
  const sMin = Math.min(0, R.start), sMax = Math.max(R.L, R.end); const padX = 24 * px;
  const k = (A - 2 * padX) / (sMax - sMin);
  let wMax = 0; for (const w of B.blank.width) wMax = Math.max(wMax, w / 2); for (const w of B.outline) wMax = Math.max(wMax, w);
  const kY = Math.min(k, (C - 40 * px) / (2 * wMax)); const cy = C / 2;
  const X = (s) => padX + (sMax - s) * k, Y = (y) => cy + y * kY;
  const S = { line: `stroke-width="${sw(px, 1)}"`, board: `stroke-width="${sw(px, 1.5)}"`, stringer: `stroke-dasharray="${sw(px, 16)} ${sw(px, 4)} ${sw(px, 4)} ${sw(px, 4)}"`, st: `stroke-dasharray="${sw(px, 5)} ${sw(px, 4)}"` };
  let out = "";
  { const n = B.blank.width.length - 1; let d = ""; for (let j = 0; j <= n; j++) { const s = R.start + (R.end - R.start) * j / n; d += `${j ? "L" : "M"}${f1(X(s))} ${f1(Y(B.blank.width[j] / 2))}`; } for (let j = n; j >= 0; j--) { const s = R.start + (R.end - R.start) * j / n; d += `L${f1(X(s))} ${f1(Y(-B.blank.width[j] / 2))}`; } out += `<path class="blankfoam" ${S.line} d="${d}Z"/>`; }
  { const n = B.outline.length - 1; let d = ""; for (let j = 0; j <= n; j++) { const s = R.L * j / n; d += `${j ? "L" : "M"}${f1(X(s))} ${f1(Y(B.outline[j]))}`; } for (let j = n; j >= 0; j--) { const s = R.L * j / n; d += `L${f1(X(s))} ${f1(Y(-B.outline[j]))}`; } out += `<path class="board" ${S.board} d="${d}Z"/>`; }
  out += `<line class="station" ${S.line} ${S.stringer} x1="${f1(X(sMax))}" y1="${f1(cy)}" x2="${f1(X(sMin))}" y2="${f1(cy)}"/>`;
  for (const key of ["nose12", "center", "tail12"]) { const s = B.stations[key]; const w = sampleOver(B.outline, 0, R.L, s); out += `<line class="station" ${S.line} ${S.st} x1="${f1(X(s))}" y1="${f1(Y(-w) - 6 * px)}" x2="${f1(X(s))}" y2="${f1(Y(w) + 6 * px)}"/>`; }
  document.getElementById("topv").innerHTML = vertical ? `<g transform="translate(${C} 0) rotate(90)">${out}</g>` : out;
}

/* ============ PLANING and DATASHEET (rocker-planing.tsx, rocker-datasheet.tsx — the figures from the one side profile) ============ */

  h += `<table class="data"><thead><tr><th>Station</th><th>Rocker${unit("mm")}</th><th>Off deck${unit("mm")}</th><th>Off bottom${unit("mm")}</th></tr></thead><tbody>`;

  document.getElementById("dataPanel").innerHTML = h;

/* ============ the sidebar: ROCKER's own controls, drawn from the board's real numbers (a picture here — the GUIDE is the sketch) ============ */
function slider(label, hintL, hintR, p = 50, extra = "") { return `<div><div class="lbl">${label}</div><input class="rng" type="range" min="0" max="100" value="${p}" style="--p:${p}%" aria-label="${svgEsc(label)}">${hintL !== undefined ? `<div class="hints"><span>${hintL || ""}</span>${extra}<span>${hintR || ""}</span></div>` : ""}</div>`; }
function blankThumb() {
  // the BLANK button's small drawing: the blank's outline over its rocker (blank-card.tsx)
  const bl = B.blank; const n = bl.width.length - 1; const Lb = bl.lengthMm; const R = readers(B);
  const X = (u) => 72 - u / Lb * 72; let d = "";
  let wMax = 0; for (const w of bl.width) wMax = Math.max(wMax, w);
  for (let j = 0; j <= n; j++) d += `${j ? "L" : "M"}${f1(X(Lb * j / n))} ${f1(12 - bl.width[j] / wMax * 10)}`; for (let j = n; j >= 0; j--) d += `L${f1(X(Lb * j / n))} ${f1(12 + bl.width[j] / wMax * 10)}`;
  let r = ""; let hi = 0; for (let j = 0; j <= n; j++) hi = Math.max(hi, R.bTop(R.start + (R.end - R.start) * j / n));
  for (let j = 0; j <= n; j++) { const s = R.start + (R.end - R.start) * j / n; r += `${j ? "L" : "M"}${f1(X(Lb * j / n))} ${f1(43 - R.bBottom(s) / hi * 16)}`; } for (let j = n; j >= 0; j--) { const s = R.start + (R.end - R.start) * j / n; r += `L${f1(X(Lb * j / n))} ${f1(43 - R.bTop(s) / hi * 16)}`; }
  return `<svg viewBox="0 0 72 44" aria-hidden="true"><path class="blankfoam" stroke-width="1" d="${d}Z"/><path class="blankfoam" stroke-width="1" d="${r}Z"/></svg>`;
}

/* ============ GUIDE: what each control is, what it does, how it is shaped ============ */
// The founder (2026-11-08, on sketch 021's GUIDE): "I think every page needs a guide like this. Super useful on what each
// parameter does to/for the board. Would also be nice to add a 'how to shape' note too." One sentence on what the control is
// and looks like, one on what it does to the board or the ride — first drafts from shaping lore, for his pen.
const GUIDE = {
  center: ["The board's thickness at its centre, deck to bottom — the one number the whole foil is scaled to.", "More centre means more float and paddle and a steadier, stiffer board; less means a livelier board that sits lower in the water and buries its rail more easily. It also sets how much foam comes off the blank's bottom."],
  tips: ["How thick the board finishes at its two tips, measured at the very end of the stringer.", "A thin nose tip lightens the swing weight and knifes in; a thin tail tip sinks and releases for sharper turns, while a fuller one floats the tail and planes earlier."],
  blank: ["The foam your board is cut from: a maker's blank with its own rocker, thickness and width printed at five stations. Your board lies inside it, the foam to come off shaded.", "Pick a blank and your rocker is its rocker — the nose and tail lift come from the foam, not a slider. A close blank means little planing and the maker's curve under your board; a fat one means more work and more room to change things."],
  placement: ["Where the board sits along its blank: centred, or slid toward the nose or the tail by as much as the blank leaves at each end.", "Slide toward the nose and the board takes more of the blank's nose curve — more nose rocker, less tail; slide toward the tail for the opposite. Every rocker number moves, and the thickness under the board with it."],
  skin: ["The layer the planer takes off the blank's deck everywhere, the same depth at every station — a pass or two of crust.", "A deeper skin sits the board lower in the blank and leaves clean foam under the glass, and brings a little nose and tail with it as the deck comes down; too little leaves the blank's dense skin and its lumps in your deck."],
  custom: ["The blank's rocker as you would order it from the maker — more or less at the nose or tail, the bend starting at the centre or a set distance in from the tip.", "A bend from the centre lifts the whole curve gently; one that starts 18 inches in kicks the tip up and leaves the middle flat and fast. The board follows the blank, so every rocker number updates."],
  noseRocker: ["How high the nose tip rises above the flat the board lies on, with the 12-inch station saying how the curve gets there.", "More nose rocker keeps the nose from pearling on steep drops and loosens the board, at the cost of paddle speed and glide; a flatter nose planes faster and catches waves earlier but can catch on late drops."],

  document.querySelectorAll("#bar [data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === state.theme));
  document.querySelectorAll("#bar [data-u]").forEach((b) => b.classList.toggle("on", b.dataset.u === state.units));
  document.querySelectorAll("#bar [data-f]").forEach((b) => b.classList.toggle("on", (b.dataset.f === "1") === state.frame));
  document.querySelectorAll("#bar [data-b]").forEach((b) => b.classList.toggle("on", b.dataset.b === state.board));
  // TOP VIEW exists only on a small screen (the CSS hides its tab elsewhere): a wide window that had it open lands on VIEWER
  const topShown = getComputedStyle(document.querySelector('.tab[data-page="top"]')).display !== "none";
  if (state.page === "top" && !topShown) state.page = "viewer";
  document.querySelectorAll(".tabs .tab").forEach((b) => b.classList.toggle("on", b.dataset.page === state.page));
  for (const p of ["viewer", "top", "planing", "data", "guide"]) document.getElementById(p === "data" ? "dataPanel" : p + "Panel").style.display = state.page === (p === "data" ? "datasheet" : p) ? "" : "none";
  document.getElementById("note").innerHTML = "<b>022 — a GUIDE on every design page, ROCKER first.</b> The founder on sketch 021's GUIDE (2026-11-08): \"every page needs a guide like this ... what each parameter does to/for the board ... a 'how to shape' note too.\" GUIDE joins ROCKER's own tabs — VIEWER · PLANING · DATASHEET on a computer, VIEWER · TOP · PLANING · DATA on a phone — with one card per control or named choice, each drawn from the board you have open with that setting pushed in muted dashes, two sentences and a shop note. The sidebar, VIEWER, PLANING and DATASHEET are pictures of today's page from the real numbers; the tabs and GUIDE are the sketch. Every sentence is a first draft for the founder's pen.";
}

/* ============ wiring (once) ============ */
document.getElementById("gBoard").innerHTML = DATA.boards.map((b) => `<button data-b="${b.id}">${svgEsc(b.name)}</button>`).join("");
document.getElementById("bar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.t) state.theme = b.dataset.t;
  else if (b.dataset.u) { state.units = b.dataset.u; applyChrome(); render(true); return; }
  else if (b.dataset.f !== undefined) state.frame = b.dataset.f === "1";
  else if (b.dataset.b) { setBoard(b.dataset.b); applyChrome(); render(true); return; }
  else if (b.id === "noteBtn") { document.getElementById("note").classList.toggle("open"); return; }
  else return;
  applyChrome(); render(false);
});
// the pictures redraw whenever their boxes change size (a phone turning, a window resized, the frame toggled)
new ResizeObserver(() => { applyChrome(); render(false); }).observe(document.getElementById("viewerPanel"));
document.querySelector(".tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.page = b.dataset.page; applyChrome(); render(false); });

setBoard("shortboard");
// the starting theme follows the viewer: an explicit light/dark choice on the page's root, else the OS
const viewerTheme = document.documentElement.dataset.theme;
if (viewerTheme === "dark" || (viewerTheme !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) state.theme = "slate";
applyChrome(); render(true);
window.sketch = { state, render, setBoard, applyChrome, cards, cartoon, drawGuide, readers, DATA };
</script>
</body>
