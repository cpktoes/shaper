<title>Sketch 012 — A nose printed 0 wide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link id="theme-link" rel="stylesheet" href="../themes/app-slate.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--color-page); color: var(--color-text); font-family: var(--font-sans); min-height: 100vh; }
  button, input { font-family: inherit; }

  /* ---------- sketch chrome (not part of the design) ---------- */
  #chrome { position: sticky; top: 0; z-index: 9998; }
  #variant-nav { display: flex; gap: 6px; align-items: center; padding: 8px 16px; background: #0d0f14; border-bottom: 1px solid #262a33; font: 13px/1.2 system-ui, sans-serif; color: #cfd5de; flex-wrap: wrap; }
  #variant-nav .sketch-id { font-weight: 700; margin-right: 8px; color: #fff; }
  .variant-tab { background: #1b1f27; color: #cfd5de; border: 1px solid #2c313b; border-radius: 6px; padding: 6px 10px; cursor: pointer; transition: all .15s ease; font: inherit; }
  .variant-tab:hover { border-color: #4b5361; color: #fff; }
  .variant-tab.active { background: #234f66; border-color: #3490bc; color: #fff; }
  .variant-tab.baseline { font-style: italic; }
  .variant-tab.winner { border-color: #c9a227; }
  .variant-tab.winner.active { background: #4a3d10; border-color: #e0b52c; }
  .notes-btn { margin-left: auto; }
  #sketch-bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 7px 16px; background: #14171d; border-bottom: 1px solid #262a33; font: 12px/1.3 system-ui, sans-serif; color: #aeb5c0; }
  #sketch-bar .desc { flex: 1 1 360px; color: #dfe3ea; }
  #sketch-bar .grp { display: flex; align-items: center; gap: 6px; }
  #sketch-bar .seg { display: inline-flex; border: 1px solid #2f343e; border-radius: 6px; overflow: hidden; }
  #sketch-bar .seg button { background: transparent; color: #aeb5c0; border: 0; padding: 4px 8px; font: 12px system-ui, sans-serif; cursor: pointer; transition: all .15s ease; }
  #sketch-bar .seg button + button { border-left: 1px solid #2f343e; }
  #sketch-bar .seg button:hover { color: #fff; background: #222731; }
  #sketch-bar .seg button.on { background: #234f66; color: #fff; }
  #sketch-bar input[type=range] { width: 150px; accent-color: #3490bc; }
  #sketch-bar .meas { color: #cfd5de; font-variant-numeric: tabular-nums; }
  #sketch-bar .meas b { color: #7cc4e8; }
  #sketch-bar .legend { display: inline-flex; gap: 12px; align-items: center; }
  #sketch-bar .legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
  #notes-panel { display: none; position: absolute; right: 12px; top: calc(100% + 6px); width: 420px; max-height: 72vh; overflow-y: auto; background: #12151b; color: #dfe3ea; border: 1px solid #2c313b; border-radius: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.5); padding: 14px 16px; font: 13.5px/1.5 system-ui, sans-serif; }
  #notes-panel.open { display: block; }
  #notes-panel h2 { font-size: 14px; margin: 0 0 6px; color: #fff; }
  #notes-panel h3 { font-size: 12px; margin: 12px 0 4px; letter-spacing: .05em; color: #fff; text-transform: uppercase; }
  #notes-panel p { margin: 0 0 8px; color: #aeb5c0; }
  #notes-panel ul { margin: 0 0 8px; padding-left: 18px; color: #aeb5c0; }
  #notes-panel b { color: #dfe3ea; }
  #sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font: 12px system-ui, sans-serif; background: rgba(0,0,0,0.82); color: #fff; padding: 6px 8px; border-radius: 8px; opacity: .7; transition: opacity .2s; display: flex; flex-direction: column; gap: 6px; }
  #sketch-tools:hover, #sketch-tools.open { opacity: 1; }
  #sketch-tools:not(.open) .row { display: none; }
  #tools-toggle { align-self: flex-end; }
  #sketch-tools .row { display: flex; gap: 4px; align-items: center; }
  #sketch-tools .row > span:first-child { width: 84px; color: #aeb5c0; }
  #sketch-tools button { font: 11px system-ui, sans-serif; background: #22262e; color: #fff; border: 1px solid #3a404b; border-radius: 4px; padding: 3px 6px; cursor: pointer; }
  #sketch-tools button.on { background: #234f66; border-color: #3490bc; }

  /* ---------- the drawing (the design) — the app's top view, as ROCKER draws it ---------- */
  :root {
    --outline-foam-shade: color-mix(in srgb, var(--color-text-muted) 24%, transparent);
    --outline-blank-line: color-mix(in srgb, var(--color-text-muted) 60%, transparent);
    --outline-station-line: color-mix(in srgb, var(--color-text-muted) 36%, transparent);
    --outline-board-fill: var(--color-board);
    --outline-ink: var(--color-text);
  }
  #stage { padding: 20px 16px 60px; }
  .intro { max-width: 1100px; margin: 0 auto 14px; font-size: 14px; line-height: 1.5; color: var(--color-text-muted); }
  .intro b { color: var(--color-text); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 16px; max-width: 1400px; margin: 0 auto; }
  .cell { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 12px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .cell h3 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: var(--tracking-architectural); text-transform: uppercase; color: var(--color-text-muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .cell h3 span { font-weight: 500; letter-spacing: 0; text-transform: none; }
  .cell .name { font-size: 20px; font-weight: 600; line-height: 1.2; }
  .cell .pair { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .cell .plate { background: var(--color-bg); }
  .cell svg { display: block; overflow: visible; }
  .cell svg.zoom { overflow: hidden; }
  .cell .cap { font-size: 12px; line-height: 1.45; color: var(--color-text-muted); max-width: 520px; }
  .cell .cap b { color: var(--color-text); font-weight: 600; }
  .lbl { font-family: var(--font-sans); font-size: 10px; font-weight: 600; fill: var(--color-text-muted); letter-spacing: .04em; }
  .stage-note { max-width: 1100px; margin: 18px auto 0; font-size: 12px; color: var(--color-text-muted); line-height: 1.5; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } .cell .pair { gap: 10px; } }
</style>

  return { p0: [x0, y0], p1: [x0 + (k * chord) / dir, y0 + (k * chord * m) / dir], p2: [x3, kTip * chord], p3: [x3, 0], chord, m };
}

/* C — a parabola from the tip: inside the last printed station the half-width is a·√d + b·d, d the
   distance in from the tip — the shape every round nose has at its very tip (its tangent is across
   the stringer) — with a and b chosen so it meets the station at the printed width AND at today's
   own slope there. Nothing to tune; the printed numbers decide it. Falls back to today's curve when
   the data is more pointed than a straight line to the tip (a ≤ 0). */
function parabolaCoefficients(record) {
  const c = todayCurve(record), seg = noseSegment(record);
  if (!seg.zeroNose) return null;
  const D = seg.D, hw = seg.last.y / 2, mk = -c.slopeAt(seg.last.x) / 2;  // dhw/dd, positive
  const a = (2 * (hw - D * mk)) / Math.sqrt(D), b = 2 * mk - hw / D;
  return { D, hw, mk, a, b, tipRadius: (a * a) / 2, pointed: a <= 0 };
}
function variantC(record, step = 0.25) {
  const c = todayCurve(record), seg = noseSegment(record), co = parabolaCoefficients(record);
  if (!co || co.pointed) return variantA(record, step);
  const x0 = seg.last.x, x3 = seg.tip.x;
  const out = sampleXs(record, step).filter((x) => x <= x0 + 1e-9).map((x) => [x, c.sample(x) / 2]);
  const N = 48;
  for (let i = 1; i <= N; i++) {
    // Even steps in √d, so the samples crowd toward the tip where the curve turns fastest.
    const u = (1 - i / N) * Math.sqrt(co.D), d = u * u;
    out.push([x3 - d, Math.max(0, co.a * u + co.b * d)]);
  }
  return out;
}

const PALETTES = {
  slate: { "--color-bg": "#12141a", "--color-surface": "#12141a", "--color-canvas": "#1a1d25", "--color-well": "#1b1f26", "--color-border": "#333842", "--color-line": "#6a707c", "--color-text": "#f2f4f7", "--color-text-muted": "#a1a8b4", "--color-primary": "#18526d", "--color-on-primary": "#f2f4f7", "--color-accent-ink": "#3490bc", "--color-board": "#1a2732", "--color-warning-ink": "#ff9670", "--color-page": "#0b0c10", "--compare-b": "#4aa8de" },
  daylight: { "--color-bg": "#ffffff", "--color-surface": "#ffffff", "--color-canvas": "#dfdcd3", "--color-well": "#dfdcd3", "--color-border": "#897c58", "--color-line": "#897c58", "--color-text": "#1f2a3b", "--color-text-muted": "#566171", "--color-primary": "#8ec1b8", "--color-on-primary": "#1f2a3b", "--color-accent-ink": "#48605c", "--color-board": "#d9f2ed", "--color-warning-ink": "#ac3811", "--color-page": "#c9c5ba", "--compare-b": "#1d6fa5" },
};
const COMMON_VARS = { "--font-sans": '"Inter", Roboto, system-ui, sans-serif', "--tracking-architectural": "0.15em" };

const VARIANTS = [
  { id: "a", label: "A: Today — a point", baseline: true },
  { id: "b", label: "B: Control point across the stringer" },
  { id: "c", label: "C: Parabola from the tip" },
  { id: "x", label: "Side by side" },
];
const DEFAULTS = { variant: "b", theme: "slate", board: "on", points: "on", k: 0.333, handles: "on", mini: "432" };
let state = { ...DEFAULTS };
try { Object.assign(state, JSON.parse(localStorage.getItem("sketch012") || "{}")); } catch (e) {}
function save() { try { localStorage.setItem("sketch012", JSON.stringify(state)); } catch (e) {} }

/* ---- the five blanks: the two preset blanks with their boards, and one more per span of the last printed segment ---- */
const ITEMS = [
  ...DATA.presets.map((p) => ({ key: p.id, record: p.record, board: p.board, startIn: p.blankStartIn, marks: p.marks, tag: `with the ${p.name} preset on it, where ROCKER puts it` })),
  ...DATA.blanks.map((b) => ({ key: b.record.name, record: b.record, board: null, startIn: null, marks: null, tag: "the blank alone" })),
];

/* ---- numbers for the captions ---- */
function frac(v, denom = 8) {
  const neg = v < 0; v = Math.abs(v);
  let whole = Math.floor(v), n = Math.round((v - whole) * denom), d = denom;
  if (n === denom) { whole += 1; n = 0; }
  while (n > 0 && n % 2 === 0) { n /= 2; d /= 2; }
  const f = n ? `${whole ? whole + " " : ""}${n}/${d}` : `${whole}`;
  return (neg ? "−" : "") + f + '"';
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }

function curveFor(record, variant) {
  if (variant === "a") return variantA(record);
  if (variant === "b") return variantB(record, state.k);
  return variantC(record);
}

/* ---- drawing, pinned to screen pixels like the app's mini display ---- */
const STRINGER_DASH = "16 4 4 4", STATION_DASH = "5 4";
function pathOf(pts, toX, toY, close) {
  const up = pts.map(([x, hw], i) => `${i ? "L" : "M"} ${toX(x).toFixed(2)} ${toY(-hw).toFixed(2)}`);
  const down = pts.slice().reverse().map(([x, hw]) => `L ${toX(x).toFixed(2)} ${toY(hw).toFixed(2)}`);
  return [...up, ...down, close ? "Z" : ""].join(" ");
}
function boardPath(item, toX, toY) {
  if (!item.board) return "";
  return item.board.map(([station, w], i) => `${i ? "L" : "M"} ${toX(station - item.startIn).toFixed(2)} ${toY(-w).toFixed(2)}`).join(" ") + " Z";
}
function marksOf(item, pts) {
  const L = item.record.lengthIn;
  const hwAt = (x) => { let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - x) < Math.abs(best[0] - x)) best = p; return best[1]; };
  return [["T12", 12], ["C", L / 2], ["N12", L - 12]].map(([label, x]) => ({ label, x, hw: hwAt(x) }));
}

/* The whole blank at the mini display's size (nose left), exactly the strokes ROCKER uses. */
function miniSvg(item, variant) {
  const rec = item.record, L = rec.lengthIn, pts = curveFor(rec, variant);
  const hwMax = Math.max(...pts.map((p) => p[1]), ...(item.board && state.board === "on" ? item.board.map((p) => Math.abs(p[1])) : [0]));
  const W = Number(state.mini), pad = 8, scale = (W - 2 * pad) / L, H = Math.ceil(2 * hwMax * scale + 2 * pad);
  const toX = (x) => pad + (L - x) * scale, toY = (y) => H / 2 + y * scale;
  const dots = rec.stations.filter((s) => s.widthIn !== null && s.widthIn > 0);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <path d="${pathOf(pts, toX, toY, true)}" fill="var(--outline-foam-shade)" stroke="var(--outline-blank-line)" stroke-width="1" stroke-linejoin="round"/>
    ${item.board && state.board === "on" ? `<path d="${boardPath(item, toX, toY)}" fill="var(--outline-board-fill)" stroke="var(--outline-ink)" stroke-width="1.5" stroke-linejoin="round"/>` : ""}
    <line x1="${toX(0)}" y1="${H / 2}" x2="${toX(L)}" y2="${H / 2}" stroke="var(--outline-station-line)" stroke-width="1" stroke-dasharray="${STRINGER_DASH}"/>
    ${marksOf(item, pts).map((m) => `<line x1="${toX(m.x).toFixed(2)}" y1="${toY(-m.hw).toFixed(2)}" x2="${toX(m.x).toFixed(2)}" y2="${toY(m.hw).toFixed(2)}" stroke="var(--outline-station-line)" stroke-width="1" stroke-dasharray="${m.label === "C" ? STRINGER_DASH : STATION_DASH}"/>`).join("")}
    ${state.points === "on" ? dots.map((s) => `<circle cx="${toX(s.fromTailIn).toFixed(2)}" cy="${toY(-s.widthIn / 2).toFixed(2)}" r="3" fill="var(--outline-blank-line)"/><circle cx="${toX(s.fromTailIn).toFixed(2)}" cy="${toY(s.widthIn / 2).toFixed(2)}" r="3" fill="var(--outline-blank-line)"/>`).join("") : ""}
  </svg>`;
}

/* The last 30" of the nose, 4× closer: the same strokes, plus the printed stations named. */
const ZOOM_IN = 30, ZOOM_SCALE = 11;
function zoomSvg(item, variants) {
  const rec = item.record, L = rec.lengthIn;
  const curves = variants.map((v) => ({ v, pts: curveFor(rec, v) }));
  const win = (pts) => pts.filter(([x]) => x >= L - ZOOM_IN - 1e-9);
  const hwMax = Math.max(...curves.map((c) => Math.max(...win(c.pts).map((p) => p[1]))));
  const drawHandles = variants.includes("b") && state.handles === "on";
  const padL = drawHandles ? 86 : 14, padR = 34, padY = 16;
  const W = ZOOM_IN * ZOOM_SCALE + padL + padR, H = Math.ceil(2 * hwMax * ZOOM_SCALE + 2 * padY);
  const toX = (x) => padL + (L - x) * ZOOM_SCALE, toY = (y) => H / 2 + y * ZOOM_SCALE;
  const many = variants.length > 1;
  const ink = (v) => v === "a" ? "var(--color-text-muted)" : v === "b" ? "var(--compare-b)" : "var(--outline-ink)";
  const stations = rec.stations.filter((s) => s.widthIn !== null && s.fromTailIn >= L - ZOOM_IN);
  let out = `<svg class="zoom" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  if (!many) {
    const pts = win(curves[0].pts);
    out += `<path d="${pathOf(pts, toX, toY, false)}" fill="var(--outline-foam-shade)" stroke="none"/>`;
    out += `<path d="${pathOf(pts, toX, toY, false)}" fill="none" stroke="var(--outline-blank-line)" stroke-width="1" stroke-linejoin="round"/>`;
    if (item.board && state.board === "on") out += `<path d="${boardPath(item, toX, toY)}" fill="var(--outline-board-fill)" stroke="var(--outline-ink)" stroke-width="1.5" stroke-linejoin="round"/>`;
  }
  out += `<line x1="${toX(L - ZOOM_IN)}" y1="${H / 2}" x2="${toX(L)}" y2="${H / 2}" stroke="var(--outline-station-line)" stroke-width="1" stroke-dasharray="${STRINGER_DASH}"/>`;
  for (const s of stations) {
    const x = toX(s.fromTailIn).toFixed(2);
    if (s.widthIn > 0) out += `<line x1="${x}" y1="${toY(-s.widthIn / 2).toFixed(2)}" x2="${x}" y2="${toY(s.widthIn / 2).toFixed(2)}" stroke="var(--outline-station-line)" stroke-width="1" stroke-dasharray="${STATION_DASH}"/>`;
    out += `<text class="lbl" x="${x}" y="${(H - 3).toFixed(2)}" text-anchor="middle">${esc(s.label)}</text>`;
  }
  if (many) {
    for (const c of curves) {
      const pts = win(c.pts);
      out += `<path d="${pathOf(pts, toX, toY, false)}" fill="none" stroke="${ink(c.v)}" stroke-width="${c.v === "a" ? 1.5 : 2}" ${c.v === "a" ? 'stroke-dasharray="4 3"' : ""} stroke-linejoin="round"/>`;
    }
  }
  if (drawHandles) {
    const h = variantBHandles(rec, state.k);
    const seg = (p, q) => `<line x1="${toX(p[0]).toFixed(2)}" y1="${toY(-p[1]).toFixed(2)}" x2="${toX(q[0]).toFixed(2)}" y2="${toY(-q[1]).toFixed(2)}" stroke="var(--compare-b)" stroke-width="1" stroke-dasharray="2 3"/>`;
    const box = (p) => `<rect x="${(toX(p[0]) - 3).toFixed(2)}" y="${(toY(-p[1]) - 3).toFixed(2)}" width="6" height="6" fill="var(--color-bg)" stroke="var(--compare-b)" stroke-width="1.2"/>`;
    out += seg(h.p0, h.p1) + seg(h.p3, h.p2) + box(h.p1) + box(h.p2);
    out += `<text class="lbl" x="${(toX(h.p2[0]) - 7).toFixed(2)}" y="${(toY(-h.p2[1]) + 3.5).toFixed(2)}" text-anchor="end" style="fill:var(--compare-b)">control point</text>`;
  }
  if (state.points === "on") for (const s of stations) if (s.widthIn > 0) { out += `<circle cx="${toX(s.fromTailIn).toFixed(2)}" cy="${toY(-s.widthIn / 2).toFixed(2)}" r="3" fill="var(--outline-blank-line)"/><circle cx="${toX(s.fromTailIn).toFixed(2)}" cy="${toY(s.widthIn / 2).toFixed(2)}" r="3" fill="var(--outline-blank-line)"/>`; }
  return out + `</svg>`;
}

function caption(item, variant) {
  const rec = item.record, seg = noseSegment(rec), today = todayCurve(rec);
  const D = seg.D, last = seg.last;
  const lastLabel = rec.stations.find((s) => s.fromTailIn === last.x).label;
  const printed = `<b>${esc(lastLabel)}</b> prints ${frac(last.y)} wide, ${frac(D)} in from a nose printed 0.`;
  if (variant === "a") {
    const deg = Math.atan(Math.abs(today.slopeAt(seg.tip.x) / 2)) * 180 / Math.PI;
    return `${printed} Today's curve runs from there straight into the tip, each rail meeting the stringer at about <b>${deg.toFixed(0)}°</b> — a point, not a round.`;
  }
  if (variant === "b") {
    const h = variantBHandles(rec, state.k);
    return `${printed} One curve from ${esc(lastLabel)} to the tip: it leaves ${esc(lastLabel)} along today's own slope and arrives <b>straight across the stringer</b>. Both handles ${frac(h.chord * state.k)}, ${Math.round(state.k * 100)}% of the ${frac(h.chord)} chord.`;
  }
  const co = parabolaCoefficients(rec);
  return `${printed} Inside ${esc(lastLabel)} the nose is a parabola with its point at the tip — the shape a round nose has there — bent to meet ${esc(lastLabel)} at the printed width and at today's own slope. At the very tip it rounds like a circle of radius <b>${frac(co.tipRadius, 2)}</b>. Nothing to set.`;
}

function cellHtml(item, variant) {
  const rec = item.record;
  const many = variant === "x";
  const zoom = zoomSvg(item, many ? ["a", "b", "c"] : [variant]);
  return `<section class="cell" data-blank="${esc(rec.name)}">
    <h3><span style="font-weight:700;letter-spacing:var(--tracking-architectural);text-transform:uppercase">${esc(rec.vendor)}</span><span>${esc(item.tag)}</span></h3>
    <div class="name">${esc(rec.name)} <span style="font-size:12px;font-weight:600;color:var(--color-text-muted)">· ${frac(rec.lengthIn)} tip to tip</span></div>
    ${many ? `<div class="plate">${zoom}</div><div class="cap">${caption(item, "a").split(" Today")[0]} Dotted: today. Blue: B, the control point (handles at ${Math.round(state.k * 100)}% of the chord). Solid: C, the parabola.</div>`
           : `<div class="pair"><div class="plate">${miniSvg(item, variant)}</div><div class="plate">${zoom}</div></div><div class="cap">${caption(item, variant)}</div>`}
  </section>`;
}

const INTROS = {
  a: "<b>Today.</b> The blank's outline is the square-root curve through every printed width, run straight to the 0 at the tip — so it reaches the stringer at an angle and the nose is a point. The small drawing is the mini display at its size on a computer; beside it, the last 30 inches of the nose four times closer.",
  b: "<b>B — the founder's idea.</b> From the last printed station the outline is one curve whose handle at the tip sits straight across the stringer, so it arrives perpendicular and turns through the printed widths from there. The handle length sets how full the round is: drag the slider.",
  c: "<b>C — a parabola from the tip.</b> Inside the last printed station the nose is a parabola with its point at the tip (every round nose is one there: the tangent across the stringer), bent so it meets that station at its printed width and at today's own slope. The printed numbers decide it; there is nothing to set.",
  x: "<b>All three on one nose.</b> Dotted is today, blue is B with the slider's handle length, solid is C. Only the last printed segment differs; everything from that station back is the same curve in all three.",
};

function renderNav() {
  const nav = document.getElementById("variant-nav");
  nav.innerHTML = `<span class="sketch-id">Sketch 012</span>` + VARIANTS.map((v) => `<button class="variant-tab${v.baseline ? " baseline" : ""}${v.winner ? " winner" : ""}${v.id === state.variant ? " active" : ""}" data-variant="${v.id}">${esc(v.label)}</button>`).join("") + `<button class="variant-tab notes-btn" data-notes="1">${document.getElementById("notes-panel").classList.contains("open") ? "Close notes" : "Notes"}</button>`;
}
function seg(key, options) {
  return `<span class="seg">${options.map(([v, label]) => `<button data-set="${key}" data-v="${v}" class="${String(state[key]) === String(v) ? "on" : ""}">${label}</button>`).join("")}</span>`;
}
function renderBar() {
  const bar = document.getElementById("sketch-bar");
  const b = state.variant === "b" || state.variant === "x";
  bar.innerHTML = `<span class="desc">A blank printed <b>0 wide at its nose tip</b> — 43 of the 162 in the catalogue — on ROCKER's top view: how should its outline reach the tip?</span>
    <span class="grp"><span>Board</span>${seg("board", [["on", "Show"], ["off", "Hide"]])}</span>
    <span class="grp"><span>Measuring points</span>${seg("points", [["on", "On"], ["off", "Off"]])}</span>
    ${b ? `<span class="grp"><span>B handles</span><input type="range" id="k" min="0.15" max="0.6" step="0.0167" value="${state.k}"><span class="meas"><b>${Math.round(state.k * 100)}%</b> of the chord${Math.abs(state.k - 1 / 3) < 0.01 ? " (⅓, the usual)" : ""}</span>${seg("handles", [["on", "Draw them"], ["off", "Hide"]])}</span>` : ""}`;
  const k = document.getElementById("k");
  if (k) k.addEventListener("input", (e) => { state.k = Number(e.target.value); save(); renderBar(); renderStage(); });
}
function renderStage() {
  const stage = document.getElementById("stage");
  stage.innerHTML = `<p class="intro">${INTROS[state.variant]}</p><div class="grid">${ITEMS.map((item) => cellHtml(item, state.variant)).join("")}</div>
    <p class="stage-note">Every blank is a real catalogue blank through the app's own reader; the two boards are the Mid-length and Longboard presets where ROCKER places them. In the catalogue the last printed width before a 0 nose sits 3" in on Arctic Foam's eight such blanks, 6" in on twenty-one of US Blanks' twenty-three, and 12" in on all twelve of Marko's and on US Blanks' 11'2"C and 11'8"C — one of each span is here. No blank prints a 0-wide tail.</p>`;
}
function renderNotes() {
  document.getElementById("notes-panel").innerHTML = `
    <h2>Sketch 012 — a nose printed 0 wide</h2>
    <p>The founder, 2026-10-07: "For blanks with a 0 N0 value, the nose should have maximum roundness. i.e. the spline control point would be perpendicular to the stringer, so that the spline essentially starts totally perpendicular to the stringer before curving through the next data points."</p>
    <h3>What is drawn</h3>
    <ul>
      <li><b>A (today):</b> the live square-root curve through every printed width, to the 0 at the tip. It meets the stringer at about 57–73° per rail on these five blanks — a point.</li>
      <li><b>B (control point):</b> today's curve up to the last printed station, then one cubic curve to the tip. Its handle at the station lies along today's slope there, so nothing kinks; its handle at the tip points straight across the stringer. Both handles are the slider's share of the chord between the two points; a third is the usual default for a curve like this.</li>
      <li><b>C (parabola):</b> inside the last printed station, half-width = a·√d + b·d, d the distance in from the tip. At the tip that is a parabola with its point on the stringer — the same shape a circle has at its end — and a and b are fixed by two facts: the printed width at the station, and today's slope there. Falls back to today's curve on a blank whose printed widths are more pointed than a straight line to the tip (none in the catalogue is).</li>
    </ul>
    <h3>What to look for</h3>
    <ul>
      <li>Which nose looks like the foam? Arctic's 3" span, US Blanks' 6" and Marko's 12" are all here, and the rule has to look right on all three.</li>
      <li>On B, does one handle share suit all three spans, or does the 12" span want a different one?</li>
      <li>On the Longboard, the board's own nose sits inside the blank's: does the room to the rail read right?</li>
      <li>In the side-by-side view, how far apart are B at ⅓ and C? If they are close, C is the simpler build (no number to pick).</li>
    </ul>
    <h3>If it gets built</h3>
    <ul>
      <li>The width curve lives in <b>lib/geometry</b> and is read by the fit check as well as this drawing: a rounder nose means more foam beside the stringer near the tip, so a board flagged "too wide" within the last printed station could come to fit. Saved boards would redraw. Golden fixtures and tests come with it.</li>
      <li>Only the last printed segment changes, and only when the tip prints 0 and the station before it prints more. Everything from that station back is today's curve, exactly.</li>
      <li>The same rule would apply to a 0-wide tail, though no catalogue blank prints one.</li>
    </ul>`;
}
function renderTools() {
  document.getElementById("t-theme").innerHTML = ["slate", "daylight"].map((t) => `<button data-tool="theme" data-v="${t}" class="${state.theme === t ? "on" : ""}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("");
  document.getElementById("t-mini").innerHTML = ["340", "432", "560"].map((w) => `<button data-tool="mini" data-v="${w}" class="${state.mini === w ? "on" : ""}">${w} px</button>`).join("");
}
function applyTheme() {
  const root = document.documentElement.style;
  for (const [k, v] of Object.entries({ ...COMMON_VARS, ...PALETTES[state.theme] })) root.setProperty(k, v);
  const link = document.getElementById("theme-link"); if (link) link.href = `../themes/app-${state.theme}.css`;
}
function renderAll() { applyTheme(); renderNav(); renderBar(); renderNotes(); renderTools(); renderStage(); }

document.getElementById("variant-nav").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.notes) { document.getElementById("notes-panel").classList.toggle("open"); renderNav(); return; }
  state.variant = b.dataset.variant; save(); renderAll();
});
document.getElementById("sketch-bar").addEventListener("click", (e) => { const b = e.target.closest("[data-set]"); if (!b) return; state[b.dataset.set] = b.dataset.v; save(); renderBar(); renderStage(); });
document.getElementById("sketch-tools").addEventListener("click", (e) => { const b = e.target.closest("[data-tool]"); if (!b) return; state[b.dataset.tool] = b.dataset.v; save(); renderAll(); });
document.getElementById("tools-toggle").onclick = () => document.getElementById("sketch-tools").classList.toggle("open");
renderAll();
</script>
</body>
</html>
