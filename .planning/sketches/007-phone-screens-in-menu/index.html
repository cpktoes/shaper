<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 007 — Screens in the ☰ menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link id="theme-link" rel="stylesheet" href="../themes/app-slate.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--color-page); color: var(--color-text); font-family: var(--font-sans); min-height: 100vh; }
  button { font-family: inherit; }

  /* ---------- sketch chrome (not part of the design) ---------- */
  #variant-nav { position: sticky; top: 0; z-index: 9998; display: flex; gap: 6px; align-items: center; padding: 9px 16px; background: #0d0f14; border-bottom: 1px solid #262a33; font: 13px/1.2 system-ui, sans-serif; color: #cfd5de; flex-wrap: wrap; }
  #variant-nav .sketch-id { font-weight: 700; margin-right: 8px; color: #fff; }
  .variant-tab { background: #1b1f27; color: #cfd5de; border: 1px solid #2c313b; border-radius: 6px; padding: 6px 10px; cursor: pointer; transition: all .15s ease; font: inherit; }
  .variant-tab:hover { border-color: #4b5361; color: #fff; }
  .variant-tab.active { background: #234f66; border-color: #3490bc; color: #fff; }
  .variant-tab.baseline { font-style: italic; }
  #stage { display: flex; gap: 28px; justify-content: center; align-items: flex-start; padding: 22px 16px 90px; flex-wrap: wrap; }
  .notes { width: 290px; font: 14px/1.5 system-ui, sans-serif; color: var(--color-text); }
  .notes h2 { font-size: 15px; margin: 0 0 6px; }
  .notes p { margin: 0 0 10px; color: var(--color-text-muted); }
  .notes .vdesc { border-left: 3px solid var(--color-accent-ink); padding: 6px 10px; background: color-mix(in srgb, var(--color-bg) 70%, transparent); border-radius: 0 6px 6px 0; color: var(--color-text); margin-bottom: 12px; }
  .notes ul { padding-left: 18px; margin: 0 0 10px; color: var(--color-text-muted); }
  .phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .phone-box { position: relative; }
  .phone-box .phone { position: absolute; top: 0; left: 0; transform-origin: top left; }
  @media (max-width: 1000px) { .phone-wrap { order: 0; } .notes { order: 1; } .meter { order: 2; } }
  .phone { position: relative; border-radius: 34px; padding: 11px; background: #050608; box-shadow: 0 22px 50px rgba(0,0,0,.45), inset 0 0 0 2px #2a2e36; }
  .phone-caption { font: 12px system-ui, sans-serif; color: var(--color-text-muted); }
  .meter { width: 250px; font: 13px/1.45 system-ui, sans-serif; color: var(--color-text); }
  .meter h3 { font-size: 13px; margin: 0 0 8px; letter-spacing: .04em; }
  .stack { display: flex; flex-direction: column; border: 1px solid var(--color-border); border-radius: 6px; overflow: hidden; width: 70px; float: left; margin-right: 12px; }
  .stack div { display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--color-text-muted); }
  .seg-top { background: color-mix(in srgb, var(--color-line) 35%, transparent); }
  .seg-draw { background: var(--color-board); }
  .seg-ctl { background: color-mix(in srgb, var(--color-primary) 45%, transparent); }
  .seg-tab { background: color-mix(in srgb, var(--color-warning-ink) 35%, transparent); }
  .meter dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 2px 10px; }
  .meter dt { color: var(--color-text-muted); }
  .meter dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .meter .delta { color: var(--color-accent-ink); font-weight: 700; }
  .meter .taps { clear: both; padding-top: 12px; color: var(--color-text-muted); }
  .meter .taps b { color: var(--color-text); }
  #sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font: 12px system-ui, sans-serif; background: rgba(0,0,0,0.82); color: #fff; padding: 6px 8px; border-radius: 8px; opacity: .7; transition: opacity .2s; display: flex; flex-direction: column; gap: 6px; max-width: 330px; }
  #sketch-tools:hover, #sketch-tools.open { opacity: 1; }
  #sketch-tools:not(.open) .row { display: none; }
  #tools-toggle { align-self: flex-end; }
  #sketch-tools .row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  #sketch-tools button, #sketch-tools select { font: 11px system-ui, sans-serif; background: #22262e; color: #fff; border: 1px solid #3a404b; border-radius: 4px; padding: 3px 6px; cursor: pointer; }
  #sketch-tools button.on { background: #234f66; border-color: #3490bc; }

  /* ---------- the phone page (the design) ---------- */
  .screen { position: relative; overflow: hidden; border-radius: 24px; background: var(--color-bg); display: flex; flex-direction: column; color: var(--color-text); font-family: var(--font-sans); }
  .topbar { height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--color-border); background: var(--color-bg); position: relative; z-index: 25; }
  .wordmark { font-size: 12px; font-weight: 800; letter-spacing: var(--tracking-architectural); color: var(--color-text); white-space: nowrap; cursor: pointer; }
  .title-btn { display: flex; align-items: center; gap: 7px; background: none; border: 0; color: var(--color-text); font-size: 13px; font-weight: 800; letter-spacing: var(--tracking-architectural); padding: 0 8px 0 0; min-height: 44px; cursor: pointer; white-space: nowrap; }
  .title-btn .chev { font-size: 9px; color: var(--color-text-muted); transition: transform .15s; }
  .title-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .cluster { display: flex; align-items: center; gap: 12px; }
  .save { background: var(--color-primary); color: var(--color-on-primary); border: 0; border-radius: 6px; padding: 7px 13px; font-size: 14px; font-weight: 500; cursor: pointer; transition: filter .15s; min-width: 64px; }
  .save:hover { filter: brightness(1.15); }
  .vsep { width: 1px; height: 16px; background: var(--color-border); }
  .burger { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: none; color: var(--color-text-muted); border-radius: 6px; cursor: pointer; margin-right: -8px; transition: color .15s; }
  .burger:hover, .burger[aria-expanded="true"] { color: var(--color-text); }
  .pinned { flex: none; padding: 2px; display: flex; }
  .card { flex: 1; border: 1px solid var(--color-border); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; background: var(--color-bg); position: relative; }
  .card-tabs { display: flex; height: 22px; align-items: stretch; border-bottom: 1px solid var(--color-border); flex: none; }
  .card-tab { font-size: 10px; font-weight: 800; letter-spacing: var(--tracking-architectural); padding: 0 12px; display: flex; align-items: center; color: var(--color-text-muted); border: 0; border-right: 1px solid var(--color-border); background: var(--color-canvas); cursor: pointer; }
  .card-tab.on { color: var(--color-text); background: var(--color-bg); }
  .drawing { flex: 1; min-height: 0; position: relative; }
  .drawing svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .controls { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--color-border); padding: 14px 16px 0; position: relative; }
  .controls.solo { border-top: 0; }
  .ctl-title { font-size: 14px; font-weight: 800; letter-spacing: var(--tracking-architectural); text-transform: uppercase; margin: 0 0 4px; }
  .ctl-sub { font-size: 13px; color: var(--color-text-muted); margin: 0 0 4px; line-height: 1.35; }
  .ctl-section { font-size: 11px; font-weight: 800; letter-spacing: var(--tracking-architectural); text-transform: uppercase; margin: 20px 0 10px; display: flex; justify-content: space-between; color: var(--color-text); }
  .ctl-row { margin: 0 0 14px; }
  .ctl-label { font-size: 13px; display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .ctl-note { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; line-height: 1.35; }
  .ctl-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--color-text-muted); }
  input[type=range] { width: 100%; accent-color: var(--color-accent-ink); height: 26px; margin: 0; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { border: 1px solid var(--color-border); border-radius: 999px; padding: 6px 11px; font-size: 12px; color: var(--color-text-muted); background: none; cursor: pointer; min-height: 34px; transition: all .15s; }
  .pill:hover { color: var(--color-text); }
  .pill.on { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; margin-bottom: 14px; line-height: 1.3; }
  .switch { width: 42px; height: 26px; border-radius: 13px; background: var(--color-well); border: 1px solid var(--color-border); position: relative; cursor: pointer; flex: none; transition: background .15s; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--color-text-muted); transition: all .15s; }
  .switch.on { background: var(--color-primary); }
  .switch.on::after { left: 19px; background: var(--color-on-primary); }
  .blank-card { border: 1px solid var(--color-accent-ink); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .blank-card .bn { display: flex; justify-content: space-between; font-weight: 700; }
  .blank-card .bs { font-size: 12px; color: var(--color-text-muted); }
  .linkish { color: var(--color-accent-ink); font-size: 12px; font-weight: 700; margin-right: 14px; cursor: pointer; }
  .mini-table { width: 100%; font-size: 12px; border-collapse: collapse; margin-bottom: 8px; }
  .mini-table th { text-align: left; font-size: 10px; letter-spacing: .1em; color: var(--color-text-muted); font-weight: 800; padding: 4px 0; text-transform: uppercase; }
  .mini-table th:not(:first-child), .mini-table td:not(:first-child) { text-align: right; }
  .mini-table td { padding: 3px 0; }
  .mini-table td:not(:first-child) { font-weight: 700; }
  .kv { display: flex; justify-content: space-between; font-size: 13px; }
  .field { display: flex; justify-content: space-between; border-bottom: 1px solid var(--color-border); padding: 7px 0; font-size: 13px; }
  .field span:last-child { color: var(--color-text-muted); }
  .cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 6px 0 10px; }
  .cell { border: 1px solid var(--color-border); border-radius: 4px; padding: 4px 6px; font-size: 10px; color: var(--color-text-muted); }
  .cell b { display: block; font-size: 12px; color: var(--color-text); }
  .end-room { height: 64px; }
  .tabbar { height: 56px; flex: none; display: flex; border-top: 1px solid var(--color-border); padding: 0 8px; background: var(--color-bg); }
  .tab { flex: 1; min-width: fit-content; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--color-text-muted); border: 0; border-top: 2px solid transparent; cursor: pointer; padding: 0 2px; background: none; transition: color .15s; }
  .tab:hover { color: var(--color-text); }
  .tab.on { color: var(--color-text); border-top-color: var(--color-primary); }
  .undo-pair { position: absolute; right: 16px; display: flex; gap: 8px; z-index: 15; transition: bottom .2s, opacity .2s; }
  .undo-pair button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); box-shadow: var(--shadow-lg); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 90px; background: var(--color-text); color: var(--color-bg); font-size: 12px; padding: 6px 12px; border-radius: 999px; z-index: 40; animation: pop .15s ease-out; white-space: nowrap; }
  .scrim { position: absolute; inset: 48px 0 0 0; z-index: 20; }
  .scrim.dim { background: rgba(0,0,0,.35); }
  .popup { position: absolute; top: 56px; right: 8px; width: 264px; max-height: calc(100% - 64px); overflow-y: auto; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 30; animation: pop .1s ease-out; transform-origin: top right; }
  .popup.left { right: auto; left: 8px; transform-origin: top left; }
  @keyframes pop { from { transform: scale(.97); } to { transform: scale(1); } }
  .mrow { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 8px; border-radius: 6px; font-size: 14px; color: var(--color-text); cursor: pointer; transition: background .1s; }
  .mrow:hover { background: var(--color-well); }
  .mrow.screen-row { font-size: 12px; font-weight: 700; letter-spacing: var(--tracking-architectural); }
  .mrow .sub { display: block; font-size: 11px; font-weight: 400; letter-spacing: 0; color: var(--color-text-muted); margin-top: 1px; }
  .mrow .tick { margin-left: auto; color: var(--color-accent-ink); font-weight: 800; }
  .mrow .ico { width: 18px; text-align: center; color: var(--color-text-muted); }
  .mdiv { border-top: 1px solid var(--color-border); margin: 6px 8px; }
  .mhead { font-size: 10px; font-weight: 800; letter-spacing: var(--tracking-architectural); color: var(--color-text-muted); padding: 8px 8px 2px; text-transform: uppercase; }
  .signin { background: var(--color-primary); color: var(--color-on-primary); border: 0; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .sheet { position: absolute; left: 0; right: 0; top: 48px; bottom: 0; background: var(--color-surface); z-index: 30; overflow-y: auto; padding: 12px 12px 16px; animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateY(-8px); } to { transform: none; } }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .tile { border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; background: var(--color-bg); color: var(--color-text); transition: all .15s; min-height: 96px; position: relative; }
  .tile:hover { border-color: var(--color-line); }
  .tile.on { border-color: var(--color-accent-ink); box-shadow: inset 0 0 0 1px var(--color-accent-ink); }
  .tile.on::after { content: "✓"; position: absolute; top: 4px; right: 7px; font-size: 11px; color: var(--color-accent-ink); font-weight: 800; }
  .tile svg { width: 46px; height: 40px; }
  .tile.real { padding: 8px 4px 7px; }
  .tile.real svg { width: 100%; height: 46px; overflow: visible; }
  .tile .tnum { font-size: 22px; font-weight: 800; line-height: 46px; height: 46px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .tile .tnum small { font-size: 13px; font-weight: 700; margin-left: 2px; color: var(--color-text-muted); }
  .d-boardfill { fill: var(--color-board); }
  .d-ink2 { fill: none; stroke: var(--color-text); stroke-width: 1.3; }
  .d-finline { stroke: var(--color-accent-ink); stroke-width: 2.6; stroke-linecap: round; }
  .d-blank { fill: color-mix(in srgb, var(--color-line) 22%, transparent); stroke: color-mix(in srgb, var(--color-line) 70%, transparent); stroke-width: 1; }
  .d-sheet { fill: var(--color-bg); stroke: var(--color-line); stroke-width: 1; }
  .d-rule { stroke: var(--color-text-muted); stroke-width: 1.2; stroke-linecap: round; }
  .tile .tl { font-size: 11px; font-weight: 800; letter-spacing: .12em; }
  .tile .ts { font-size: 10px; color: var(--color-text-muted); text-align: center; line-height: 1.2; }
  .sheet .rows { border-top: 1px solid var(--color-border); padding-top: 6px; }
  .nav-block { margin: 22px 0 0; }
  .next-btn { width: 100%; min-height: 48px; border-radius: 8px; border: 0; background: var(--color-primary); color: var(--color-on-primary); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: filter .15s; padding: 6px 12px; }
  .next-btn:hover { filter: brightness(1.15); }
  .next-btn .lead { font-weight: 500; opacity: .85; }
  .back-btn { width: 100%; min-height: 48px; border-radius: 8px; border: 1px solid var(--color-border); background: none; color: var(--color-text); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: border-color .15s; padding: 6px 10px; }
  .back-btn:hover { border-color: var(--color-line); }
  .pair { display: flex; gap: 8px; }
  .pair > * { flex: 1; }
  .pair .back-btn { flex: 0.8; }
  .steps { display: flex; gap: 4px; margin-bottom: 10px; }
  .step { flex: 1; text-align: center; font-size: 9px; font-weight: 800; letter-spacing: .06em; color: var(--color-text-muted); cursor: pointer; padding: 6px 0 2px; border: 0; border-top: 3px solid var(--color-border); background: none; }
  .step.past { border-top-color: var(--color-line); }
  .step.on { color: var(--color-text); border-top-color: var(--color-accent-ink); }
  .step-caption { font-size: 12px; color: var(--color-text-muted); text-align: center; margin: 0 0 10px; }
  .last-note { font-size: 12px; color: var(--color-text-muted); text-align: center; padding: 6px 0; }

  /* drawing ink */
  .d-board { fill: var(--color-board); stroke: var(--color-text); stroke-width: 1.4; }
  .d-ink { stroke: var(--color-text); fill: none; stroke-width: 1.2; }
  .d-faint { stroke: var(--color-line); fill: none; stroke-width: 1; stroke-dasharray: 3 3; }
  .d-lead { stroke: var(--color-line); fill: none; stroke-width: .8; }
  .d-chip { fill: var(--color-bg); stroke: var(--color-border); }
  .d-cap { fill: var(--color-text-muted); font-size: 8px; letter-spacing: .06em; font-family: var(--font-sans); }
  .d-val { fill: var(--color-text); font-size: 10px; font-weight: 700; font-family: var(--font-sans); }
  .d-big { fill: var(--color-text); font-weight: 800; font-family: var(--font-sans); }
  .d-accent { stroke: var(--color-accent-ink); fill: none; stroke-width: 1.4; }
  .d-fin { fill: var(--color-accent-ink); opacity: .85; }

  /* annotation mode */
  .annot .topbar, .annot .pinned, .annot .controls, .annot .tabbar { outline: 1px dashed #ff9670; outline-offset: -1px; }
  .annot-tag { position: absolute; right: 6px; z-index: 50; font: 10px/1 system-ui, sans-serif; background: #ff9670; color: #12141a; padding: 2px 5px; border-radius: 3px; pointer-events: none; }
</style>
</head>
<body>
<div id="variant-nav"></div>
<main id="stage">
  <section class="notes" id="notes"></section>
  <div class="phone-wrap">
    <div class="phone-box" id="phone-box"><div class="phone" id="phone"><div class="screen" id="screen"></div></div></div>
    <div class="phone-caption" id="caption"></div>
  </div>
  <aside class="meter" id="meter"></aside>
</main>
<div id="sketch-tools">
  <button id="tools-toggle" type="button">⚙ Sketch tools</button>
  <div class="row">Theme
    <select id="theme-switcher">
      <option value="app-slate">Dark (slate)</option>
      <option value="app-daylight">Light (daylight)</option>
    </select>
  </div>
  <div class="row" id="vp-row">Phone</div>
  <div class="row" id="space-row">Freed space goes to</div>
  <div class="row" id="board-row">Board</div>
  <div class="row" id="extra-row"></div>
</div>
<script>
const SKETCH = {
  "id": "007",
  "question": "With no tab bar at the bottom, how does an upright phone show which screen you're on and take you to another?",
  "intro": "Round 2 (the founder liked the tiles, but the pictures must look real): C1 and C2 below. — Today an upright phone carries the six screens in a 56-dot tab bar along the bottom. These three looks move them into the ☰ menu instead — the way a phone held sideways already works — and give the freed height to the controls (or to the drawing: switch it in the toolbar, bottom right).",
  "lookFor": [
    "How much more of the controls you can see without scrolling (the numbers on the right).",
    "Whether you can still tell which screen you're on at a glance.",
    "How changing screens feels: today's one tap against two.",
    "Where the Undo and Redo pair lands once the tab bar is gone (move a slider).",
    "Round 2: open ☰ on C1 and C2. Do the tiles read as the real thing at a glance? Switch Board (sketch tools) on C1."
  ],
  "variants": [
    {
      "id": "today",
      "label": "Today (for comparison)",
      "baseline": true,
      "chrome": "today",
      "desc": "The six-screen tab bar along the bottom — one tap to any screen, but it takes 56 dots of height from the controls."
    },
    {
      "id": "a",
      "label": "A · Straight move",
      "chrome": "menuList",
      "desc": "The tab bar goes; ☰ lists the six screens first, with a tick on the current one — the same menu a phone held sideways shows today. The least work to build."
    },
    {
      "id": "b",
      "label": "B · Screen name in the top bar",
      "chrome": "titleDropdown",
      "desc": "On the design screens the wordmark gives way to the current screen's name (ROCKER ▾). Tap it for the six screens; ☰ keeps Home, Contact, the settings and your account."
    },
    {
      "id": "c",
      "label": "C · Screen tiles",
      "chrome": "tileSheet",
      "desc": "☰ opens a sheet with the six screens as big tiles with little pictures, the current one ticked, and the rest of the menu underneath. (Round 1 — rough pictures.)"
    },
    {
      "id": "c1",
      "label": "C1 · Tiles from your board",
      "winner": true,
      "chrome": "tileSheetLive",
      "desc": "Round 2. Each tile is that screen's own drawing of the board you're designing, labels left out — its outline, its side profile in its blank, its center rail, its real litres, its fins. Switch Board in the sketch tools: the tiles follow."
    },
    {
      "id": "c2",
      "label": "C2 · Fixed drawings",
      "chrome": "tileSheetFixed",
      "desc": "Round 2. The same realistic drawings whatever the board (a shortboard's), and no numbers anywhere — the Volume tile is a jug and the word Litres."
    }
  ]
};

}
function renderMeter(L) {
  const v = V(), total = L.vp.h, sc = 300 / total;
  const seg = (cls, h, label) => (h ? `<div class="${cls}" style="height:${Math.max(2, h * sc)}px">${h >= 40 ? label : ""}</div>` : "");
  const dC = L.ctl - L.base.ctl, dD = L.draw - L.base.draw;
  const delta = (d) => (d ? ` <span class="delta">${d > 0 ? "+" : ""}${d}</span>` : "");
  let taps;
  if (v.chrome === "today") taps = "<b>1 tap</b> on the tab bar.";
  else if (v.chrome === "titleDropdown") taps = "<b>2 taps</b> — the screen name, then the screen.";
  else if (v.chrome.startsWith("tileSheet")) taps = "<b>2 taps</b> — ☰, then a tile.";
  else taps = "<b>2 taps</b> — ☰, then the screen.";
  if (v.next) taps += " The next screen is also <b>1 tap</b> on the button under the last control.";
  document.getElementById("meter").innerHTML = `<h3>WHERE THE HEIGHT GOES</h3><div class="stack">` +
    seg("seg-top", TOP, "bar") + seg("seg-draw", L.draw, "drawing") + seg("seg-ctl", L.ctl, "controls") + seg("seg-tab", L.tab, "tabs") + `</div>` +
    `<dl><dt>Top bar</dt><dd>${TOP}</dd><dt>Drawing</dt><dd>${L.draw}${delta(dD)}</dd><dt>Controls you see</dt><dd>${L.ctl}${delta(dC)}</dd><dt>Tab bar</dt><dd>${L.tab}</dd><dt>Page</dt><dd>${total}</dd></dl>` +
    `<div class="taps">Change screen: ${taps}</div>` +
    `<div class="taps">Numbers are dots on the page, compared with today. A phone with a home-bar strip that runs the app from its home screen saves about 34 more.</div>`;
}
function renderNotes() {
  const v = V();
  document.getElementById("notes").innerHTML = `<h2>${SKETCH.question}</h2><p>${SKETCH.intro}</p>` +
    `<div class="vdesc"><b>${v.label}</b><br>${v.desc}</div><h2>What to look for</h2><ul>${SKETCH.lookFor.map((x) => `<li>${x}</li>`).join("")}</ul>` +
    `<p>Try it: tap ☰, change screens, move a slider (Undo/Redo appears), and switch phones in the toolbar.</p>`;
}
function renderNav() {
  const nav = document.getElementById("variant-nav");
  nav.innerHTML = `<span class="sketch-id">Sketch ${SKETCH.id}</span>` + SKETCH.variants.map((v) =>
    `<button class="variant-tab ${v.id === state.variant ? "active" : ""} ${v.baseline ? "baseline" : ""}" data-variant="${v.id}">${v.label}${v.winner ? " ★ Selected" : ""}</button>`).join("");
}

/* ---------------- interaction ---------------- */
function flash(msg) { state.toast = msg; render(); clearTimeout(flash.t); flash.t = setTimeout(() => { state.toast = null; render(); }, 1300); }
document.getElementById("variant-nav").addEventListener("click", (e) => {
  const b = e.target.closest("[data-variant]"); if (!b) return;
  state.variant = b.dataset.variant; state.menu = null; render();
});
document.getElementById("screen").addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "menu") state.menu = state.menu === "burger" ? null : "burger";
  else if (act === "title") state.menu = state.menu === "title" ? null : "title";
  else if (act === "close") state.menu = null;
  else if (act === "go") {
    const was = state.screen; state.screen = a.dataset.screen; state.menu = null; lastScrollKey = null;
    if (was === state.screen) { render(); return; }
  }
  else if (act === "pill") { state.values[a.dataset.id] = a.dataset.value; state.edited = true; }
  else if (act === "switch") { state.values[a.dataset.id] = !(state.values[a.dataset.id] ?? a.classList.contains("on")); state.edited = true; }
  else if (act === "cardTab") state.cardTab = a.dataset.value;
  else if (act === "units") { state.units = a.dataset.value; }
  else if (act === "themeRow") {
    state.themeRow = a.dataset.value;
    if (a.dataset.value !== "System") setTheme(a.dataset.value === "Light" ? "app-daylight" : "app-slate");
  }
  else if (act === "save") {
    state.save = "Saving…"; render();
    setTimeout(() => { state.save = "Saved"; render(); setTimeout(() => { state.save = "Save"; render(); }, 1400); }, 700);
    return;
  }
  else if (act === "toast") { state.menu = null; flash(a.dataset.msg); return; }
  render();
});
document.getElementById("screen").addEventListener("input", (e) => {
  const id = e.target.dataset.slider; if (!id) return;
  const c = CONTROLS[state.screen].find((x) => x.id === id);
  state.values[id] = Number(e.target.value);
  const lab = document.querySelector(`[data-label="${id}"]`); if (lab) lab.textContent = `${c.label} — ${fmt(c, state.values[id])}`;
  if (!state.edited) { state.edited = true; render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.menu) { state.menu = null; render(); } });
function setTheme(name) {
  document.getElementById("theme-link").href = `../themes/${name}.css`;
  applyPalette(name);
  document.getElementById("theme-switcher").value = name;
}
document.getElementById("theme-switcher").addEventListener("change", (e) => setTheme(e.target.value));

/* toolbar */
const vpRow = document.getElementById("vp-row");
for (const [k, vp] of Object.entries(VIEWPORTS)) {
  const b = document.createElement("button"); b.textContent = `${vp.w}×${vp.h}`; b.dataset.vp = k;
  b.onclick = () => { state.vp = k; syncTools(); render(); }; vpRow.appendChild(b);
}
const spaceRow = document.getElementById("space-row");
for (const k of ["controls", "drawing"]) {
  const b = document.createElement("button"); b.textContent = k; b.dataset.space = k;
  b.onclick = () => { state.spaceTo = k; syncTools(); render(); }; spaceRow.appendChild(b);
}
const boardRow = document.getElementById("board-row");
for (const k of Object.keys(ART)) {
  const b = document.createElement("button"); b.textContent = ART[k].name; b.dataset.board = k;
  b.onclick = () => { state.board = k; state.menu = V().chrome.startsWith("tileSheet") ? "burger" : state.menu; syncTools(); render(); };
  boardRow.appendChild(b);
}
const extra = document.getElementById("extra-row");
const annBtn = document.createElement("button"); annBtn.textContent = "Show heights";
annBtn.onclick = () => { state.annotate = !state.annotate; syncTools(); render(); }; extra.appendChild(annBtn);
const endBtn = document.createElement("button"); endBtn.textContent = "Scroll controls to the end";
endBtn.onclick = () => { const c = document.querySelector("#screen .controls"); if (c) c.scrollTo({ top: c.scrollHeight, behavior: "smooth" }); }; extra.appendChild(endBtn);
const resetBtn = document.createElement("button"); resetBtn.textContent = "Reset edits";
resetBtn.onclick = () => { state.values = {}; state.edited = false; render(); }; extra.appendChild(resetBtn);
function syncTools() {
  vpRow.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.vp === state.vp));
  spaceRow.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.space === state.spaceTo));
  annBtn.classList.toggle("on", state.annotate);
  boardRow.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.board === state.board));
}
document.getElementById("tools-toggle").onclick = () => document.getElementById("sketch-tools").classList.toggle("open");
applyPalette("app-slate");
syncTools();
render();
</script>
</body>
</html>
