<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketch 023 — Bottom: the side profile at the stringer and at the rail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== the app's four palettes, copied from app/globals.css (--ramp-*) on 2026-11-06 ===== */
.theme-daylight { --ground:#ffffff; --sidebar:#ffffff; --canvas:#dfdcd3; --tab-active:#ffffff; --panel:#ffffff; --well:#dfdcd3;
  --ink:#1f2a3b; --muted:#566171; --line:#897c58; --faint:#897c58; --accent:#8ec1b8; --on-accent:#1f2a3b; --accent-ink:#48605c; --fill:#d9f2ed; color-scheme:light; }
.theme-chalk { --ground:#ffffff; --sidebar:#ffffff; --canvas:#dfdcd3; --tab-active:#ffffff; --panel:#ffffff; --well:#dfdcd3;
  --ink:#1f2a3b; --muted:#566171; --line:#897c58; --faint:#897c58; --accent:#3490bc; --on-accent:#090e16; --accent-ink:#2b424c; --fill:#d8ebf2; color-scheme:light; }
.theme-slate { --ground:#12141a; --sidebar:#12141a; --canvas:#1a1d25; --tab-active:#12141a; --panel:#12141a; --well:#1b1f26;
  --ink:#f2f4f7; --muted:#a1a8b4; --line:#6a707c; --faint:#333842; --accent:#18526d; --on-accent:#f2f4f7; --accent-ink:#3490bc; --fill:#1a2732; color-scheme:dark; }
.theme-phosphor { --ground:#050805; --sidebar:#050805; --canvas:#142414; --tab-active:#050805; --panel:#050805; --well:#050805;
  --ink:#26d026; --muted:#2ca62c; --line:#3e783e; --faint:#3e783e; --accent:#2ca62c; --on-accent:#050805; --accent-ink:#52ab52; --fill:#142414; color-scheme:dark; }
/* derived, as app/globals.css derives them: faint construction ink, the widepoint's line, the foam shade */
#app { --station: color-mix(in srgb, var(--muted) 36%, transparent); --widepoint: color-mix(in srgb, var(--accent-ink) 45%, transparent);
  --pencil: color-mix(in srgb, var(--muted) 78%, transparent); --ghost: color-mix(in srgb, var(--muted) 60%, transparent); }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: #c9c5ba; font-family: Inter, Roboto, system-ui, sans-serif; }

/* ---- sketch chrome (not part of the design) ---- */
#bar { flex: none; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 16px;
  padding-top: max(8px, env(safe-area-inset-top)); background: #0d0f14; color: #cfd5de; font: 13px/1.2 system-ui, sans-serif; border-bottom: 1px solid #262a33; }
#bar b { color: #fff; margin-right: 4px; }
.grp { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.grp > span { color: #8a93a3; margin-right: 2px; }
#bar button { font: inherit; color: #cfd5de; background: #1b1f28; border: 1px solid #333a47; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
#bar button.on { background: #3490bc; border-color: #3490bc; color: #fff; }
#note { flex: none; font: 12.5px/1.45 system-ui, sans-serif; color: #cfd5de; background: #15181f; padding: 6px 16px; border-bottom: 1px solid #262a33; }
#note b { color: #fff; }
#stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: stretch; }
#stage.framed { align-items: flex-start; padding: 16px; overflow: auto; }
#stage.framed #app { width: 390px; height: 760px; flex: none; border: 10px solid #1a1c22; border-radius: 28px; overflow: hidden; --pin: 502px; }
/* a bare page for the phone pictures and the measurements: the sketch bar hidden, so the phone is the whole screen */
body.bare #bar, body.bare #note { display: none !important; }

/* ===== the page ===== */
#app { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--ground); color: var(--ink);
  font-family: Inter, Roboto, system-ui, sans-serif; font-size: 14px; line-height: 1.4; }
.caps { font-weight: 800; text-transform: uppercase; letter-spacing: .15em; }

/* the computer's top row */
.nav { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 40px; padding: 24px; border-bottom: 1px solid var(--faint); background: var(--ground); }
.nav .mark { width: 10.96rem; min-width: 6.26rem; color: var(--ink); }
.nav .mark svg { display: block; width: 100%; height: auto; }
.nav .links { display: flex; align-items: center; gap: 16px; }
.nav .links a { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; color: var(--muted); text-decoration: none; padding-bottom: 2px; border-bottom: 2px solid transparent; white-space: nowrap; }
.nav .links a.on { color: var(--ink); border-bottom-color: var(--accent); }
.nav .links .sep { width: 1px; height: 16px; background: var(--faint); margin: 0 4px; }
.pill { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 9999px; padding: 5px 14px; cursor: pointer; }
.iconbtn { width: 28px; height: 28px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); display: inline-grid; place-items: center; cursor: pointer; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--well); border: 1px solid var(--line); }

/* the phone's compact bar */
.topbar { display: none; flex: none; height: 48px; align-items: center; justify-content: space-between; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); border-bottom: 1px solid var(--faint); background: var(--ground); }
.topbar .mark { width: 120px; color: var(--ink); }
.topbar .mark svg { display: block; width: 100%; height: auto; }
.topbar .right { display: flex; align-items: center; gap: 12px; }
.topbar .sep { width: 1px; height: 16px; background: var(--faint); }
.hamb { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--ink); cursor: pointer; margin-right: -12px; }

.shell { flex: 1; min-height: 0; display: flex; }
.side { width: 340px; flex: none; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--faint); background: var(--sidebar); }
.side .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 40px; }
.main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--canvas); padding: 12px; }

/* ---- the sidebar's dress (RAILS' own) ---- */
.title { font-size: 18px; line-height: 1.2; font-weight: 800; text-transform: uppercase; letter-spacing: .15em; color: var(--ink); }
.sub { margin-top: 2px; font-size: 14px; color: var(--muted); }
.ruled { margin-top: 22px; padding-bottom: 8px; border-bottom: 1px solid var(--faint); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .15em; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ruled .cutname { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 12px; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subhead { margin-top: 10px; padding-top: 12px; border-top: 1px dashed var(--faint); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .15em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.subhead .cutname { font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 12px; }
.group { display: flex; flex-direction: column; gap: 14px; padding-top: 12px; }
.lbl { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.hints { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 2px; }
.flatnote { font-size: 13px; color: var(--muted); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; min-height: 24px; }
.check input { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 0; border-radius: 4px; border: 1px solid var(--line); display: inline-grid; place-items: center; cursor: pointer; background: transparent; flex: none; }
.check input:checked { background: var(--accent); border-color: var(--accent); }
.check input:checked::after { content: ""; width: 8px; height: 4px; border-left: 2px solid var(--on-accent); border-bottom: 2px solid var(--on-accent); transform: translateY(-1px) rotate(-45deg); }
.selwrap { position: relative; }
.selwrap select { font: inherit; font-size: 14px; width: 100%; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 32px 8px 10px; appearance: none; -webkit-appearance: none; cursor: pointer; }
.selwrap::after { content: ""; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.selwrap select:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* the app's slider: accent fill, ink-ringed 6px track, accent dot with an ink ring */
input.rng { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; border: 1px solid var(--ink); margin: 6px 0; display: block;
  background: linear-gradient(to right, var(--accent) 0 var(--p, 50%), transparent var(--p, 50%) 100%); cursor: pointer; }
input.rng.fill-end { background: linear-gradient(to right, transparent 0 var(--p, 50%), var(--accent) var(--p, 50%) 100%); }
input.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 1px solid var(--ink); }
input.rng::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 1px solid var(--ink); }
input.rng:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; }
@media (pointer: coarse) { input.rng::-webkit-slider-thumb { width: 22px; height: 22px; } input.rng { margin: 11px 0; } }

/* the imported-dimensions card (sketch 017 C) and the readout figures it set the style for */
.rcard { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 11px; }
.rcard .cap { font-size: 10px; line-height: 1.2; font-weight: 800; text-transform: uppercase; letter-spacing: .15em; color: var(--accent-ink); }
.figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 10px; margin-top: 8px; }
.fig { display: flex; flex-direction: column-reverse; justify-content: flex-end; min-width: 0; }
.fig dt { margin-top: 2px; font-size: 10px; line-height: 1.2; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.fig dd { margin: 0; font-size: 18px; line-height: 1.15; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
.rcard .footline { margin-top: 8px; border-top: 1px solid var(--faint); padding-top: 7px; font-size: 12px; color: var(--muted); }

.stepnav { display: flex; gap: 8px; margin-top: 24px; }
.stepnav a { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--ink); text-decoration: none; }
.stepnav a:first-child { flex: .8; }
.footer { margin-top: 20px; font-size: 11px; color: var(--muted); }
.side .scroll::after { content: ""; display: block; height: 0; }

/* ---- the tabbed panel (components/viewer/tabbed-panel.tsx) ---- */
.strip { flex: none; display: flex; align-items: flex-end; gap: 6px; }
.tabs { display: flex; gap: 6px; }
.tab { font: inherit; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; padding: 6px 18px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; position: relative; }
.tab.on { border-color: var(--line); background: var(--tab-active); color: var(--ink); }
.boardname { margin-left: auto; min-width: 0; align-self: center; font-size: 12px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px 4px; }
.folder { flex: 1; min-height: 0; margin-top: -1px; border: 1px solid var(--line); border-radius: 0 8px 8px 8px; background: var(--tab-active); padding: 12px; display: flex; }
.inner { flex: 1; min-height: 0; min-width: 0; background: var(--panel); border: 1px solid var(--faint); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; }
.inner.text { overflow: auto; }

/* the phone's NOSE / CENTER / TAIL switch (RAILS' own row, copied) */
.secrow { display: none; flex: none; gap: 6px; padding-top: 11px; }
.secrow .tab { padding: 2px 8px; }

.views { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; }
.view { min-height: 0; display: flex; flex-direction: column; }
.view.top { flex: 1.25; }
.view.sec { flex: 1; }
.view.profile { flex: 1.25; }
/* the variants' weights: A stacks three drawings, B's SIDE VIEW tab draws the side large over a small section, C swaps */
.views.vA .view.top { flex: 1; } .views.vA .view.profile { flex: 1.15; } .views.vA .view.sec { flex: 0.95; }
.views.vBside .view.profile { flex: 2.3; } .views.vBside .view.sec { flex: 1; }
.view h3 .right { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
/* the side view's key and its facts line, the Board file preview's own words and swatches */
.sidekey { flex: none; display: flex; flex-wrap: wrap; gap: 2px 16px; padding-top: 4px; font-size: 12px; color: var(--muted); }
.sidekey span { display: inline-flex; align-items: center; gap: 6px; }
.sidekey svg { flex: none; }
.sidefacts { flex: none; padding-top: 2px; font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }
/* C: FROM BELOW / FROM THE SIDE, the viewer toolbar's dress — bordered ground at rest, accent filled when pressed */
.vtog { display: inline-flex; gap: 6px; flex: none; }
.vtog button { position: relative; font: inherit; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); background: var(--ground);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
.vtog button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.vtog button:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
.vtog .short { display: none; }
@media (pointer: coarse) { .vtog button::before { content: ""; position: absolute; inset: -10px -2px; } }
.tab .short { display: none; }
.view h3 { margin: 0; flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
.view h3 .v { text-transform: none; letter-spacing: 0; font-weight: 500; }
.view svg { flex: 1; min-height: 0; width: 100%; display: block; overflow: visible; }
.chips { display: inline-flex; gap: 2px; }
.chips button { font: inherit; font-size: 10px; font-weight: 700; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 1px 6px; cursor: pointer; letter-spacing: .05em; }
.chips button.on { color: var(--ink); border-color: var(--line); }
.strow { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 2px 0; font-size: 12px; color: var(--muted); }
.strow .lbl { margin: 0; font-size: 12px; flex: none; white-space: nowrap; }
.strow input.rng { margin: 0; flex: 1; }
.footline { font-size: 11px; color: var(--muted); }

/* DATA */
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: right; font-weight: 800; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--faint); white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; color: var(--ink); position: sticky; left: 0; background: var(--panel); }
table.data td { text-align: right; padding: 6px 8px; color: var(--muted); border-bottom: 1px solid var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data tr.fin td, table.data tr.wide td { color: var(--ink); }
.datahead { margin: 18px 0 6px; font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
.datahead:first-child { margin-top: 0; }
.datanotes { margin-top: 12px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.datanotes p { margin: 4px 0; }

/* GUIDE: one card per cut — its cartoon (drawn by the VIEWER's own code), its name, a sentence on what it is and one on what it does */
.guidenote { font-size: 12px; color: var(--muted); line-height: 1.5; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 10px; margin-bottom: 6px; }
.card { min-width: 0; border: 1px solid var(--faint); border-radius: 10px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.card.on { border-color: var(--line); }
.card h4 { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 700; color: var(--ink); }
.card h4 .now { flex: none; font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-ink); }
.card svg { display: block; width: 100%; height: auto; overflow: visible; }
.card svg path, .card svg line { vector-effect: non-scaling-stroke; }
.card p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
.card p b { font-weight: 600; color: var(--ink); }
.card p.how { margin-top: 2px; padding-top: 6px; border-top: 1px dashed var(--faint); font-size: 12px; line-height: 1.45; }
.card p.how .cap { display: block; margin-bottom: 1px; font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-ink); }

/* drawing strokes — one ink, one dash per role, as the app's viewers draw them. Widths, dashes and type are
   written by the drawing code in screen pixels (every picture scales to its box, the lines and words must not). */
.board { fill: var(--fill); stroke: var(--ink); }
.stringer { stroke: var(--station); fill: none; }
.station { stroke: var(--station); fill: none; }
.widepoint { stroke: var(--widepoint); fill: none; }
.deepline { stroke: var(--station); fill: none; }
.pencil { stroke: var(--pencil); fill: none; }
.pencil.live { stroke: var(--ink); }
.iso { stroke: var(--station); fill: none; }
.shade { fill: var(--muted); }
.cutline { stroke: var(--ink); fill: none; }
.grab { fill: var(--accent); stroke: var(--ink); cursor: ew-resize; }
.grabzone { fill: transparent; cursor: ew-resize; }
.tick { stroke: var(--muted); }
.lab { font-family: Inter, Roboto, system-ui, sans-serif; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; fill: var(--muted); }
.val { font-family: Inter, Roboto, system-ui, sans-serif; font-weight: 500; fill: var(--ink); font-variant-numeric: tabular-nums; }
.val.muted { fill: var(--muted); }
.straight { stroke: var(--ink); fill: none; }
.ghost { stroke: var(--ghost); fill: none; }
.railline { stroke: var(--muted); fill: none; }
.dim { stroke: var(--ink); fill: none; }
.ext { stroke: var(--station); fill: none; }
.brk { stroke: var(--ink); fill: none; }
.ruler { stroke: var(--ink); fill: none; }

/* the sketch bar on a narrow screen: smaller, and the note folds behind ⓘ */
@media (max-width: 819.98px) {
  #bar { font-size: 12px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; gap: 10px; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top)); scrollbar-width: none; }
  #bar::-webkit-scrollbar { display: none; }
  #bar b, #bar .grp { flex: none; flex-wrap: nowrap; white-space: nowrap; }
  #bar button { padding: 3px 7px; }
  #note { display: none; }
  #note.open { display: block; }
  #noteBtn { display: inline-block; }
}
#noteBtn { display: none; }

/* ===== the phone (width < 820, or the sketch bar's Phone frame): drawing pinned above, controls beneath.
   Written once against #app.phone; build.py copies the block under @media (max-width: 819.98px) with the plain
   #app selector, so the real rule is width alone — the app's own switch — and the class is only the sketch bar's frame. ===== */
/* PHONE-START */
#app.phone .nav { display: none; }
#app.phone .topbar { display: flex; }
#app.phone .shell { flex-direction: column; }
#app.phone .main { order: -1; flex: none; height: var(--pin, 66dvh); padding: 2px max(2px, env(safe-area-inset-right)) 2px 2px; }
#app.phone .vtog .long, #app.phone .tab .long { display: none; }
#app.phone .vtog .short, #app.phone .tab .short { display: inline; }
#app.phone .vtog { margin-left: auto; align-self: center; }
#app.phone .vtog button { padding: 2px 7px; }
#app.phone .sidekey { font-size: 11px; gap: 0 12px; padding-top: 2px; }
#app.phone .sidefacts { font-size: 11px; padding-top: 1px; }
#app.phone .view.profile h3 .capB { display: none; }
#app.phone .view.top { flex: 1.05; }
#app.phone .view.top h3 { display: none; }
#app.phone .capB { display: none; }
#app.phone #exag .v, #app.phone #sideExag .v { display: none; }
#app.phone .side { width: auto; flex: 1; min-height: 0; border-right: 0; border-top: 1px solid var(--faint); }
#app.phone .side .scroll { padding: 16px; }
#app.phone .side .scroll::after { height: 53px; }
#app.phone .tab { padding: 2px 8px; }
#app.phone .secrow { display: flex; }
#app.phone .folder { padding: 2px; }
#app.phone .inner { padding: 2px 4px 4px; }
#app.phone .inner.text { padding: 8px; }
#app.phone .ruled { margin-top: 14px; }
#app.phone .side .rcard { padding: 8px 10px; }
#app.phone .view h3 { font-size: 10px; }
#app.phone .sidesec { display: none; }
#app.phone .sidesec.shown { display: block; }
#app.phone .strow { font-size: 11px; padding-top: 4px; }
#app.phone .footline { display: none; }
#app.phone .card { padding: 8px 10px 10px; }
@media (max-width: 819.98px) {
#app .nav { display: none; }

/* ============ units — the app's lib/geometry/units.ts rules, ported line for line ============ */
const IN = 25.4;
function fmtInFrac(mmv, den = 16) {
  const inches = mmv / IN; const sign = inches < 0 ? "-" : ""; const nudge = inches < 0 ? -1e-9 : 1e-9;
  const rounded = Math.abs(Math.round(inches * den + nudge) / den);
  let whole = Math.floor(rounded + 1e-9); let f = Math.round((rounded - whole) * den);
  if (f === den) { whole += 1; f = 0; }
  if (f === 0) return `${sign}${whole}"`;
  let n = f, d = den; while (n % 2 === 0) { n /= 2; d /= 2; }
  return `${sign}${whole > 0 ? whole + " " : ""}${n}/${d}"`;
}
function fmtCm(mmv) { const cm = mmv / 10; const nudge = cm < 0 ? -1e-9 : 1e-9; return (Math.round((cm + nudge) * 10) / 10).toFixed(1); }
function fmtMm(mmv) { const nudge = mmv < 0 ? -1e-9 : 1e-9; return String(Math.round(mmv + nudge)); }
function fmtFeetIn(mmv) {
  const inches = mmv / IN; const r = Math.round(inches * 16) / 16; const feet = Math.floor((r + 1e-9) / 12); const rem = r - feet * 12;
  const zero = rem > 0 && rem < 1 ? "0 " : ""; return `${feet}'${zero}${fmtInFrac(rem * IN)}`;
}

      for (const mk of [...marks].sort((p, q) => p.y - q.y)) { const x = xOf(mk.y); const t = markBare(mk.y); const w = t.length * 6.2 * px;
        row = x - w / 2 < lastRight + 4 * px ? (row ? 0 : 1) : 0; if (row === 0) lastRight = x + w / 2;
        out += `<line class="ruler" ${S.line} x1="${x.toFixed(1)}" y1="${(yR - 4 * px).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(yR + 4 * px).toFixed(1)}"/><text class="val" ${S.small} x="${x.toFixed(1)}" y="${(yR + (16 + 11 * row) * px).toFixed(1)}" text-anchor="middle">${svgEsc(t)}</text>`; }
    }
  }
  document.getElementById("sec").innerHTML = out;
  document.getElementById("secCap").textContent = `Section · ${dim(s)} from the tail`;
  document.getElementById("secCapB").textContent = ` · ${dim(2 * Wo)} wide`;
  const sl = document.getElementById("stSlider"); const metricU = metric();
  sl.min = 0; sl.max = metricU ? Math.floor(B.L / 10) * 10 : Math.floor(B.L / IN * 2) / 2; sl.step = metricU ? 10 : 0.5;
  const fromNose = B.L - s; sl.value = metricU ? Math.round(fromNose / 10) * 10 : Math.round(fromNose / IN * 2) / 2;
  sl.style.setProperty("--p", `${(fromNose / B.L) * 100}%`);
  document.getElementById("stLbl").textContent = `Section at`;
}

/* ============ drawing: the side view ============ */
// Nose left, like the bottom view above it. The deck is one line (the blank is square across before the rails are
// shaped); the bottom at the stringer is the board's ink edge; the bottom at the rail is dashed in the muted ink, the
// Board file preview's own line (1.5 wide, dash 3 2), drawn only where it parts from the stringer's. The planed bottom
// is not drawn: wherever only a concave is cut the rail's line IS the planed bottom, and wherever only a vee or belly
// is cut the stringer's is — so a third line would lie on one of the two almost everywhere.
let topK = 0, sideK = 0;
const SIDE_RAIL = (px) => `stroke-width="${sw(px, 1.5)}" stroke-dasharray="${da(px, 3, 2)}"`;
function drawSide() {
  const fit = fitBox("side"); if (!fit) return;
  const { H, px } = fit; const S = strokes(px);
  const L = B.L; const stacked = state.variant === "A";
  const lines = sideLines(); const pts = lines.pts;
  // A shares the bottom view's length scale, so the two drawings' stations stand one above the other
  const k = stacked && topK > 0 ? topK : 900 / L; sideK = k;
  const X = (s) => 500 + (L / 2 - s) * k;
  // B and C carry the bottom view's two rails (the reference stations above, the live cut's marks below); in A the
  // bottom view right above carries them and the side view keeps only the grab point
  const padTop = (stacked ? 6 : 30) * px, padBot = (stacked ? 30 : 46) * px;
  let hMin = Infinity, hMax = -Infinity; for (const q of pts) { hMin = Math.min(hMin, q.stringer, q.rail, q.planed); hMax = Math.max(hMax, q.deck); }
  const room = Math.max(10 * px, H - padTop - padBot);
  // the height is stretched by E — unless that would push the board out of the box, when it is fitted instead (a fit
  // within 2% of E keeps E, and the board takes that sliver of the rails' room)
  const E = state.sideExag; let ky = k * E; if ((hMax - hMin) * ky > room * 1.02) ky = room / (hMax - hMin);
  const shownE = ky / k;
  // the rails and the board stay together as one block, centred in the box, so no tick runs across empty paper
  const block = (hMax - hMin) * ky, spare = Math.max(0, room - block);
  const yBase = padTop + (stacked ? spare / 2 : spare / 2) + block;
  const shift = stacked ? 0 : spare / 2; // B and C: the upper rail rides down with the board, the lower rail up
  const Yv = (h) => yBase - (h - hMin) * ky;
  let out = "";
  // the board between the deck and the bottom along the stringer
  let d = ""; pts.forEach((q, j) => { d += `${j ? "L" : "M"}${X(q.s).toFixed(1)} ${Yv(q.deck).toFixed(1)}`; });
  for (let j = pts.length - 1; j >= 0; j--) d += `L${X(pts[j].s).toFixed(1)} ${Yv(pts[j].stringer).toFixed(1)}`;
  out += `<path class="board" ${S.board} d="${d}Z"/>`;
  // the two reference stations, faint, from the deck to the bottom
  const at = (s) => sideAt(s);
  const ref = (s, cls, st) => { const q = at(s); return `<line class="${cls}" ${st} x1="${X(s).toFixed(1)}" y1="${Yv(q.deck).toFixed(1)}" x2="${X(s).toFixed(1)}" y2="${Yv(Math.min(q.stringer, q.rail)).toFixed(1)}"/>`; };
  out += ref(B.wide, "widepoint", S.widepoint) + ref(B.fin, "station", S.station);
  // the bottom at the rail, before the rails are shaped: dashed, only where it parts from the stringer's line
  if (lines.parts) {
    let r = "", on = false;
    for (let j = 0; j < pts.length; j++) {
      const apart = (q) => q && Math.abs(q.rail - q.stringer) > 0.05;
      const show = apart(pts[j]) || apart(pts[j - 1]) || apart(pts[j + 1]);
      if (show) { r += `${on ? "L" : "M"}${X(pts[j].s).toFixed(1)} ${Yv(pts[j].rail).toFixed(1)}`; on = true; } else on = false;
    }
    out += `<path class="railline" ${SIDE_RAIL(px)} d="${r}"/>`;
  }
  const lowAt = (s) => { const q = at(s); return Yv(Math.min(q.stringer, q.rail)); };
  const yLow = H - padBot + 6 * px - shift;
  if (!stacked) {
    // the upper rail: the wide point and the fins, ticked and named, as the bottom view names them
    const yRail = padTop - 6 * px + shift, textW = (t) => t.length * 6.4 * px;
    const wideName = `Wide point · ${dim(B.wide)}`, finName = `${B.finWord} · ${dim(B.fin)}`;
    const apart = Math.abs(X(B.wide) - X(B.fin)) < (textW(wideName) + textW(finName)) / 2 + 8 * px;
    const tick = (s, name, anchor, x) => `<line class="tick" ${S.line} x1="${X(s).toFixed(1)}" y1="${(Yv(at(s).deck) - 3 * px).toFixed(1)}" x2="${X(s).toFixed(1)}" y2="${(yRail + 3 * px).toFixed(1)}"/><text class="lab" ${S.lab} x="${x.toFixed(1)}" y="${yRail.toFixed(1)}" text-anchor="${anchor}">${svgEsc(name)}</text>`;
    const wideLeft = X(B.wide) < X(B.fin);
    let wideA = "middle", finA = "middle", wideX = X(B.wide), finX = X(B.fin);
    if (apart) { wideA = wideLeft ? "end" : "start"; finA = wideLeft ? "start" : "end"; wideX += wideA === "end" ? -4 * px : 4 * px; finX += finA === "end" ? -4 * px : 4 * px; }
    const finRight = finA === "start" ? finX + textW(finName) : finA === "middle" ? finX + textW(finName) / 2 : finX;
    if (finRight > 1000 - 4 * px) { finA = "end"; finX = 1000 - 4 * px; }
    out += tick(B.wide, wideName, wideA, wideX) + tick(B.fin, finName, finA, finX);
    // the lower rail: the live cut's Start, Deepest and End, as on the bottom view
    const c = cutByKey(state.live);
    if (c && c.kind !== "flat" && c.depth > 0 && !(c.kind === "channels" && c.count < 4)) {
      const from = state.live === "nose" ? (s) => B.L - s : (s) => s;
      out += `<line class="deepline" ${S.deep} x1="${X(c.deep).toFixed(1)}" y1="${Yv(at(c.deep).deck).toFixed(1)}" x2="${X(c.deep).toFixed(1)}" y2="${lowAt(c.deep).toFixed(1)}"/>`;
      const labs = [["Start", c.start], ["Deepest", c.deep], ["End", c.end]].map(([nm, s]) => { const v = dim(from(s)); return { nm, s, x: X(s), v, w: nm.length * 6.4 * px + (v.length + 1) * 6.2 * px, a: "middle", show: true }; }).sort((p, q) => p.x - q.x);
      const span = (l) => l.a === "middle" ? [l.x - l.w / 2, l.x + l.w / 2] : l.a === "end" ? [l.x - 3 * px - l.w, l.x - 3 * px] : [l.x + 3 * px, l.x + 3 * px + l.w];
      for (let q = 0; q < labs.length - 1; q++) { if (span(labs[q])[1] + 6 * px > span(labs[q + 1])[0]) { labs[q].a = "end"; labs[q + 1].a = "start"; } }
      for (let q = 0; q < labs.length - 1; q++) { if (span(labs[q])[1] + 6 * px > span(labs[q + 1])[0]) labs[q + 1].show = false; }
      for (const l of labs) { if (span(l)[1] > 1000 - 2 * px) { l.a = "end"; l.x = 1000 - 2 * px + 3 * px; } if (span(l)[0] < 2 * px) { l.a = "start"; l.x = 2 * px - 3 * px; } }
      for (const l of labs) {
        out += `<line class="tick" ${S.line} x1="${X(l.s).toFixed(1)}" y1="${(lowAt(l.s) + 3 * px).toFixed(1)}" x2="${X(l.s).toFixed(1)}" y2="${(yLow + 2 * px).toFixed(1)}"/>`;
        if (l.show) out += `<text class="lab" ${S.lab} x="${(l.a === "middle" ? l.x : l.a === "end" ? l.x - 3 * px : l.x + 3 * px).toFixed(1)}" y="${(yLow + 13 * px).toFixed(1)}" text-anchor="${l.a}">${l.nm} <tspan class="val muted" ${S.val} style="text-transform:none;letter-spacing:0">${svgEsc(l.v)}</tspan></text>`;
      }
    }
  }
  // the section's cutting line, the drawing convention's dash-dot, with its grab point under the board. In A it comes
  // down out of the bottom view above, so it starts at the drawing's top edge.
  const sx = X(state.station), qs = at(state.station);
  const y1 = stacked ? -4 * px : Yv(qs.deck) - 8 * px, yGrab = stacked ? H - 12 * px : yLow + 30 * px;
  out += `<line class="cutline" ${S.cut} x1="${sx.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${sx.toFixed(1)}" y2="${(stacked ? yGrab - 8 * px : yLow + 2 * px).toFixed(1)}"/>`;
  out += `<circle class="grab" ${S.line} cx="${sx.toFixed(1)}" cy="${yGrab.toFixed(1)}" r="${sw(px, 7)}"/>`;
  out += `<rect class="grabzone" x="${(sx - 22 * px).toFixed(1)}" y="0" width="${sw(px, 44)}" height="${H}"/>`;
  const svg = document.getElementById("side"); svg.innerHTML = out;
  svg.dataset.k = k; svg.dataset.shown = shownE.toFixed(2);
  const heightWord = shownE < 1.01 ? "True height" : `Height ×${Math.abs(shownE - E) < 0.01 ? E : shownE.toFixed(1)}`;
  document.getElementById("sideCap").textContent = `Side view · ${heightWord}`;
  document.getElementById("sideCapB").textContent = stacked ? "" : ` · nose left`;
  // the key under the drawing and the one facts line, in the Board file preview's own words
  const sw24 = (rail) => `<svg width="24" height="6" viewBox="0 0 24 6" aria-hidden="true"><line x1="0" x2="24" y1="3" y2="3" ${rail ? `class="railline" stroke-width="1.5" stroke-dasharray="3 2"` : `stroke="var(--ink)" stroke-width="1.1"`}/></svg>`;
  document.getElementById("sideKey").innerHTML = lines.parts
    ? `<span>${sw24(false)}at the stringer</span><span>${sw24(true)}at the rail, before the rails are shaped</span>`
    : `<span>${sw24(false)}at the stringer and at the rail — the same line on this bottom</span>`;
  document.getElementById("sideFacts").textContent = `${dim(lines.stringerThickness)} at the stringer · ${dim(lines.maxThickness)} side profile max`;
}

/* ============ the readouts and DATA ============ */
// the litres and the stringer, one line at the top of DATA — the viewer keeps its room for the drawings (the founder,
// 2026-11-07: "I don't think we need the 3 readouts. I think the space is better used for visualization.")
function litresLine() {
  const off = litresOff(); const T = thickAt(B.L / 2); const strg = T - foamOff(B.L / 2, 0);
  return `Foam off ${L1(off)} · ${L1(B.litres - off)} now, ${L1(B.litres)} before contours · the stringer finishes ${mark(strg)} at the center, planed ${mark(T)} · contours only take foam away.`;
}
function drawData() {
  const rows = []; const step = 6 * IN;
  for (let s = 0; s < B.L - 1; s += step) rows.push(s); rows.push(B.L);
  const unit = (f) => metric() ? ` <span style="font-weight:500;letter-spacing:0;text-transform:none">${f}</span>` : "";
  const rowCls = (s) => Math.abs(s - B.fin) < 3 * IN ? "fin" : Math.abs(s - B.wide) < 3 * IN ? "wide" : "";
  const label = (s) => s >= B.L - 1 ? "Nose tip" : s === 0 ? "Tail" : dimBare(s);
  let h = `<div class="datanotes" style="margin:0 0 14px"><p>${litresLine()}</p></div><div class="datahead">Depths under a straightedge</div><table class="data"><thead><tr><th>From the tail${unit("cm")}</th><th>Width${unit("cm")}</th><th>Deepest cut${unit("mm")}</th><th>Rail lift${unit("mm")}</th><th>Stringer left${unit("mm")}</th></tr></thead><tbody>`;
  for (const s of rows) { const W = curveAt(s), inner = innerAt(s), T = thickAt(s);
    const deep = deepestAt(s), lift = foamOff(s, W), left = inner > 0.5 || W <= 0.5 ? null : T - foamOff(s, 0);
    h += `<tr class="${rowCls(s)}"><td>${label(s)}</td><td>${W > 0.5 ? dimBare(2 * W) : "—"}</td><td>${deep > 0.25 ? markBare(deep) : "—"}</td><td>${lift > 0.25 ? markBare(lift) : "—"}</td><td>${left === null ? "—" : markBare(left)}</td></tr>`; }
  h += `</tbody></table>`;
  // the layout marks: every edge a shaper rules onto the blank, off the stringer, station by station
  const cols = []; for (const [key, c] of allCuts()) for (const col of markColumns(key, c)) cols.push({ key, col });
  if (cols.length) {
    h += `<div class="datahead">Layout marks · off the stringer${metric() ? " · mm" : ""}</div><table class="data"><thead><tr><th>From the tail${unit("cm")}</th>${cols.map((c) => `<th>${svgEsc(c.col)}</th>`).join("")}</tr></thead><tbody>`;
    for (const s of rows) { const here = new Map(); for (const [key, c] of allCuts()) for (const mk of marksOf(key, c, s)) here.set(key + "|" + mk.col, mk.y);
      h += `<tr class="${rowCls(s)}"><td>${label(s)}</td>${cols.map((c) => { const v = here.get(c.key + "|" + c.col); return `<td>${v === undefined ? "—" : markBare(v)}</td>`; }).join("")}</tr>`; }
    h += `</tbody></table>`;
  }
  h += `<div class="datanotes"><p>Deepest cut is the largest gap under a straightedge laid rail to rail at that station. Rail lift is that gap at the rail. Stringer left is the planed thickness less the cut at the stringer.</p>` +
    (cols.length ? `<p>Layout marks are measured out from the stringer at each station, the way a concave's edge or a channel's walls are ruled onto the blank. The channels abut: the stringer is the first peak, each channel's floor deepens out to its wall, and the top of that wall is the next channel's peak${chOn() && state.ch.longer !== "same" && state.ch.stagger > 0.5 ? `; a wall is ruled only from where its own channel starts — the ${state.ch.longer} pair first, each channel out from it ${dim(state.ch.stagger)} shorter` : ""}.</p>` : "") +
    `<p>Wide point ${dim(B.wide)} and ${B.finWord.toLowerCase()} ${dim(B.fin)} from the tail are the two rows in full ink.</p></div>`;
  document.getElementById("dataPanel").innerHTML = h;
}
function drawInputs() {
  document.getElementById("inputsCard").innerHTML = `<div class="cap">From TEMPLATE &amp; ROCKER</div><dl class="figs"${metric() ? ` style="font-size:15px"` : ""}><div class="fig"><dt>Length</dt><dd${metric() ? ` style="font-size:15px"` : ""}>${len(B.L)}</dd></div><div class="fig"><dt>Width</dt><dd${metric() ? ` style="font-size:15px"` : ""}>${dim(B.widePointWidth)}</dd></div><div class="fig"><dt>Thickness</dt><dd${metric() ? ` style="font-size:15px"` : ""}>${dim(thickAt(B.L / 2))}</dd></div></dl><div class="footline">Thickness is the planed number. The contour comes out of it.</div>`;

  document.getElementById("dataPanel").style.display = state.page === "data" ? "" : "none";
  document.getElementById("guidePanel").style.display = state.page === "guide" ? "" : "none";
  arrange();
  const NOTE = {
    A: "<b>A — a third drawing in VIEWER:</b> bottom view, side view, section. The side and bottom views share one length scale, so the section's line runs straight down through both; drag along either.",
    B: "<b>B — its own SIDE VIEW tab:</b> the side profile drawn large with a small section under it. VIEWER stays as it is.",
    C: "<b>C — swap:</b> FROM BELOW / FROM THE SIDE in VIEWER's corner swaps the top drawing; the section stays beneath either one.",
  };
  document.getElementById("note").innerHTML = `<b>023 — the side profile on BOTTOM.</b> ${NOTE[state.variant]} Ink: the bottom at the stringer. Dashed: the bottom at the rail, before the rails are shaped.`;
}

/* ============ wiring (once) ============ */
document.getElementById("gBoard").innerHTML = BOARDS.map((b) => `<button data-b="${b.key}">${b.name}</button>`).join("");
document.getElementById("bar").addEventListener("click", (e) => {

document.getElementById("secTabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.active = b.dataset.sec; state.live = b.dataset.sec; syncControls(); render(false); });
// which cut a control belongs to: the nearest data-cut (a channel block inside the tail card says "channels")
const cutKeyOf = (el) => { const w = el.closest("[data-cut]"); return w ? w.dataset.cut : el.dataset.sec; };
document.getElementById("sections").addEventListener("input", (e) => {
  const el = e.target; if (!el.matches("input.rng")) return;
  const key = el.dataset.key, ck = el.dataset.cut, c = cutByKey(ck), sp = sliderSpec(key, ck);
  c[key] = sp.fromRaw(+el.value); normalize(c, key); state.active = el.dataset.sec; state.live = ck; syncControls(); render(false);
});
document.getElementById("controls").addEventListener("change", (e) => {
  const el = e.target;
  if (el.matches("select[data-sel]")) { const sk = el.dataset.sel;
    // D-42, as the app's pickCut: a center single still on its opening numbers follows a new tail in or out of a vee
    if (sk === "tail" && state.cuts.center.kind === "single") { const was = makeCut("center", state.cuts.center.name, B, state.cuts.tail.name);
      if (["start", "deep", "end", "depth", "off", "smooth"].every((f) => Math.abs(was[f] - state.cuts.center[f]) < 1e-6)) state.cuts.center = makeCut("center", state.cuts.center.name, B, el.value); }
    state.cuts[sk] = makeCut(sk, el.value, B, sk === "center" ? state.cuts.tail.name : undefined); state.active = sk; state.live = sk; buildControls();
    if (state.cuts[sk].kind !== "flat") state.station = state.cuts[sk].deep; render(false); }
  else if (el.matches("select[data-count]")) { const was = state.ch.count; state.ch.count = +el.value;
    // a width still at one of the three starting widths follows the count (2 1/2" · 1 3/4" · 1 1/4"); a width the shaper set stays
    if ([4, 6, 8].some((n) => Math.abs(state.ch.width - channelWidth(n)) < 0.01)) state.ch.width = channelWidth(state.ch.count);
    state.active = el.dataset.sec; state.live = "channels"; buildControls();
    if (was === 0 && state.ch.count > 0) state.station = state.ch.deep; render(false); }
  else if (el.matches("select[data-run]")) { state.ch.run = el.value; state.live = "channels"; render(false); }
  else if (el.matches("select[data-longer]")) { state.ch.longer = el.value; state.active = el.dataset.sec; state.live = "channels"; buildControls(); render(false); }
  else if (el.matches("select[data-wing]")) { state.wingRule = el.value; render(true); }
  else if (el.dataset.pointed) { state.cuts[el.dataset.pointed].pointed = el.checked; render(false); }
});
document.getElementById("sections").addEventListener("pointerdown", (e) => { const sec = e.target.closest(".sidesec"); if (!sec) return; const ck = cutKeyOf(e.target);
  if (sec.dataset.sec !== state.active || ck !== state.live) { state.active = sec.dataset.sec; state.live = ck; syncControls(); render(false); } });
document.getElementById("stSlider").addEventListener("input", (e) => { const v = +e.target.value; state.station = Math.max(0, Math.min(B.L, B.L - (metric() ? v : v * IN))); render(false); });
// dragging the section line on the bottom view or the side view, or tapping either, moves the section — both are drawn
// nose left about the middle of a 1000-wide picture, k drawing units to the millimetre
for (const [id, kOf] of [["top", () => topK], ["side", () => sideK]]) {
  const svg = document.getElementById(id); let dragging = false;
  const stationAt = (ev) => { const r = svg.getBoundingClientRect(); const vx = (ev.clientX - r.left) * (1000 / r.width);
    return Math.max(0, Math.min(B.L, B.L / 2 - (vx - 500) / kOf())); };
  svg.addEventListener("pointerdown", (ev) => { if (!kOf()) return; dragging = true; svg.setPointerCapture(ev.pointerId); state.station = stationAt(ev); render(false); ev.preventDefault(); });
  svg.addEventListener("pointermove", (ev) => { if (!dragging) return; state.station = stationAt(ev); render(false); });
  const stop = () => { dragging = false; }; svg.addEventListener("pointerup", stop); svg.addEventListener("pointercancel", stop);
}

{
