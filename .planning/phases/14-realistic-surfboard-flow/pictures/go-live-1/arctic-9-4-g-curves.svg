<title>An Arctic board's bottom and thickness, today's curve and the new curve</title>
<desc>A 110 and a quarter inch board on the Arctic Foam 9'4" G blank, centred, 2 1/2 inch centre. The dashed line is today's curve, the solid line the new square-root curve. Rocker and thickness are drawn with the height exaggerated so the difference shows; the largest rocker difference is 0.327 inches at 86 inches from the tail, the largest thickness difference 0.131 inches at 26.5 inches from the tail.</desc>
