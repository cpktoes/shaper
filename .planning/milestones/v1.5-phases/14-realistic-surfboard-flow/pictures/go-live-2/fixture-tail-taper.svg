<svg width="100%" viewBox="0 0 680 330" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The fixture board's tail thickness: the 12 inch blend against the steady taper</title>
<desc>Thickness over the last 32 inches of a 10 foot board on the Arctic Foam 10'9" LB, slid to the tail end. Dashed: the 12 inch blend, which dips to 0.482 inches at 9.5 inches from the tip, under the 0.625 inch tip. Solid: the steady taper from an Automatic start 26 inches in, which never goes under the tip.</desc>
<text class="th" x="56" y="24">Tail thickness, last 32" — dashed: the 12" blend, solid: the steady taper</text>
<text class="ts" x="56" y="42">Height stretched so the difference shows. The blend dips to 0.48" at 9.5" from the tip — thinner than the 0.625" tip itself.</text>
