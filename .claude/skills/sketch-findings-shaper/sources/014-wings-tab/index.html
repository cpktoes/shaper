<script>
const DATA = {"boards":[{"id":"default","name":"Default board","spec":{"lengthIn":72,"widePointWidthIn":19,"widePointOffsetIn":-0.5,"tailRailLength":50,"noseRailLength":50,"noseAngle":55,"noseFullness":25,"tailAngle":60,"tailFullness":50.5,"tail":{"kind":"squash","endWidthIn":4}},"marks":[{"role":"front","side":-1,"offTailIn":10.976786,"lateralIn":-5.94205,"leadingOffTailIn":15.476786,"leadingLateralIn":-5.56705,"baseLengthIn":4.5,"toeIn":0.375},{"role":"front","side":1,"offTailIn":10.976786,"lateralIn":5.94205,"leadingOffTailIn":15.476786,"leadingLateralIn":5.56705,"baseLengthIn":4.5,"toeIn":0.375},{"role":"center","side":0,"offTailIn":3.3125,"lateralIn":0,"leadingOffTailIn":7.8125,"leadingLateralIn":0,"baseLengthIn":4.5,"toeIn":0}],"finSetup":"thruster"},{"id":"shortboard","name":"Shortboard","spec":{"lengthIn":74,"widePointWidthIn":18.75,"widePointOffsetIn":-1,"tailRailLength":50,"noseRailLength":50,"noseAngle":50,"noseFullness":20,"tailAngle":55,"tailFullness":45,"tail":{"kind":"squash","endWidthIn":4}},"marks":[{"role":"front","side":-1,"offTailIn":11,"lateralIn":-5.677054,"leadingOffTailIn":15.5,"leadingLateralIn":-5.427054,"baseLengthIn":4.5,"toeIn":0.25},{"role":"front","side":1,"offTailIn":11,"lateralIn":5.677054,"leadingOffTailIn":15.5,"leadingLateralIn":5.427054,"baseLengthIn":4.5,"toeIn":0.25},{"role":"center","side":0,"offTailIn":3.375,"lateralIn":0,"leadingOffTailIn":7.875,"leadingLateralIn":0,"baseLengthIn":4.5,"toeIn":0}],"finSetup":"thruster"},{"id":"fish","name":"Fish","spec":{"lengthIn":68,"widePointWidthIn":20.25,"widePointOffsetIn":2,"tailRailLength":40,"noseRailLength":59.25,"noseAngle":70,"noseFullness":48,"tailAngle":30,"tailFullness":15,"tail":{"kind":"swallow","endWidthIn":10,"crotchDepthIn":2.75}},"marks":[{"role":"front","side":-1,"offTailIn":7.5,"lateralIn":-5.843851,"leadingOffTailIn":13,"leadingLateralIn":-5.656351,"baseLengthIn":5.5,"toeIn":0.1875},{"role":"front","side":1,"offTailIn":7.5,"lateralIn":5.843851,"leadingOffTailIn":13,"leadingLateralIn":5.656351,"baseLengthIn":5.5,"toeIn":0.1875}],"finSetup":"twin"},{"id":"midlength","name":"Mid-length","spec":{"lengthIn":86,"widePointWidthIn":21.25,"widePointOffsetIn":2.5,"tailRailLength":72.75,"noseRailLength":60,"noseAngle":65,"noseFullness":76,"tailAngle":90,"tailFullness":46.75,"tail":{"kind":"round"}},"marks":[{"role":"front","side":-1,"offTailIn":12,"lateralIn":-6.073404,"leadingOffTailIn":16.5,"leadingLateralIn":-5.823404,"baseLengthIn":4.5,"toeIn":0.25},{"role":"front","side":1,"offTailIn":12,"lateralIn":6.073404,"leadingOffTailIn":16.5,"leadingLateralIn":5.823404,"baseLengthIn":4.5,"toeIn":0.25},{"role":"center","side":0,"offTailIn":3.604167,"lateralIn":0,"leadingOffTailIn":8.104167,"leadingLateralIn":0,"baseLengthIn":4.5,"toeIn":0},{"role":"rear","side":-1,"offTailIn":6.25,"lateralIn":-4.130587,"leadingOffTailIn":10.25,"leadingLateralIn":-3.943087,"baseLengthIn":4,"toeIn":0.1875},{"role":"rear","side":1,"offTailIn":6.25,"lateralIn":4.130587,"leadingOffTailIn":10.25,"leadingLateralIn":3.943087,"baseLengthIn":4,"toeIn":0.1875}],"finSetup":"quad"},{"id":"longboard","name":"Longboard","spec":{"lengthIn":108,"widePointWidthIn":22.5,"widePointOffsetIn":3.5,"tailRailLength":40,"noseRailLength":87,"noseAngle":90,"noseFullness":90,"tailAngle":30,"tailFullness":46.75,"tail":{"kind":"squash","endWidthIn":8.5}},"marks":[{"role":"center","side":0,"offTailIn":5.5,"lateralIn":0,"leadingOffTailIn":16,"leadingLateralIn":0,"baseLengthIn":10.5,"toeIn":0}],"finSetup":"single"}]};
let drag = null; // the grab point being held, if any

/* curves.js — sketch 013. The app's outline curve (lib/geometry/outline.ts `buildOutline`), ported to inches
   line for line, plus the three wing constructions this sketch compares. Throwaway sketch code: the app's
   TypeScript stays the one truth, and check013.mjs proves this port reproduces its 161 points. */

const MARGIN = 16, DIAMOND_DEPTH_CAP = 5, DIAMOND_BLOCK_MARGIN = 2, MEASURE_STATION = 12;
const HANDLE_CAP = 0.48, OVERSHOOT = 0.92, SAMPLES_PER_SEGMENT = 80, EPSILON = 1e-6;
const railMult = (pct) => 0.8 + (pct / 100) * 0.8;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function tailHandleMaxLength(dirY, chord, cw, bw) {
  if (Math.abs(dirY) <= EPSILON) return HANDLE_CAP * chord;
  return Math.min(HANDLE_CAP * chord, (OVERSHOOT * (cw - bw)) / dirY);
}
function noseHandleMaxLength(dirY, chord, cw) {
  if (Math.abs(dirY) <= EPSILON) return HANDLE_CAP * chord;
  return Math.min(HANDLE_CAP * chord, (OVERSHOOT * cw) / Math.abs(dirY));
}
function bez1(p0, p1, p2, p3, t) { const mt = 1 - t; return mt * mt * mt * p0 + 3 * mt * mt * t * p1 + 3 * mt * t * t * p2 + t * t * t * p3; }

function interpolateHalfWidth(points, station) {
  for (let i = 0; i < points.length - 1; i++) {
    const [y0, x0] = points[i], [y1, x1] = points[i + 1];
    if (station >= y0 && station <= y1) { const t = y1 > y0 ? (station - y0) / (y1 - y0) : 0; return x0 + (x1 - x0) * t; }
  }
  return points[points.length - 1][1];
}

/* spec: { length, widePointWidth, widePointOffset, tailRailLength, noseRailLength, noseAngle, noseFullness,

  const down = vis.slice().reverse().map(([s, hw]) => `L ${r2(toX(-hw))} ${r2(toY(s))}`);
  return `${up.join(" ")} ${down.join(" ")} L ${r2(toX(0))} ${r2(toY(Math.min(g.centreCloseStation, hi)))} Z`;
}

/* The VIEWER tab: the whole board as the app frames it, wings applied, no wing controls anywhere. */
function templateSvg(board, g, wings, pts, basePts) {
  const L = g.length, scale = (620 - 48) / L, cxl = 170, tailPy = 596, tipPy = 24;
  const toY = (s) => tailPy - s * scale, toX = (hw) => cxl + hw * scale;
  const halfPx = g.cw * scale, overflow = Math.max(0, halfPx - (282 - 36.5 - cxl));
  const minX = -104 - overflow, width = 514 + 2 * overflow, chipRightX = 58 - overflow, valueX = 282 + overflow;
  const hwAt = (s) => wingedHalfWidth(g, wings, state.build, s);
  const wpS = g.widePointStation, midS = L / 2, noseS = L - 12, tailS = 12;
  let out = `<svg viewBox="${r2(minX)} -16 ${r2(width)} 638" font-family="var(--font-sans)">`;
  out += `<path d="${outlinePath(pts, g, toX, toY)}" fill="var(--outline-board-fill)" stroke="var(--outline-ink)" stroke-width="2" stroke-linejoin="round"/>`;
  out += `<line x1="${cxl}" y1="${tipPy - 6}" x2="${cxl}" y2="${tailPy + 6}" stroke="var(--outline-station-line)" stroke-dasharray="${STRINGER_DASH}"/>`;
  for (const [s, dash] of [[midS, STRINGER_DASH], [noseS, STATION_DASH], [tailS, STATION_DASH]]) { const hw = hwAt(s); out += `<line x1="${r2(toX(-hw))}" y1="${r2(toY(s))}" x2="${r2(toX(hw))}" y2="${r2(toY(s))}" stroke="var(--outline-station-line)" stroke-dasharray="${dash}"/>`; }
  out += `<line x1="${r2(toX(-g.cw))}" y1="${r2(toY(wpS))}" x2="${r2(toX(g.cw))}" y2="${r2(toY(wpS))}" stroke="var(--outline-widepoint-line)" stroke-dasharray="${WIDEPOINT_DASH}"/>`;
  out += `<circle cx="${r2(toX(-g.cw))}" cy="${r2(toY(wpS))}" r="2.6" fill="var(--outline-widepoint-knot)"/><circle cx="${r2(toX(g.cw))}" cy="${r2(toY(wpS))}" r="2.6" fill="var(--outline-widepoint-knot)"/>`;
  out += finLinesSvg(board, toX, toY);
  const outputs = [{ s: noseS, value: frac(2 * hwAt(noseS)), station: 'Nose @ 12"' }, { s: midS, value: frac(2 * hwAt(midS)), station: "Center" }, { s: tailS, value: frac(2 * hwAt(tailS)), station: 'Tail @ 12"' }];
  const oy = spread(outputs.map((o) => ({ y: toY(o.s) })), 40);
  outputs.forEach((o, i) => { out += outputSvg(toX(hwAt(o.s)), toY(o.s), oy[i], o.value, o.station, valueX); });
  const s = board.spec;
  out += chipSvg(chipRightX, tipPy, "LENGTH", `${Math.floor(L / 12 + 1e-9)}'${frac(L - 12 * Math.floor(L / 12 + 1e-9), 8)}`, null, { toX: cxl, atY: tipPy });
  out += chipSvg(chipRightX, toY(wpS), "WIDEPOINT", frac(s.widePointWidthIn, 8), "var(--outline-widepoint-knot)", { toX: toX(-g.cw), atY: toY(wpS) });
  out += chipSvg(chipRightX, toY(wpS) + CHIP_H + 6, "WP OFFSET", (s.widePointOffsetIn === 0 ? "0\"" : (s.widePointOffsetIn > 0 ? "+" : "−") + frac(Math.abs(s.widePointOffsetIn), 8)), null, null);
  const tailChips = [];
  if (!g.tailBlockPinned) tailChips.push({ y: toY(g.tailPodStation), name: "TAIL BLOCK", value: frac(2 * hwAt(g.tailPodStation + 1e-9), 8), toX: toX(-hwAt(g.tailPodStation + 1e-9)), color: null });
  for (const w of wings) tailChips.push({ y: toY(w.shown), name: w.label, value: `${frac(w.depth)} @ ${frac(w.shown, 8)}`, toX: toX(-hwAt(w.station + 1e-6)), color: null, atY: toY(w.station) });
  const cy = spread(tailChips.map((c) => ({ y: c.y })), CHIP_H + 6);
  tailChips.forEach((c, i) => { out += chipSvg(chipRightX, cy[i], c.name, c.value, c.color, { toX: c.toX, atY: c.atY ?? c.y }); });
  return out + "</svg>";
}

/* Which stretch of the board the WINGS tab shows. The 26" tail view until a wing passes 24"; then, by variant:
   A jumps to the whole board, B grows the window to hold the wing with 3" of room, C slides a 26" window up to it. */
function windowFor(board, wings) {
  // a window that moved under a drag would carry the wing away with it (found in this sketch's own drag check), so it holds still while a grab point is held
  if (drag && drag.win) return drag.win;
  const L = board.spec.lengthIn, Z = Number(state.zoom), maxS = wings.length ? Math.max(...wings.map((w) => w.station)) : 0;
  if (maxS <= 24) return [0, Math.min(Z, L)];
  if (state.variant === "a") return [0, L];
  if (state.variant === "b") return [0, Math.min(L, maxS + 3)];
  const hi = Math.min(L, maxS + 6); return [Math.max(0, hi - Z), hi];
}

/* The WINGS tab: the tail, closer — the same strokes, the wing's own dimensions, and the grab points. */
function closeUpSvg(board, g, wings, pts, basePts, { handles = false, compact = false, win = [0, 26] } = {}) {
  // the toolbar sits in the panel's top-right corner, so the drawing and its read-outs start below its row
  const [lo, hi] = win, span = hi - lo, padY = 16, padTop = compact ? 16 : 56, zs = (620 - padTop - padY) / span;
  const inWin = ([s]) => s >= lo - 1e-9 && s <= hi + 1e-9;
  const hwMax = Math.max(...pts.filter(inWin).map((p) => p[1]), ...basePts.filter(inWin).map((p) => p[1]), 0.5);
  const gutterL = compact ? 150 : 214, railR = compact ? 190 : 240, cx = gutterL + hwMax * zs + 20, W = Math.ceil(cx + hwMax * zs + 20 + railR), H = 620;
  const toY = (s) => H - padY - (s - lo) * zs, toX = (hw) => cx + hw * zs;
  const hwAt = (s) => wingedHalfWidth(g, wings, state.build, s);
  const tailShown = lo <= 0;
  void padTop;
  let out = `<svg class="close" data-closeup viewBox="0 0 ${W} ${H}" data-cx="${r2(cx)}" data-zs="${zs}" data-lo="${lo}" data-h="${H}" data-pady="${padY}" font-family="var(--font-sans)">`;
  if (wings.length) out += `<path d="${outlinePath(basePts, g, toX, toY, lo, hi)}" fill="none" stroke="var(--outline-ghost)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  out += `<path d="${outlinePath(pts, g, toX, toY, lo, hi)}" fill="var(--outline-board-fill)" stroke="none"/>`;
  const vis = pts.filter(([s]) => s >= Math.max(lo, g.tailPodStation) - 1e-9 && s <= hi + 1e-9);
  const right = vis.map(([s, hw], i) => `${i ? "L" : "M"} ${r2(toX(hw))} ${r2(toY(s))}`).join(" ");
  const left = vis.map(([s, hw], i) => `${i ? "L" : "M"} ${r2(toX(-hw))} ${r2(toY(s))}`).join(" ");
  const tailClose = tailShown ? `M ${r2(toX(-vis[0][1]))} ${r2(toY(vis[0][0]))} L ${r2(toX(0))} ${r2(toY(g.centreCloseStation))} L ${r2(toX(vis[0][1]))} ${r2(toY(vis[0][0]))}` : "";
  out += `<path d="${right} ${left} ${tailClose}" fill="none" stroke="var(--outline-ink)" stroke-width="2" stroke-linejoin="round"/>`;
  out += `<line x1="${r2(cx)}" y1="${r2(toY(hi) - 6)}" x2="${r2(cx)}" y2="${r2(toY(lo) + 6)}" stroke="var(--outline-station-line)" stroke-dasharray="${STRINGER_DASH}"/>`;
  const hw12 = hwAt(12);
  if (12 >= lo && 12 <= hi) out += `<line x1="${r2(toX(-hw12))}" y1="${r2(toY(12))}" x2="${r2(toX(hw12))}" y2="${r2(toY(12))}" stroke="var(--outline-station-line)" stroke-dasharray="${STATION_DASH}"/>`;
  if (g.length / 2 >= lo && g.length / 2 <= hi) { const hwm = hwAt(g.length / 2); out += `<line x1="${r2(toX(-hwm))}" y1="${r2(toY(g.length / 2))}" x2="${r2(toX(hwm))}" y2="${r2(toY(g.length / 2))}" stroke="var(--outline-station-line)" stroke-dasharray="${STRINGER_DASH}"/>`; }
  if (g.length - 12 >= lo && g.length - 12 <= hi) { const hwn = hwAt(g.length - 12); out += `<line x1="${r2(toX(-hwn))}" y1="${r2(toY(g.length - 12))}" x2="${r2(toX(hwn))}" y2="${r2(toY(g.length - 12))}" stroke="var(--outline-station-line)" stroke-dasharray="${STATION_DASH}"/>`; }
  if (g.widePointStation >= lo && g.widePointStation <= hi) out += `<line x1="${r2(toX(-g.cw))}" y1="${r2(toY(g.widePointStation))}" x2="${r2(toX(g.cw))}" y2="${r2(toY(g.widePointStation))}" stroke="var(--outline-widepoint-line)" stroke-dasharray="${WIDEPOINT_DASH}"/><circle cx="${r2(toX(-g.cw))}" cy="${r2(toY(g.widePointStation))}" r="2.6" fill="var(--outline-widepoint-knot)"/><circle cx="${r2(toX(g.cw))}" cy="${r2(toY(g.widePointStation))}" r="2.6" fill="var(--outline-widepoint-knot)"/>`;
  if (state.construction) for (const w of wings) { const f = wingFootprint(w); for (const s of [f.hi, f.inner]) out += `<circle cx="${r2(toX(hwAt(s + (s === f.hi ? 1e-6 : -1e-6))))}" cy="${r2(toY(s))}" r="3.5" fill="var(--outline-construction)"/>`; }
  out += finLinesSvg(board, toX, toY);
  const valueX = toX(hwMax) + (compact ? 96 : 124), extEnd = toX(hwMax) + 50;
  const outputs = [];
  if (12 >= lo && 12 <= hi) outputs.push({ s: 12, value: frac(2 * hw12), station: 'Tail @ 12"', edge: toX(hw12) });
  if (tailShown && !g.tailBlockPinned) outputs.push({ s: g.tailPodStation, value: frac(2 * hwAt(g.tailPodStation + 1e-9), 8), station: "Tail block", edge: toX(hwAt(g.tailPodStation + 1e-9)) });
  if (g.length / 2 >= lo && g.length / 2 <= hi && hi > 30) outputs.push({ s: g.length / 2, value: frac(2 * hwAt(g.length / 2)), station: "Center", edge: toX(hwAt(g.length / 2)) });
  if (g.length - 12 >= lo && g.length - 12 <= hi) outputs.push({ s: g.length - 12, value: frac(2 * hwAt(g.length - 12)), station: 'Nose @ 12"', edge: toX(hwAt(g.length - 12)) });
  for (const w of wings) {
    const f = wingFootprint(w), ahead = hwAt(f.hi + 1e-6), behind = hwAt(f.inner - 1e-6);
    outputs.push({ s: f.hi, value: frac(2 * ahead), station: `Ahead of ${w.label.toLowerCase()}`, edge: toX(ahead) });
    outputs.push({ s: f.inner, value: frac(2 * behind), station: `Behind ${w.label.toLowerCase()}`, edge: toX(behind) });
    const yd = toY(f.inner) + 18;
    out += `<line x1="${r2(toX(ahead))}" y1="${r2(toY(f.hi))}" x2="${r2(toX(ahead))}" y2="${r2(yd + 5)}" stroke="var(--outline-station-line)"/>`;
    out += `<line x1="${r2(toX(behind))}" y1="${r2(toY(f.inner))}" x2="${r2(toX(behind))}" y2="${r2(yd + 5)}" stroke="var(--outline-station-line)"/>`;
    out += dimH(toX(behind), toX(ahead), yd, frac(w.depth));
    if (w.run > 0 && toY(w.station - w.run) - toY(w.station) >= 10) { const x = extEnd + 2, y0 = toY(w.station), y1 = toY(w.station - w.run); out += `<g><line x1="${r2(x)}" y1="${r2(y0)}" x2="${r2(x)}" y2="${r2(y1)}" stroke="var(--outline-dim-ink)" stroke-width="1.1"/>${tickSvg(x, y0)}${tickSvg(x, y1)}<text class="val-svg" x="${r2(x + 7)}" y="${r2((y0 + y1) / 2 + 4.5)}" style="font-size:13px">${esc(frac(w.run, 8))}</text></g>`; }
    if (w.locked && state.showFins && w.finStation !== null) out += `<line x1="${r2(toX(0))}" y1="${r2(toY(w.finStation))}" x2="${r2(toX(-ahead) - 34)}" y2="${r2(toY(w.finStation))}" stroke="var(--outline-fin)" stroke-dasharray="2 3"/>`;
  }
  const oy = spread(outputs.map((o) => ({ y: toY(o.s) })), 40);
  outputs.forEach((o, i) => { out += outputSvg(o.edge, toY(o.s), oy[i], o.value, o.station, valueX); });
  const chipRight = gutterL - 14;
  const chips = wings.map((w) => ({ y: toY(w.shown), atY: toY(w.station), name: w.label + (w.locked ? " · FIN" : ""), value: `${frac(w.depth)} @ ${frac(w.shown, 8)}`, toX: toX(-hwAt(w.station + 1e-6)), color: w.locked ? "var(--outline-fin)" : null }));
  const cy = spread(chips.map((c) => ({ y: c.y })), CHIP_H + 6);
  chips.forEach((c, i) => { out += chipSvg(chipRight, cy[i], c.name, c.value, c.color, { toX: c.toX, atY: c.atY }); });
  if (!compact && tailShown) wings.forEach((w, wi) => { out += dimV(22 + wi * 30, toY(0), toY(w.shown), frac(w.shown, 8)); });
  // variant C: grab points, drawn like the app's own drag targets — a ring with a dot, on the RIGHT rail
  if (handles) for (const w of wings) {
    const f = wingFootprint(w), ahead = hwAt(f.hi + 1e-6), behind = hwAt(f.inner - 1e-6);
    const ring = (x, y, kind) => `<g class="handle" data-handle="${kind}" data-wing="${w.index}"><circle cx="${r2(x)}" cy="${r2(y)}" r="13" fill="var(--color-surface)" fill-opacity=".85" stroke="var(--outline-construction)" stroke-width="1.5"/><circle cx="${r2(x)}" cy="${r2(y)}" r="5" fill="var(--outline-drag)"/></g>`;
    // the depth-and-run point hangs 22 units below the inner corner, on the depth dimension's own extension line, so a sharp wing's two points never overlap
    out += ring(toX(ahead), toY(w.station), "outer") + ring(toX(behind), toY(w.station - w.run) + HANDLE_DROP, "inner");
  }
  return out + "</svg>";
}

function fmtOffset(v) { return v === 0 ? '0"' : (v > 0 ? "+" : "−") + frac(Math.abs(v)); }

function wingSection(w, i, board) {

    ${locked ? `<div class="two"><div><div class="lbl">Fin edge</div><div class="pair"><button data-wing="${i}" data-pick="edge" data-v="trailing" class="${w.edge === "trailing" ? "on" : ""}">Trailing</button><button data-wing="${i}" data-pick="edge" data-v="leading" class="${w.edge === "leading" ? "on" : ""}">Leading</button></div></div>${liveSlider(i, "finOffset", "Offset from the fin", -3, 3, w.finOffset, fmtOffset, ["Toward tail", "Toward nose"], false)}</div>` : ""}

function wingControls(board) {

  const sections = state.wings.map((w, i) => wingSection(w, i, board)).join("");
  const add = state.wings.length < 2 ? `<button class="btn" data-add="1">${state.wings.length ? "+ Add wing 2" : "+ Add a wing"}</button>` : "";
  return `<h1>Wings</h1><div class="sub">Up to two, locked to the front fin or placed by hand</div>
    ${sections}${add}
    <h3>Settings</h3>
    <label class="ck"><input type="checkbox" ${state.showFins ? "checked" : ""} data-check="showFins"> Show fins <span class="note">(marks only, no dims)</span></label>
    <label class="ck"><input type="checkbox" ${state.construction ? "checked" : ""} data-check="construction"> Show construction <span class="note">(the wing's grab points too)</span></label>
    <p class="note">${fin ? `Front fins ${dec(fin.offTailIn)} off the tail at the trailing edge, from the FINS page.` : "This board has no side fins."} Edit fin placement on FINS, then come back here.</p>
    <div class="stepnav"><button class="btn">Next → Rocker</button></div>`;
}
function toolbar(tab) {
  const b = (icon, on = false, toggle = "") => `<button type="button" class="tb ${on ? "on" : ""}" ${toggle ? `data-toggle="${toggle}"` : ""}>${ICONS[icon]}</button>`;
  const phone = state.device === "phone";
  if (tab === "wings") return `<div class="toolbar"><div class="rowb">${b("locate", state.construction, "construction")}${phone ? "" : b("panel")}</div></div>`;
  return `<div class="toolbar"><div class="rowb">${phone ? "" : b("rotate")}${b("download")}${b("locate", state.construction, "construction")}${phone ? "" : b("panel")}</div>${phone ? "" : `<div class="rowb">${b("zoomout")}<span class="tb zoomlvl">1x</span>${b("zoomin")}${b("wide")}</div>`}</div>`;
}
function panel(board, g, wings, pts, basePts) {
  const tab = state.tab, v = state.variant, phone = state.device === "phone";
  const wingsLabel = state.wings.length ? `Wings · ${state.wings.length}` : "Add wings";
  const tabs = `<div class="tabs"><button class="tab ${tab === "viewer" ? "on" : ""}" data-tab="viewer">Viewer</button><button class="tab ${tab === "wings" ? "on" : ""}" data-tab="wings">${wingsLabel}</button><span class="name">Untitled</span></div>`;
  let body;
  if (tab === "viewer") body = `<div class="drawing">${toolbar("viewer")}${templateSvg(board, g, wings, pts, basePts)}</div>`;
  else {
    const empty = state.wings.length === 0 ? `<div class="empty"><h2>No wings yet</h2><p>A wing is a step in the outline near the fins. Add one, then dial it in against the fin placement.</p><button class="btn primary" data-add="1">+ Add a wing</button></div>` : "";
    body = `<div class="drawing">${toolbar("wings")}${closeUpSvg(board, g, wings, pts, basePts, { handles: state.construction, compact: phone, win: windowFor(board, wings) })}${empty}</div>`;
  }
  return `<div class="main">${tabs}<div class="panel"><div class="inner">${body}</div></div></div>`;
}
function sidebar(board) {
  const v = state.variant, tab = state.tab;
  const content = tab === "wings" ? wingControls(board) : builderSidebar(board);
  return `<aside class="sidebar">${content}</aside>`;
}
function mockHtml() {
  const board = boardOf(), g = buildOutline(specOf(board.spec)), wings = resolveWings(board);
  const basePts = wingedPoints(g, [], "a", Number(state.zoom)), pts = wingedPoints(g, wings, state.build, Number(state.zoom));
  const phone = state.device === "phone";
  const inner = phone ? `${panel(board, g, wings, pts, basePts)}${sidebar(board)}` : `${sidebar(board)}${panel(board, g, wings, pts, basePts)}`;
  return `<div class="device ${state.device}">${topBar()}<div class="shell">${inner}</div><div id="popup" role="dialog" aria-modal="true"><div class="card"><h2>Dial in your wing placement</h2><p>Edit fin placement on the FINS page, then return to the TEMPLATE to fine tune the wing.</p><div class="acts"><button type="button" class="btn" data-popup="fins">Open FINS</button><button type="button" class="btn primary" data-popup="ok">Got it</button></div></div></div></div>`;
}

/* ---- render ---- */
const INTROS = {
  a: "<b>A — past 24\" the tab jumps to the whole board.</b> The 26\" tail view until a wing's position passes 24\"; then the WINGS tab shows the whole board at the VIEWER's scale, with the wing's dimensions on it. Slide Position past 24\" to see it switch.",
  b: "<b>B — the window grows with the wing (chosen).</b> The tail view stretches to hold the wing with 3\" of room above it, so the drawing shrinks a little with every inch the wing moves up, and the tail and fins never leave the picture. The sidebar wears the Template builder's own dress; Position starts at 2\", Run reaches 2\", every number moves in sixteenths, and the grab points come and go with Show construction, as the VIEWER's own points do.",
  c: "<b>C — the window follows the wing.</b> A 26\" window slides up the board with the wing, keeping the close-up's scale; the tail and the fins leave the picture once the wing is more than 20\" up.",
};
const SMOOTHING_NOTE = "<b>Smoothing is now a corner radius</b> (the founder, 2026-10-14): it rounds the wing's outer and inner corners, up to the largest radius whose two rounds fit on the step, so the run alone decides how long the step is along the stringer. A square 3/8\" step rounds up to 3/16\"; a 1\" run allows nearly 3\".";
function renderNav() {
  const nav = document.getElementById("variant-nav");
  nav.innerHTML = `<span class="sketch-id">Sketch 014</span>` + VARIANTS.map((v) => `<button class="variant-tab${v.winner ? " winner" : ""}${v.id === state.variant ? " active" : ""}" data-variant="${v.id}">${esc(v.label)}</button>`).join("") + `<button class="variant-tab notes-btn" data-notes="1">${document.getElementById("notes-panel").classList.contains("open") ? "Close notes" : "Notes"}</button>`;
}
function seg(key, options) { return `<span class="seg">${options.map(([v, label]) => `<button data-set="${key}" data-v="${v}" class="${String(state[key]) === String(v) ? "on" : ""}">${label}</button>`).join("")}</span>`; }
function renderBar() {
  document.getElementById("sketch-bar").innerHTML = `<span class="desc">The <b>WINGS tab</b>: the tail 26" closer with only the wing controls beside it. A wing may slide up to the board's centre for a stinger — so once it passes 24", how does the view scale?</span>
    <span class="grp"><span>Board</span>${seg("board", DATA.boards.map((b) => [b.id, b.name.replace(" board", "")]))}</span>
    <span class="grp"><span>Position marks</span>${seg("marks", [["start", "Step start"], ["middle", "Its middle"]])}</span>`;
}
function renderStage() {
  document.getElementById("stage").innerHTML = `<p class="intro">${INTROS[state.variant]} ${SMOOTHING_NOTE}</p>${mockHtml()}<p class="stage-note">The page is the app's TEMPLATE screen as it is today (top bar, Template builder sidebar, the VIEWER tab with its toolbar and the board name), with one tab added. The board is one of the app's own, its outline built by the app's curve and its fins placed by the FINS page with Import Template ticked. <b>Add a wing</b> from the WINGS tab: the first one switches Show fins on and asks you to dial in the placement. Remove both to see the empty tab. The ⚙ tools switch Slate / Daylight, computer / phone, and the tail window.</p>`;
}
function renderNotes() {
  document.getElementById("notes-panel").innerHTML = `
    <h2>Sketch 014 — the WINGS tab</h2>
    <p>The founder, 2026-10-14, on seeing sketch 013: "maybe we need an 'add wings' tab on the template page, which provides this zoomed in section of the tail. Then go back to viewer for the full board. That simplifies the controls too, since the add wings tab would only have the wing controls and the regular viewer doesn't need them at all." And on the first round of this sketch: "26\" tail view is great, but the wing position from tail should actually slide up to the center of the board (for stingers). In which case, we'll need a way to scale the board when the position is more than 24\" from the tail. Maybe >24\" we jump to full board view. Do not show board length or other template controls on the wing tab."</p>
    <p>So this round: the sidebar always swaps to the wing controls on the WINGS tab (round one's A, confirmed by the founder: "A, sidebar swaps"), the grab points are a toggle in the sketch bar (round one's C), Position runs to the board's centre, and the three variants are three ways the view scales past 24\". Smoothing became a corner radius at the founder's word: "maybe the smoothing should just be more of a radius rounder on the wing's outer and inner points rather than also adjusting along the stringer appearance."</p>
    <h3>What is drawn</h3>
    <ul>
      <li>The TEMPLATE page with a second tab beside VIEWER: <b>ADD WINGS</b> while the board has none, <b>WINGS · 1</b> or <b>· 2</b> once it does. The tab shows the last 26" of the tail at three times the VIEWER's scale, with the fins and the wing's dimensions.</li>
      <li><b>A:</b> past 24" the tab jumps to the whole board. <b>B:</b> the window grows to hold the wing with 3" of room. <b>C:</b> a 26" window slides up with the wing.</li>
      <li>The VIEWER tab draws the whole board with the wings applied and their chips, and no wing control anywhere.</li>
      <li>Adding the first wing turns Show fins on and opens the popup; Show fins also sits under Settings in both sidebars.</li>
    </ul>
    <h3>What to look for</h3>
    <ul>
      <li>The corner radius: with Run at 0 the radius tops out at half the depth (a square step can only round so far); at a 1" run it reaches nearly 3". Is a radius the right feel, and should its top be the step's own limit, as here, or a fixed 3"?</li>
      <li>Slide a wing up past 24" in each variant: a jump (A) is simple and keeps the fins in view, but the wing's dimensions shrink to the VIEWER's scale; growing (B) is gradual but a 36" stinger halves the close-up; following (C) keeps the scale and loses the tail. Which reads best for a stinger at 30"?</li>
      <li>On the phone the tab strip, the drawing and the controls beneath all stay where they are today; only the drawing's content and the controls' content change. Is that enough?</li>
      <li>C: is the outer grab point (position) and the inner one (depth and run) the right split? Should smoothing be a handle too?</li>
      <li>The empty tab: should the first wing be added from the tab, from the sidebar, or both?</li>
      <li>Sketch 013's question is still open and lives in the sketch bar: what happens to the tail behind the wing (A re-drawn to your block, B moved in, C a flyer).</li>
    </ul>`;
}
function renderTools() {
  document.getElementById("t-theme").innerHTML = ["slate", "daylight"].map((t) => `<button data-tool="theme" data-v="${t}" class="${state.theme === t ? "on" : ""}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("");
  document.getElementById("t-device").innerHTML = ["computer", "phone"].map((d) => `<button data-tool="device" data-v="${d}" class="${state.device === d ? "on" : ""}">${d[0].toUpperCase() + d.slice(1)}</button>`).join("");
  document.getElementById("t-zoom").innerHTML = ["20", "26", "32"].map((z) => `<button data-tool="zoom" data-v="${z}" class="${state.zoom === z ? "on" : ""}">${z}"</button>`).join("");
}
function applyTheme() {
  const root = document.documentElement.style;
  for (const [k, v] of Object.entries({ ...COMMON_VARS, ...PALETTES[state.theme] })) root.setProperty(k, v);
  const link = document.getElementById("theme-link"); if (link) link.href = `../themes/app-${state.theme}.css`;
}
function renderAll() { applyTheme(); renderNav(); renderBar(); renderNotes(); renderTools(); renderStage(); }
function openPopup() { const p = document.getElementById("popup"); if (p) p.classList.add("open"); }
function closePopup() { const p = document.getElementById("popup"); if (p) p.classList.remove("open"); }

document.getElementById("variant-nav").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.notes) { document.getElementById("notes-panel").classList.toggle("open"); renderNav(); return; }
  state.variant = b.dataset.variant; save(); renderAll();
});
document.getElementById("sketch-bar").addEventListener("click", (e) => { const b = e.target.closest("[data-set]"); if (!b) return; state[b.dataset.set] = b.dataset.v; save(); renderAll(); });
document.getElementById("sketch-tools").addEventListener("click", (e) => { const b = e.target.closest("[data-tool]"); if (!b) return; state[b.dataset.tool] = b.dataset.v; save(); renderAll(); });
document.getElementById("tools-toggle").onclick = () => document.getElementById("sketch-tools").classList.toggle("open");
const stage = document.getElementById("stage");
stage.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.popup) { closePopup(); return; }
  if (b.dataset.toggle) { state[b.dataset.toggle] = !state[b.dataset.toggle]; save(); renderStage(); return; }
  if (b.dataset.tab) { state.tab = b.dataset.tab; save(); renderStage(); return; }
  if (b.dataset.add) { addWing(); return; }
  if (b.dataset.remove !== undefined) { removeWing(Number(b.dataset.remove)); return; }
  if (b.dataset.pick) { state.wings[Number(b.dataset.wing)][b.dataset.pick] = b.dataset.v; save(); renderStage(); return; }
});
stage.addEventListener("click", (e) => { if (e.target.id === "popup") closePopup(); });
stage.addEventListener("input", (e) => {
  const el = e.target; if (!el.matches("input[type=range]") || el.disabled) return;
  state.wings[Number(el.dataset.wing)][el.dataset.field] = Number(el.value); save();
  const fmt = { station: (v) => frac(v), finOffset: fmtOffset, depth: (v) => frac(v), run: (v) => frac(v), smoothing: (v) => frac(v) }[el.dataset.field];
  const readout = el.previousElementSibling; if (readout && readout.classList.contains("lbl") && fmt) readout.textContent = `${el.dataset.label} — ${fmt(Number(el.value))}`;
  redrawDrawing();
  // run and depth change how much rounding fits, so the radius slider's top moves with them
  if (el.dataset.field === "run" || el.dataset.field === "depth") { const w = state.wings[Number(el.dataset.wing)], rs = stage.querySelector(`input[data-field="smoothing"][data-wing="${el.dataset.wing}"]`); if (rs) { const rmax = Math.floor(maxRadius({ run: w.run, depth: w.depth }) * 16) / 16; rs.max = Math.max(rmax, STEP); rs.value = Math.min(w.smoothing, rmax); const ro = rs.previousElementSibling; if (ro) ro.textContent = `Corner radius — ${frac(Number(rs.value))}`; const ends = rs.nextElementSibling; if (ends) ends.lastElementChild.textContent = `Round · ${frac(rmax)} fits`; } }
});
stage.addEventListener("change", (e) => {
  const el = e.target; if (!el.matches("input[type=checkbox]")) return;
  if (el.dataset.check === "lock") state.wings[Number(el.dataset.wing)].lock = el.checked;
  else state[el.dataset.check] = el.checked;
  save(); renderStage();
});
function redrawDrawing() {
  const board = boardOf(), g = buildOutline(specOf(board.spec)), wings = resolveWings(board);
  const basePts = wingedPoints(g, [], "a", Number(state.zoom)), pts = wingedPoints(g, wings, state.build, Number(state.zoom));
  const drawing = stage.querySelector(".drawing"); if (!drawing) return;
  const phone = state.device === "phone";
  drawing.innerHTML = state.tab === "viewer" ? `${toolbar("viewer")}${templateSvg(board, g, wings, pts, basePts)}` : `${toolbar("wings")}${closeUpSvg(board, g, wings, pts, basePts, { handles: state.construction, compact: phone, win: windowFor(board, wings) })}`;
}
/* variant C: dragging a grab point. The outer point slides the wing along the curve; the inner one sets depth and run. */
stage.addEventListener("pointerdown", (e) => {
  const h = e.target.closest("[data-handle]"); if (!h) return;
  const svg = h.closest("svg[data-closeup]"); if (!svg) return;
  e.preventDefault();
  drag = { kind: h.dataset.handle, wing: Number(h.dataset.wing), win: windowFor(boardOf(), resolveWings(boardOf())) };
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const svg = stage.querySelector("svg[data-closeup]"); if (!svg) return;
  const rect = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  // the drawing keeps its proportions inside its box (preserveAspectRatio meet), so one scale and a centred offset
  const k = Math.min(rect.width / vb.width, rect.height / vb.height);
  const ox = (rect.width - vb.width * k) / 2, oy = (rect.height - vb.height * k) / 2;
  const x = (e.clientX - rect.left - ox) / k, y = (e.clientY - rect.top - oy) / k;
  const cx = Number(svg.dataset.cx), zs = Number(svg.dataset.zs), H = Number(svg.dataset.h), padY = Number(svg.dataset.pady), lo = Number(svg.dataset.lo || 0);
  const station = lo + (H - padY - (drag.kind === "inner" ? y - HANDLE_DROP : y)) / zs, hw = Math.abs(x - cx) / zs;
  const board = boardOf(), g = buildOutline(specOf(board.spec)), w = state.wings[drag.wing], fin = frontFin(board);
  if (drag.kind === "outer") {
    // the wing slides along the curve you drew; with the lock on, the drag sets the offset from the fin
    const range = stationRange(board), target = Math.max(range[0], Math.min(range[1], snap(station, STEP)));
    if (w.lock && fin) w.finOffset = Math.max(-3, Math.min(3, snap(target - finEdgeStation(fin, w.edge), STEP))); else w.station = target;
  } else {
    const r = resolveWings(board)[drag.wing];
    const base = exactHalfWidthAt(g, r.station);
    w.depth = Math.max(STEP, Math.min(1, snap(base - hw, STEP)));
    w.run = Math.max(0, Math.min(2, snap(r.station - station, STEP)));
  }
  save(); redrawDrawing();
  const side = stage.querySelector(".sidebar"); if (side) for (const inp of side.querySelectorAll(`input[type=range][data-wing="${drag.wing}"]`)) { const f = inp.dataset.field; if (f in w) { inp.value = w[f]; const ro = inp.previousElementSibling; if (ro) ro.textContent = `${inp.dataset.label} — ${f === "finOffset" ? fmtOffset(w[f]) : frac(w[f])}`; } }
});
window.addEventListener("pointerup", () => { drag = null; });
window.addEventListener("pointercancel", () => { drag = null; });
renderAll();
</script>
</body>
</html>
